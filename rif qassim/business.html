/* ==== css/motion.css ==== */
/* ==========================================================================
   RIF QASSIM — Motion
   Motion only reveals the story, confirms an action, or shows changed data.
   ========================================================================== */

/* Cross-document page transitions (progressive enhancement) */
@view-transition {
  navigation: auto;
}

::view-transition-old(root),
::view-transition-new(root) {
  animation-duration: 360ms;
  animation-timing-function: var(--ease-out);
}

/* ---- Scroll reveal ---------------------------------------------------- */
/* Hidden state only applies once JS has confirmed it can reveal things,
   so content is never lost if scripts fail. */
.js [data-reveal] {
  opacity: 0;
  transform: translateY(24px);
  transition:
    opacity var(--dur-4) var(--ease-out),
    transform var(--dur-4) var(--ease-soft);
  transition-delay: calc(var(--i, 0) * 80ms);
}

.js [data-reveal="fade"] {
  transform: none;
}

.js [data-reveal="line"] {
  opacity: 1;
  transform: scaleX(0);
  transform-origin: var(--origin, right);
}

[dir="ltr"] [data-reveal="line"] { --origin: left; }

.js [data-reveal="mask"] {
  opacity: 1;
  transform: none;
  clip-path: inset(100% 0 0 0);
  transition: clip-path var(--dur-5) var(--ease-soft);
  transition-delay: calc(var(--i, 0) * 80ms);
}

.js [data-reveal].is-revealed {
  opacity: 1;
  transform: none;
}

.js [data-reveal="mask"].is-revealed {
  clip-path: inset(0 0 0 0);
}

/* Split headline lines rising from a mask */
.line-mask {
  display: block;
  overflow: hidden;
  padding-bottom: 0.08em;
}

.line-mask > span {
  display: block;
}

.js .line-mask > span {
  transform: translateY(105%);
  transition: transform var(--dur-5) var(--ease-soft);
  transition-delay: calc(var(--i, 0) * 110ms + 120ms);
}

.js .is-revealed .line-mask > span,
.js .line-mask.is-revealed > span {
  transform: none;
}

/* ---- Keyframes --------------------------------------------------------- */
@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes shimmer {
  to { transform: translateX(100%); }
}

@keyframes toast-in {
  from { opacity: 0; transform: translateY(16px) scale(0.98); }
  to { opacity: 1; transform: none; }
}

@keyframes toast-out {
  to { opacity: 0; transform: translateY(8px); }
}

@keyframes rise-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes field-error-in {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: none; }
}

@keyframes line-flash {
  0% { background-color: rgba(168, 104, 58, 0.16); }
  100% { background-color: transparent; }
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(168, 104, 58, 0.45); }
  70% { box-shadow: 0 0 0 10px rgba(168, 104, 58, 0); }
  100% { box-shadow: 0 0 0 0 rgba(168, 104, 58, 0); }
}

@keyframes draw {
  from { stroke-dashoffset: var(--len, 1000); }
  to { stroke-dashoffset: 0; }
}

@keyframes slow-drift {
  from { transform: scale(1.08) translate3d(0, 0, 0); }
  to { transform: scale(1.02) translate3d(0, -1.5%, 0); }
}

.anim-rise {
  animation: rise-in var(--dur-4) var(--ease-soft) both;
  animation-delay: calc(var(--i, 0) * 70ms);
}

.anim-fade {
  animation: fade-in var(--dur-4) var(--ease-out) both;
}

/* Numbers that change value (price totals, scores) */
.is-ticking {
  color: var(--rif-date);
  transition: color var(--dur-4) var(--ease-out);
}

/* ---- Reduced motion ---------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    transition-delay: 0ms !important;
    scroll-behavior: auto !important;
  }

  .js [data-reveal],
  .js [data-reveal="mask"],
  .js .line-mask > span {
    opacity: 1 !important;
    transform: none !important;
    clip-path: none !important;
  }

  @view-transition {
    navigation: none;
  }
}

/* ==== css/responsive.css ==== */
/* ==========================================================================
   RIF QASSIM — Responsive
   Breakpoints: 360 · 390 · 430 (phones), 768 (tablet), 1024 (laptop),
   1440 (desktop), 1920 (wide). Base styles are for phones.
   ========================================================================== */

/* ---- Small phones (≤ 389px): tighten without breaking ----------------- */
@media (max-width: 389px) {
  .btn {
    padding-inline: 1.15em;
  }

  .btn--lg {
    padding-inline: 1.4em;
  }

  .segmented__btn {
    padding-inline: 0.8em;
  }

  .stepper__btn {
    inline-size: 46px;
  }

  .tabs {
    gap: var(--space-4);
  }
}

/* ---- Phones: table becomes stacked rows ------------------------------ */
@media (max-width: 767px) {
  .table--stack thead {
    display: none;
  }

  .table--stack,
  .table--stack tbody,
  .table--stack tr,
  .table--stack td {
    display: block;
    inline-size: 100%;
  }

  .table--stack tr {
    padding: var(--space-4);
    border-bottom: 1px solid var(--color-line);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-2) var(--space-4);
  }

  .table--stack td {
    padding: 0;
    border: 0;
  }

  .table--stack td[data-label]::before {
    content: attr(data-label);
    display: block;
    font-size: var(--fs-micro);
    color: var(--color-text-faint);
  }

  .table--stack td.cell--primary {
    grid-column: 1 / -1;
    font-weight: var(--fw-medium);
  }

  .table--stack td.cell--primary::before {
    display: none;
  }

  /* Swipe rails for cards on phones */
  .rail-mobile {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 82%;
    grid-template-columns: none;
    gap: var(--space-4);
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-padding-inline: var(--gutter);
    padding-inline: var(--gutter);
    margin-inline: calc(var(--gutter) * -1);
    padding-bottom: var(--space-3);
    scrollbar-width: none;
    overscroll-behavior-x: contain;
  }

  .rail-mobile::-webkit-scrollbar {
    display: none;
  }

  .rail-mobile > * {
    scroll-snap-align: start;
  }

  .hide-mobile {
    display: none !important;
  }

  .demo-fab__text {
    display: none;
  }

  .demo-fab {
    padding-inline: 0.75em;
  }
}

/* ---- Tablet (≥ 768px) ------------------------------------------------- */
@media (min-width: 768px) {
  .grid--2 { --cols: 2; }
  .grid--3 { --cols: 2; }
  .grid--4 { --cols: 2; }

  .footer__grid {
    grid-template-columns: 1.3fr 1fr;
  }

  .footer__links {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  /* Modal becomes a centred dialog */
  .modal {
    inset: 50% auto auto 50%;
    inline-size: min(640px, calc(100vw - var(--space-8)));
    max-block-size: min(86vh, 860px);
    border-radius: var(--radius-md);
    transform: translate(-50%, -46%) scale(0.98);
    opacity: 0;
    transition: transform var(--dur-3) var(--ease-soft), opacity var(--dur-3) var(--ease-out);
  }

  .modal.is-open {
    transform: translate(-50%, -50%);
    opacity: 1;
  }

  .modal--wide {
    inline-size: min(960px, calc(100vw - var(--space-8)));
  }

  /* Drawer slides from the inline-end edge */
  .drawer {
    inset-block: 0;
    inset-inline-start: auto;
    inset-inline-end: 0;
    inline-size: min(520px, 92vw);
    transform: translateX(-100%);
    box-shadow: var(--shadow-float);
  }

  [dir="ltr"] .drawer {
    transform: translateX(100%);
  }

  .drawer.is-open,
  [dir="ltr"] .drawer.is-open {
    transform: none;
  }

  .drawer--wide {
    inline-size: min(720px, 92vw);
  }

  .toast-region {
    inset-inline: auto;
    inset-inline-start: 50%;
    transform: translateX(50%);
    inline-size: 460px;
  }

  [dir="ltr"] .toast-region {
    transform: translateX(-50%);
  }

  .hide-tablet-up {
    display: none !important;
  }
}

/* ---- Laptop (≥ 1024px): desktop navigation ---------------------------- */
@media (min-width: 1024px) {
  .grid--3 { --cols: 3; }
  .grid--4 { --cols: 4; }

  .site-nav {
    display: block;
  }

  .site-header__actions .site-header__cta {
    display: inline-flex;
  }

  .menu-button {
    display: none;
  }

  .bottom-nav {
    display: none;
  }

  body.has-bottom-nav {
    padding-bottom: 0;
  }

  body.has-bottom-nav .toast-region,
  body.has-bottom-nav .demo-fab {
    bottom: calc(var(--space-5) + env(safe-area-inset-bottom, 0px));
  }

  .demo-fab {
    inset-inline-end: var(--space-5);
    bottom: var(--space-5);
  }

  .footer__grid {
    grid-template-columns: 1.4fr 1.6fr auto;
    align-items: start;
  }

  .hide-desktop {
    display: none !important;
  }
}

/* ---- Hover-capable devices: hospitality card reveal ------------------- */
@media (hover: hover) and (pointer: fine) {
  .dest-card__reveal {
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    transition:
      grid-template-rows var(--dur-4) var(--ease-soft),
      opacity var(--dur-3) var(--ease-out);
  }

  .dest-card__reveal > div {
    overflow: hidden;
    display: grid;
    gap: var(--space-3);
  }

  .dest-card:hover .dest-card__reveal,
  .dest-card:focus-within .dest-card__reveal {
    grid-template-rows: 1fr;
    opacity: 1;
  }

  .dest-card:hover .dest-card__media > img,
  .dest-card:hover .dest-card__media > .media__scene {
    transform: scale(1.045);
  }

  .dest-card__cta .icon--dir {
    transition: transform var(--dur-3) var(--ease-out);
  }

  .dest-card:hover .dest-card__cta .icon--dir {
    transform: translateX(4px);
  }

  [dir="rtl"] .dest-card:hover .dest-card__cta .icon--dir {
    transform: scaleX(-1) translateX(4px);
  }
}

/* ---- Desktop (≥ 1440px) ----------------------------------------------- */
@media (min-width: 1440px) {
  :root {
    --header-h: 84px;
  }
}

/* ---- Wide (≥ 1920px): keep measure, grow breathing room -------------- */

/* ==== css/pages/business.css ==== */
/* ==========================================================================
   Owner landing — a consultation, told like the homepage
   ========================================================================== */

/* ---- The journey: five steps on one rule ----------------------------- */
.ob-journey {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 0;
  counter-reset: none;
}

.ob-step {
  position: relative;
  display: grid;
  grid-template-columns: 3rem 1fr;
  gap: var(--space-4);
  padding-block: var(--space-5);
  border-top: 1px solid var(--color-line);
}

.ob-step__num {
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  color: var(--rif-date);
}

.ob-step__title {
  font-size: var(--fs-h3);
  font-weight: var(--fw-regular);
  line-height: 1.35;
}

.ob-step__text {
  margin-top: var(--space-2);
  color: var(--color-text-muted);
  font-size: var(--fs-small);
  max-inline-size: 34ch;
}

.ob-step__who {
  display: inline-block;
  margin-top: var(--space-3);
  font-size: var(--fs-micro);
  color: var(--color-text-faint);
}

@media (min-width: 1024px) {
  .ob-journey {
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: var(--space-5);
  }

  .ob-step {
    grid-template-columns: 1fr;
    gap: var(--space-3);
    padding-top: var(--space-6);
    border-top: 0;
  }

  /* The rule runs through the step markers */
  .ob-step::before {
    content: "";
    position: absolute;
    top: 0;
    inset-inline: 0 calc(var(--space-5) * -1);
    block-size: 1px;
    background: var(--color-line-strong);
  }

  .ob-step:last-child::before {
    inset-inline-end: 0;
  }

  .ob-step::after {
    content: "";
    position: absolute;
    top: -4px;
    inset-inline-start: 0;
    inline-size: 9px;
    block-size: 9px;
    border-radius: 50%;
    background: var(--color-bg);
    border: 1px solid var(--rif-olive);
  }

  .ob-step:last-child::after {
    background: var(--rif-olive);
  }
}

/* ---- What you get ---------------------------------------------------- */
.ob-get {
  display: grid;
  gap: var(--space-8);
}

.ob-get__list {
  list-style: none;
  margin: 0;
  padding: 0;
  border-top: 1px solid var(--color-line-strong);
}

.ob-get__list li {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: var(--space-4);
  padding-block: var(--space-5);
  border-bottom: 1px solid var(--color-line);
}

.ob-get__list .icon {
  color: var(--rif-olive);
  margin-top: 4px;
}

.ob-get__list h3 {
  font-size: var(--fs-h4);
  font-weight: var(--fw-medium);
}

.ob-get__list p {
  margin-top: var(--space-1);
  color: var(--color-text-muted);
  font-size: var(--fs-small);
}

@media (min-width: 1024px) {
  .ob-get {
    grid-template-columns: 1fr 1.05fr;
    align-items: center;
  }
}

/* ---- What we read: the five dimensions ---------------------------- */
.ob-dims {
  display: grid;
  gap: 0;
  border-top: 1px solid var(--color-line-on-dark);
}

.ob-dim {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: var(--space-2) var(--space-5);
  padding-block: var(--space-5);
  border-bottom: 1px solid var(--color-line-on-dark);
}

.ob-dim h3 {
  font-size: var(--fs-h3);
  font-weight: var(--fw-light);
}

.ob-dim p {
  grid-column: 1 / -1;
  color: var(--color-on-dark-muted);
  font-size: var(--fs-small);
  max-inline-size: 60ch;
}

.ob-dim__weight {
  font-family: var(--font-en);
  font-size: var(--fs-h3);
  font-weight: var(--fw-light);
  color: var(--rif-date-soft);
}

.ob-dim__bar {
  grid-column: 1 / -1;
  block-size: 2px;
  background: var(--color-line-on-dark);
}

.ob-dim__bar span {
  display: block;
  block-size: 100%;
  inline-size: calc(var(--w) * 100% / 0.3);
  background: var(--rif-sage);
}

@media (min-width: 1024px) {
  .ob-read {
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: var(--space-9);
    align-items: start;
  }
}

/* ---- From land to destination (demo cases) ------------------------- */
.ob-cases {
  display: grid;
  gap: var(--space-6);
}

.ob-case {
  position: relative;
  display: grid;
  gap: var(--space-4);
}

.ob-case .media {
  --ratio: 4 / 3;
  border-radius: var(--radius-sm);
}

.ob-case__stage {
  display: flex;
  justify-content: space-between;
  gap: var(--space-3);
  font-size: var(--fs-meta);
  color: var(--color-text-muted);
}

.ob-case__track {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}

.ob-case__track span {
  block-size: 3px;
  background: var(--color-line);
}

.ob-case__track span.is-done {
  background: var(--rif-olive);
}

.ob-case h3 a {
  text-decoration: none;
}

.ob-case h3 a::after {
  content: "";
  position: absolute;
  inset: 0;
}

@media (min-width: 768px) {
  .ob-cases {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

/* ---- Prepare + FAQ ------------------------------------------------- */
.ob-prep {
  display: grid;
  gap: var(--space-8);
}

.ob-prep__list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: var(--space-3);
}

.ob-prep__list li {
  display: flex;
  gap: var(--space-3);
  align-items: center;
  padding: var(--space-4);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  background: var(--rif-white);
}

.ob-prep__list .icon {
  color: var(--rif-olive);
}

@media (min-width: 1024px) {
  .ob-prep {
    grid-template-columns: 1fr 1.2fr;
    gap: var(--space-9);
    align-items: start;
  }
}

.ob-resume {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding: var(--space-5);
  border: 1px solid var(--rif-olive);
  border-radius: var(--radius-sm);
  background: #F1F1E8;
}

__def("js/core/store.js", function (__bind) {
/* ==========================================================================
   Store
   One place for application state. Slices marked `persist` are saved to
   localStorage so drafts survive reloads and the visitor / owner / admin
   pages share the same demo data — this is what closes the end-to-end loop
   (a booking made as a visitor shows up in admin).

   Later, persisted slices map 1:1 onto backend tables / API resources.
   ========================================================================== */

const PREFIX = "rif:v1:";

/** Slice definitions: default value + whether it is persisted. */
const SLICES = {
  lang: { persist: true, initial: () => "ar" },

  /* Visitor */
  bookingDraft: {
    persist: true,
    initial: () => ({
      packageId: null,
      destinationId: null,
      date: null, // ISO yyyy-mm-dd
      guests: 2,
      addOns: [], // add-on ids
      step: 1,
      contact: { name: "", phone: "", email: "" },
    }),
  },
  userBookings: { persist: true, initial: () => [] }, // bookings created in the demo
  interests: { persist: true, initial: () => [] }, // "notify me" requests for upcoming destinations

  /* Farm owner */
  assessmentDraft: { persist: true, initial: () => ({ step: 1, answers: {}, uploads: {} }) },
  assessmentResult: { persist: true, initial: () => null },
  assumptions: { persist: true, initial: () => null }, // null → defaults from data
  scenario: { persist: true, initial: () => "base" },
  studyRequests: { persist: true, initial: () => [] },
  submittedFarms: { persist: true, initial: () => [] }, // owner submissions → admin pipeline
  ownerMessages: { persist: true, initial: () => [] },

  /* Internal RIF */
  farmStages: { persist: true, initial: () => ({}) }, // farmId → stage override
  bookingStatuses: { persist: true, initial: () => ({}) }, // bookingId → status override
  studyStatuses: { persist: true, initial: () => ({}) }, // seed study request id → status override
  contentOverrides: { persist: true, initial: () => ({ destinations: {}, experiences: {}, packages: {} }) }, // admin demo edits

  /* UI only */
  ui: { persist: false, initial: () => ({ menuOpen: false }) },
};

const state = {};
const listeners = new Map(); // slice → Set<fn>

const memoryStorage = new Map();
const storage = (() => {
  try {
    const k = "__rif_test__";
    window.localStorage.setItem(k, "1");
    window.localStorage.removeItem(k);
    return window.localStorage;
  } catch {
    // Private mode / non-browser: fall back to memory for this session
    return {
      getItem: (k) => (memoryStorage.has(k) ? memoryStorage.get(k) : null),
      setItem: (k, v) => memoryStorage.set(k, String(v)),
      removeItem: (k) => memoryStorage.delete(k),
    };
  }
})();

function load(name) {
  const def = SLICES[name];
  if (!def) throw new Error(`Unknown store slice: ${name}`);
  if (def.persist) {
    try {
      const rawValue = storage.getItem(PREFIX + name);
      if (rawValue !== null) return JSON.parse(rawValue);
    } catch {
      /* corrupted value: fall through to the initial value */
    }
  }
  return def.initial();
}

function save(name) {
  if (!SLICES[name].persist) return;
  try {
    storage.setItem(PREFIX + name, JSON.stringify(state[name]));
  } catch {
    /* quota exceeded: keep in memory */
  }
}

function emit(name) {
  listeners.get(name)?.forEach((fn) => {
    try {
      fn(state[name]);
    } catch (err) {
      console.error(err);
    }
  });
}

const isPlainObject = (v) => v !== null && typeof v === "object" && !Array.isArray(v);

const store = {
  /** Read a slice (loaded lazily). */
  get(name) {
    if (!(name in state)) state[name] = load(name);
    return state[name];
  },

  /**
   * Update a slice. Objects are shallow-merged; arrays and primitives are
   * replaced. Pass a function to compute the next value from the current one.
   */
  set(name, next) {
    const current = this.get(name);
    let value = typeof next === "function" ? next(current) : next;
    if (isPlainObject(current) && isPlainObject(value)) value = { ...current, ...value };
    state[name] = value;
    save(name);
    emit(name);
    return value;
  },

  /** Restore a slice to its initial value. */
  reset(name) {
    state[name] = SLICES[name].initial();
    if (SLICES[name].persist) storage.removeItem(PREFIX + name);
    emit(name);
    return state[name];
  },

  subscribe(name, fn) {
    if (!listeners.has(name)) listeners.set(name, new Set());
    listeners.get(name).add(fn);
    return () => listeners.get(name).delete(fn);
  },

  /** Wipe every persisted demo value except the language preference. */
  resetDemo() {
    Object.keys(SLICES).forEach((name) => {
      if (name !== "lang") this.reset(name);
    });
  },
};

/* Keep tabs in sync: a booking made in one tab appears in an open admin tab */
if (typeof window !== "undefined") {
  window.addEventListener("storage", (e) => {
    if (!e.key || !e.key.startsWith(PREFIX)) return;
    const name = e.key.slice(PREFIX.length);
    if (!SLICES[name]) return;
    state[name] = load(name);
    emit(name);
  });
}

__bind({ store: () => store });
});

/* ==========================================================================
   i18n
   Arabic is the primary experience. English swaps direction, fonts and
   strings. Data content uses { ar, en } objects where translated; plain
   strings are Arabic-only content and are shown as-is.
   ========================================================================== */

const { STRINGS } = __req("js/data/strings.js");
const dictionaries = { ar: { ...STRINGS.ar }, en: { ...STRINGS.en } };

const LANGS = ["ar", "en"];

function getLang() {
  const lang = store.get("lang");
  return LANGS.includes(lang) ? lang : "ar";
}

const isRTL = () => getLang() === "ar";

/** Apply lang + dir to <html> (called before first paint by each page). */
function applyDocumentLanguage() {
  const lang = getLang();
  const root = document.documentElement;
  root.lang = lang;
  root.dir = lang === "ar" ? "rtl" : "ltr";
}

/**
 * Change language. Pages render from data on load, so a reload is the most
 * reliable way to re-render everything; the view transition keeps it calm.
 */
function setLang(lang) {
  if (!LANGS.includes(lang) || lang === getLang()) return;
  store.set("lang", lang);
  window.location.reload();
}

/** Add page-specific strings: register({ ar: {...}, en: {...} }) */
function register(dict) {
  LANGS.forEach((l) => Object.assign(dictionaries[l], dict[l] || {}));

  if (value === null || value === undefined) return "";
  if (typeof value === "object" && !Array.isArray(value) && ("ar" in value || "en" in value)) {
    return value[getLang()] ?? value.ar ?? value.en ?? "";
  }
  return value;

    el.dataset.i18nAttr.split(";").forEach((pair) => {

/* ==========================================================================
   Paths & routes
   Resolved from this file's location, so links and assets work whether the
   prototype is served from a domain root, a sub-folder, or a local server —
   and from both /index.html and /pages/*.html.
   ========================================================================== */

const ROOT = new URL("./", location.href);

/** Absolute URL for an asset path relative to the project root. */
const asset = (path) => new URL(path, ROOT).href;

/* Page links in one place, so a renamed page is a one-line change */
const ROUTES = {
  home: "index.html",
  destinations: "destinations.html",
  destination: "destination.html",
  experiences: "experiences.html",
  booking: "booking.html",
  business: "business.html",
  assessment: "assessment.html",
  result: "result.html",
  owner: "owner.html",
  admin: "admin.html",
  about: "index.html#about",
  contact: "index.html#contact",
  styleguide: "index.html",
};

/* Pages delivered so far. Links to pages from later build parts are caught
   by the shell and explained, instead of leading to a 404. Add each page
   here as its part is delivered. */
const READY = new Set(["home", "destinations", "destination", "experiences", "booking", "business", "assessment", "result", "owner", "styleguide", "about", "contact"]);

const PART_OF = { experiences: 3, booking: 3, business: 4, assessment: 4, result: 4, owner: 5, admin: 6 };

/** Which build part delivers a route that isn't ready yet (or null). */
function pendingPart(href) {
  try {
    const u = new URL(href, location.href);
    const here = new URL(location.href);
    if (u.pathname === here.pathname) return null;
    if (/preview-(home|destinations|destination|experiences|booking|business|assessment|result|owner|admin)\.html$/.test(u.pathname)) return null;
    if (u.protocol === "mailto:") return null;
    return /\.html$/.test(u.pathname) ? "preview" : null;
  } catch {
    return null;
  }
}

/**
 * route("destination", { id: "sidr" }) → ".../pages/destination-detail.html?id=sidr"
 */
function route(name, params) {
  const target = ROUTES[name] || ROUTES.home;
  const [path, hash] = target.split("#");
  const url = new URL(path, ROOT);
  if (params) {
    Object.entries(params).forEach(([k, v]) => {
      if (v !== undefined && v !== null && v !== "") url.searchParams.set(k, v);
    });
  }
  if (hash) url.hash = hash;
  return url.href;
}

 *   foot?: string|SafeHTML, wide?: boolean, onOpen?: (panel) => void,

/* ==========================================================================
   Toasts — short confirmations of an action ("حُفظت المسودة").
   Announced to screen readers through a polite live region.
   ========================================================================== */

const { fragment, html } = __req("js/core/dom.js");
const { icon } = __req("js/components/icons.js");
function region() {
  let el = document.querySelector(".toast-region");
  if (!el) {
    el = document.createElement("div");
    el.className = "toast-region";
    el.setAttribute("role", "status");
    el.setAttribute("aria-live", "polite");
    document.body.append(el);
  }
  return el;
}

/**
 * @param {string} message
 * @param {{ type?: "success"|"error"|"info", duration?: number,
 *           action?: { label: string, onClick: () => void } }} opts
 */
function toast(message, { type = "success", duration = 3200, action } = {}) {
  const iconName = type === "error" ? "alert" : type === "info" ? "info" : "check";
  const el = fragment(html`
    <div class="toast toast--${type}">
      <span class="toast__icon">${icon(iconName)}</span>
      <span class="toast__msg">${message}</span>
      ${action ? html`<button type="button" class="toast__action">${action.label}</button>` : ""}
    </div>
  `);
  if (action) {
    el.querySelector(".toast__action").addEventListener("click", () => {
      action.onClick();
      dismiss();
    });
  }
  region().append(el);

  let timer = setTimeout(dismiss, duration);
  el.addEventListener("mouseenter", () => clearTimeout(timer));
  el.addEventListener("mouseleave", () => (timer = setTimeout(dismiss, 1600)));

  function dismiss() {
    clearTimeout(timer);
    el.classList.add("is-leaving");
    setTimeout(() => el.remove(), 260);
  }
  return dismiss;
}

function probe(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img.naturalWidth > 0 ? url : null);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

async function firstLoadable(list) {
  for (const path of list) {
    const ok = await probe(asset(path));

  }
  return null;

    /* ignore */
  }
  const main = BRAND.logo.file ? await firstLoadable([BRAND.logo.file]) : null;
  const light = main && BRAND.logo.fileOnDark ? await firstLoadable([BRAND.logo.fileOnDark]) : null;

  if (BRAND.logo.file && !main) console.warn(`Rif logo not found at ${BRAND.logo.file} — showing the wordmark.`);

function wireMenu() {
  const menu = $("[data-menu]");
  if (!menu) return;
  let release = null;
  let lastTrigger = null;

  const open = (trigger) => {
    lastTrigger = trigger;
    menu.hidden = false;
    requestAnimationFrame(() => menu.classList.add("is-open"));
    document.body.classList.add("no-scroll");
    $$("[data-menu-open]").forEach((b) => b.setAttribute("aria-expanded", "true"));
    release = trapFocus(menu);
    setTimeout(() => $("[data-menu-close]", menu).focus(), 60);
  };
  const close = () => {
    menu.classList.remove("is-open");
    document.body.classList.remove("no-scroll");
    $$("[data-menu-open]").forEach((b) => b.setAttribute("aria-expanded", "false"));
    release?.();
    setTimeout(() => (menu.hidden = true), 700);
    lastTrigger?.focus?.();
  };

  $$("[data-menu-open]").forEach((b) => b.addEventListener("click", () => open(b)));
  $("[data-menu-close]", menu).addEventListener("click", close);
  menu.addEventListener("keydown", (e) => e.key === "Escape" && close());
  menu.addEventListener("click", (e) => {
    if (e.target.closest("a")) close();
  });
}

function wireScroll(header, variant) {
  if (!header) return;
  let lastY = window.scrollY;
  let ticking = false;
  const cta = $("[data-header-cta]", header);

  const update = () => {
    const y = window.scrollY;
    const scrolled = y > 40;
    header.classList.toggle("is-scrolled", scrolled);
    if (variant === "overlay") {
      header.classList.toggle("on-dark", !scrolled);
      if (cta) {
        cta.classList.toggle("btn--outline-light", !scrolled);
        cta.classList.toggle("btn--primary", scrolled);
      }
      applyLogo(logoState);
    }
    const goingDown = y > lastY;
    const menuOpen = !$("[data-menu]")?.hidden;
    const hide = goingDown && y > 480 && !menuOpen;
    header.classList.toggle("is-hidden", hide);
    document.body.classList.toggle("header-hidden", hide);
    lastY = y;
    ticking = false;
  };
  window.addEventListener(
    "scroll",
    () => {
      if (!ticking) {
        requestAnimationFrame(update);
        ticking = true;
      }
    },
    { passive: true }
  );
  // When keyboard focus lands in the header, make sure it's visible
  header.addEventListener("focusin", () => {
    header.classList.remove("is-hidden");
    document.body.classList.remove("header-hidden");
  });
  update();
}

  observeReveals();

  return { header: headerNode };
}

__def("js/core/format.js", function (__bind) {
/* ==========================================================================
   Formatting
   Western digits in both languages (common in Saudi product UI and easier to
   scan in numbers-heavy screens). Dates are always Gregorian — the default
   ar-SA calendar is Hijri, so the calendar is set explicitly.
   ========================================================================== */

const { getLang } = __req("js/core/i18n.js");
const localeFor = (lang = getLang()) => (lang === "ar" ? "ar-SA-u-nu-latn-ca-gregory" : "en-GB-u-ca-gregory");

function formatNumber(n, { decimals = 0 } = {}) {
  if (!Number.isFinite(n)) return "—";
  return new Intl.NumberFormat(localeFor(), {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals,
  }).format(n);
}

/** 850 → "850 ر.س" / "SAR 850" */
function formatMoney(n, { decimals = 0, compact = false } = {}) {
  if (!Number.isFinite(n)) return "—";
  const num = compact ? formatCompact(n) : formatNumber(n, { decimals });
  return getLang() === "ar" ? `${num} ر.س` : `SAR ${num}`;
}

/** 1 250 000 → "1.25 مليون" / "1.25M" */

    s += band(470, 8, c.far, r, 2);
    for (let i = 0; i < 7; i++) s += palm(100 + i * 230 + r() * 80, 485, 70 + r() * 60, c.mid, r, 0);
    s += `<rect y="480" width="1600" height="520" fill="${c.ground}"/>`;
    const vx = 800 + (r() - 0.5) * 300;
    for (let i = -14; i <= 14; i++) {
      s += `<path d="M${f(vx + i * 14)} 480 L${f(vx + i * 150)} 1000" stroke="${i % 2 ? c.ground2 : c.ink}" stroke-opacity="${i % 2 ? 0.7 : 0.35}" stroke-width="${i % 2 ? 9 : 3}"/>`;
    }
    return s;
  },

  dunes(id, c, r) {
    let s = sky(id, c, true, [0.25 + r() * 0.5, 0.5], 80);
    if (c.light === 2) s += stars(r, 160, c.sun);
    s += band(560, 40, c.far, r, 1.5);
    s += band(640, 55, c.mid, r, 1.2);
    for (let i = 0; i < 4; i++) s += shrub(150 + r() * 1300, 700 + r() * 60, 40 + r() * 40, c.ink, r);
    s += band(760, 45, c.ground, r, 1);
    s += band(880, 30, c.ground2, r, 1.4);
    return s;
  },

  mudbrick(id, c, r) {
    let s = sky(id, c, c.light > 0, [0.78, 0.4], 60);
    const wall = c.light === 0 ? "#C9A98A" : c.light === 1 ? "#8A5F43" : "#3B2E25";
    const shade = c.light === 0 ? "#B38F70" : c.light === 1 ? "#6B4733" : "#2C221B";
    const dark = c.light === 2 ? "#E8B478" : c.ink;
    s += `<rect y="760" width="1600" height="240" fill="${c.ground}"/>`;
    // two volumes
    const vols = [
      [180 + r() * 60, 380, 700, 400],
      [860, 470, 560, 310],
    ];
    vols.forEach(([x, y, w, h], vi) => {
      s += `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="${vi ? shade : wall}"/>`;
      // Najdi triangular crenellation
      const n = Math.floor(w / 46);
      for (let i = 0; i < n; i++) {
        const tx = x + i * (w / n);
        s += `<path d="M${f(tx + 6)} ${f(y)} L${f(tx + w / n / 2)} ${f(y - 30)} L${f(tx + w / n - 6)} ${f(y)} Z" fill="${vi ? shade : wall}"/>`;
      }
      // small triangular vents
      for (let i = 0; i < n - 1; i += 2) {
        const tx = x + 30 + i * (w / n);
        s += `<path d="M${f(tx)} ${f(y + 50)} l12 -18 l12 18 Z" fill="${dark}" opacity=".55"/>`;
      }
      // windows
      const wins = vi ? 3 : 4;
      for (let i = 0; i < wins; i++) {
        const wx = x + 70 + i * ((w - 140) / (wins - 1)) - 20;
        s += `<rect x="${f(wx)}" y="${f(y + 120)}" width="40" height="64" fill="${dark}" opacity="${c.light === 2 ? 0.9 : 0.6}"/>`;
      }
      if (!vi) s += `<rect x="${f(x + w / 2 - 55)}" y="${f(y + h - 190)}" width="110" height="190" fill="${dark}" opacity=".75"/>`;
    });
    // texture: horizontal mud courses
    for (let i = 0; i < 18; i++) s += `<path d="M180 ${400 + i * 21} H1420" stroke="${c.ink}" stroke-opacity=".05" stroke-width="2"/>`;
    s += palm(1480, 800, 520, c.ink, r, -0.08);
    s += palm(90, 800, 430, c.ink, r, 0.06);
    return s;
  },

  courtyard(id, c, r) {
    const wall = c.light === 2 ? "#3A2D24" : c.light === 1 ? "#7A5440" : "#D3B99A";
    const deep = c.light === 2 ? "#1E1813" : c.light === 1 ? "#4C3324" : "#A9876A";
    const glow = c.accent;
    let s = `<rect width="1600" height="1000" fill="${wall}"/>`;
    // arch opening showing the sky
    s += `<defs><clipPath id="${id}-arch"><path d="M500 1000 V420 Q500 180 800 160 Q1100 180 1100 420 V1000 Z"/></clipPath></defs>`;
    s += `<g clip-path="url(#${id}-arch)">${sky(id, c, true, [0.5, 0.5], 60)}${band(700, 10, c.mid, r, 2)}${palm(700, 760, 380, c.ink, r, 0.05)}${palm(930, 780, 300, c.ink, r, -0.05)}</g>`;
    s += `<path d="M470 1000 V420 Q470 150 800 128 Q1130 150 1130 420 V1000" fill="none" stroke="${deep}" stroke-width="30"/>`;
    // floor
    s += `<rect y="860" width="1600" height="140" fill="${deep}"/>`;
    for (let i = 0; i < 9; i++) s += `<path d="M${i * 200} 860 L${i * 200 - 140} 1000" stroke="${wall}" stroke-opacity=".25"/>`;
    // lanterns
    [260, 1340].forEach((x) => {
      s += `<circle cx="${x}" cy="520" r="140" fill="${glow}" opacity="${c.light >= 1 ? 0.18 : 0.08}"/>`;
      s += `<path d="M${x} 400 V450" stroke="${deep}" stroke-width="3"/><rect x="${x - 22}" y="450" width="44" height="70" rx="6" fill="${glow}" opacity=".9"/>`;

    return s;
  },

  table(id, c, r) {

    const mat = c.light === 2 ? "#5B4636" : c.light === 1 ? "#A8774F" : "#C2A27A";
    let s = `<rect width="1600" height="1000" fill="${cloth}"/>`;
    // woven sufra
    s += `<circle cx="800" cy="500" r="430" fill="${mat}"/>`;
    for (let i = 1; i < 9; i++) s += `<circle cx="800" cy="500" r="${430 - i * 48}" fill="none" stroke="${c.ink}" stroke-opacity=".12" stroke-width="10"/>`;
    // plates with dates / kleija
    const items = [
      [800, 500, 150, "dates"],
      [520, 360, 95, "kleija"],
      [1080, 380, 90, "kleija"],
      [560, 690, 85, "cup"],
      [1050, 680, 100, "dates"],
    ];
    items.forEach(([x, y, rad, kind]) => {
      s += `<circle cx="${x}" cy="${y}" r="${rad}" fill="#F3EBDD"/><circle cx="${x}" cy="${y}" r="${rad * 0.82}" fill="none" stroke="${c.ink}" stroke-opacity=".12"/>`;
      if (kind === "dates") {
        for (let i = 0; i < 14; i++) {
          const a = r() * Math.PI * 2;
          const d = r() * rad * 0.6;
          s += `<ellipse cx="${f(x + Math.cos(a) * d)}" cy="${f(y + Math.sin(a) * d)}" rx="${f(rad * 0.13)}" ry="${f(rad * 0.08)}" transform="rotate(${f(r() * 180)} ${f(x + Math.cos(a) * d)} ${f(y + Math.sin(a) * d)})" fill="#7A4524"/>`;
        }
      } else if (kind === "kleija") {
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2;
          const cx = x + Math.cos(a) * rad * 0.42;
          const cy = y + Math.sin(a) * rad * 0.42;
          s += `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(rad * 0.26)}" fill="#C08A55"/><circle cx="${f(cx)}" cy="${f(cy)}" r="${f(rad * 0.14)}" fill="none" stroke="#8E5A32" stroke-width="3" stroke-dasharray="4 5"/>`;
        }
      } else {
        s += `<circle cx="${x}" cy="${y}" r="${rad * 0.45}" fill="#E7C98F"/><circle cx="${x}" cy="${y}" r="${rad * 0.32}" fill="#B98A45"/>`;
      }
    });
    s += `<rect width="1600" height="1000" fill="${c.ink}" opacity="${c.light === 2 ? 0.25 : 0.04}"/>`;
    return s;
  },

  craft(id, c, r) {
    const a = c.light >= 1 ? "#B0835A" : "#D6BC92";
    const b = c.light >= 1 ? "#8A6240" : "#B79868";
    const g = c.light >= 1 ? "#6E6A4D" : "#8F9273";
    let s = `<rect width="1600" height="1000" fill="${b}"/>`;
    const w = 70;
    // diagonal weave of palm strips
    s += `<g transform="rotate(-30 800 500)">`;
    for (let i = -14; i < 30; i++) {
      for (let j = -14; j < 30; j++) {
        const x = i * w;
        const y = j * w;
        const over = (i + j) % 2 === 0;

        s += `<rect x="${x + 3}" y="${y + 3}" width="${w - 6}" height="${w - 6}" rx="3" fill="${col}"/>`;
        s += over
          ? `<path d="M${x + 8} ${y + w / 2} H${x + w - 8}" stroke="${c.ink}" stroke-opacity=".1" stroke-width="2"/>`

    s += `</g>`;

    s += `<defs><radialGradient id="${id}-v"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></radialGradient></defs><rect width="1600" height="1000" fill="url(#${id}-v)"/>`;

  night(id, c, r) {

      const x = i * 40 + 20;

    s += `<ellipse cx="800" cy="900" rx="260" ry="70" fill="${c.accent}" opacity=".22"/><ellipse cx="800" cy="900" rx="90" ry="22" fill="${c.accent}" opacity=".7"/>`;
    return s;
  },

  channel(id, c, r) {
    let s = sky(id, c, true, [0.5, 0.42], 50);
    s += band(520, 6, c.far, r, 2);
    s += `<rect y="520" width="1600" height="480" fill="${c.ground}"/>`;
    // water channel in perspective
    s += `<path d="M770 520 L830 520 L1060 1000 L540 1000 Z" fill="${c.ground2}"/>`;
    s += `<path d="M782 520 L818 520 L990 1000 L610 1000 Z" fill="${c.sky[1]}" opacity=".85"/>`;
    for (let i = 0; i < 12; i++) s += `<path d="M${f(700 + r() * 200)} ${f(560 + i * 36)} h${f(30 + r() * 60)}" stroke="${c.sky[0]}" stroke-width="3" opacity=".6"/>`;

      const depth = row / 5;
      const y = 520 + 480 * Math.pow(1 - depth, 1.5);
      const h = 640 * (1 - depth * 0.8);
      s += palm(800 - 140 - 640 * Math.pow(1 - depth, 1.4), y, h, row > 3 ? c.mid : c.ink, r, 0.04);
      s += palm(800 + 140 + 640 * Math.pow(1 - depth, 1.4), y, h, row > 3 ? c.mid : c.ink, r, -0.04);

    return s;

  harvest(id, c, r) {
    const wood = c.light >= 1 ? "#6B4733" : "#B38B62";
    const woodD = c.light >= 1 ? "#4A3122" : "#8F6A45";
    let s = `<rect width="1600" height="1000" fill="${c.light >= 1 ? "#3E2B1F" : "#D8C7A8"}"/>`;
    const crates = [
      [140, 160, 620, 380],
      [840, 120, 620, 380],
      [480, 560, 640, 380],
    ];
    crates.forEach(([x, y, w, h]) => {
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${woodD}"/>`;
      s += `<rect x="${x + 22}" y="${y + 22}" width="${w - 44}" height="${h - 44}" fill="#5A2E17"/>`;
      for (let i = 0; i < 120; i++) {
        const cx = x + 40 + r() * (w - 80);
        const cy = y + 40 + r() * (h - 80);
        const tone = r() > 0.5 ? "#8A4B26" : r() > 0.5 ? "#A8683A" : "#6E361A";
        s += `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="22" ry="14" transform="rotate(${f(r() * 180)} ${f(cx)} ${f(cy)})" fill="${tone}"/>`;
        if (r() > 0.7) s += `<ellipse cx="${f(cx - 6)}" cy="${f(cy - 4)}" rx="6" ry="3" fill="#E9C89B" opacity=".45"/>`;
      }
      s += `<rect x="${x}" y="${y}" width="${w}" height="22" fill="${wood}"/><rect x="${x}" y="${y + h - 22}" width="${w}" height="22" fill="${wood}"/>`;
    });
    return s;
  },
};

/** SVG markup for a demo scene. */
function sceneSVG({ scene = "grove", tone = "day", seed = 1 } = {}) {
  const id = `sc${++sceneCounter}`;
  const c = TONES[tone] || TONES.day;
  const r = rng(seed * 97 + scene.length);
  const body = (SCENES[scene] || SCENES.grove)(id, c, r);
  return `<svg class="media__scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">${body}</svg>`;
}

/**
 * Render an image slot.
 * @param {string} key  media registry key
 * @param {{ ratio?: string, cls?: string, eager?: boolean, label?: boolean,
 *           fill?: boolean, alt?: string, children?: SafeHTML }} opts
 * `children` is extra markup placed inside the figure (veils, overlays).
 */
function renderMedia(key, opts = {}) {
  const entry = getMedia(key);
  const { ratio, cls = "", eager = false, label = true, fill = false } = opts;
  const alt = opts.alt ?? L(entry.alt);
  const style = [ratio ? `--ratio:${ratio}` : "", entry.focal ? `--focal:${entry.focal}` : ""].filter(Boolean).join(";");
  const classes = ["media", fill ? "media--fill" : "", cls].filter(Boolean).join(" ");

  if (entry.src) {
    const src = /^(https?:)?\/\//.test(entry.src) ? entry.src : asset(entry.src);
    return raw(
      `<figure class="${classes}" style="${style}" data-media="${esc(key)}">` +
        `<img src="${esc(src)}" alt="${esc(alt)}" ${eager ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async" ` +
        `onload="this.classList.add('is-loaded')" onerror="this.remove()">` +
        String(opts.children ?? "") +
        `</figure>`
    );
  }

  return raw(
    `<figure class="${classes}" style="${style}" data-media="${esc(key)}" role="img" aria-label="${esc(alt)}">` +
      sceneSVG(entry) +
      (label ? `<figcaption class="media__label">${esc(t("common.demoImage"))}</figcaption>` : "") +
      String(opts.children ?? "") +
      `</figure>`
  );
}

__bind({ renderMedia: () => renderMedia, sceneSVG: () => sceneSVG });

/* ---- js/components/cards.js ---- */
__def("js/components/cards.js", function (__bind) {
/* ==========================================================================
   Cards
   Destination cards read like hospitality, not marketplace listings: the
   photograph leads, details are few, and the price sits quietly.
   ========================================================================== */

const { html, raw } = __req("js/core/dom.js");
const { L, t } = __req("js/core/i18n.js");
const { formatMoney, formatDuration, count } = __req("js/core/format.js");
const { route } = __req("js/core/paths.js");
const { DESTINATION_TYPES } = __req("js/data/destinations.js");
const { EXPERIENCE_CATEGORIES } = __req("js/data/experiences.js");
const { renderMedia } = __req("js/components/media.js");
const { icon } = __req("js/components/icons.js");
const STATUS_LABEL = { open: "avail.open", limited: "avail.limited", season: "avail.season", soon: "avail.soon" };

function priceLabel(amount, unit) {
  const unitKey = { person: "common.perPerson", night: "common.perNight", booking: "common.perBooking" }[unit];
  return { amount: formatMoney(amount), unit: unitKey ? t(unitKey) : "" };
}

/**
 * @param {object} d  destination
 * @param {{ eager?: boolean, ratio?: string, i?: number }} o
 */
function destinationCard(d, o = {}) {
  const href = route("destination", { id: d.id });
  const price = priceLabel(d.priceFrom, d.priceUnit);
  const overlay = html`
    <span class="dest-card__veil"></span>
    <div class="dest-card__over">
      <div class="cluster" style="--cluster-gap:var(--space-2)">
        ${d.tags.slice(0, 3).map((tag) => html`<span class="tag tag--on-dark">${L(tag)}</span>`)}
      </div>
      <div class="dest-card__reveal"><div>
        <p class="dest-card__desc">${L(d.short)}</p>
        <span class="dest-card__cta">${d.status === "soon" ? t("common.details") : t("card.explore")} ${icon("arrow", { size: "sm" })}</span>
      </div></div>
    </div>`;

  return html`
    <article class="dest-card" style="--i:${o.i ?? 0}">
      ${renderMedia(d.media.card, { ratio: o.ratio, cls: "dest-card__media media--label-top", eager: o.eager, children: overlay })}
      <div class="dest-card__body">
        <div class="dest-card__head">
          <h3 class="dest-card__name"><a class="dest-card__link" href="${href}">${L(d.name)}</a></h3>
          ${d.status === "soon"
            ? ""
            : html`<span class="dest-card__price">${t("common.from")} <strong class="num">${price.amount}</strong> ${price.unit}</span>`}
        </div>
        <div class="dest-card__line">
          <span>${L(d.town)}</span>
          <span>${L(DESTINATION_TYPES[d.type])}</span>
          <span class="availability availability--${d.status === "soon" ? "season" : d.status}">${t(STATUS_LABEL[d.status])}</span>
        </div>
      </div>
    </article>`;
}

/**
 * Experience card. The title books (or opens the destination for products);
 * the destination line links back to the place the experience belongs to,
 * so every card stays connected to a destination's story.
 * @param {object} e  experience listing (from api.getExperiences)
 */
function experienceCard(e, o = {}) {
  const cat = EXPERIENCE_CATEGORIES.find((c) => c.id === e.category);
  const bookable = e.priceUnit !== "item";
  const href = bookable ? route("booking", { package: e.id }) : route("destination", { id: e.destinationId, exp: e.id });
  const unitKey = { person: "common.perPerson", night: "common.perNight", booking: "common.perBooking", item: "card.perItem" }[e.priceUnit];
  return html`
    <article class="exp-card" style="--i:${o.i ?? 0}" data-exp-card="${e.id}">
      ${renderMedia(e.media, { cls: "exp-card__media" })}
      <div class="exp-card__body">
        <span class="exp-card__cat">${L(cat?.label)}${e.destinationName && o.showDestination !== false
          ? html` <a class="exp-card__dest" href="${route("destination", { id: e.destinationId })}">${t("card.at")} ${L(e.destinationName)}</a>`
          : ""}</span>
        <h3 class="exp-card__title"><a href="${href}">${L(e.title)}</a></h3>
        <p class="exp-card__desc">${L(e.desc)}</p>
        <div class="exp-card__facts">
          ${e.durationHours > 0 ? html`<span>${icon("clock", { size: "sm" })} ${formatDuration(e.durationHours)}</span>` : ""}
          ${bookable ? html`<span>${icon("users", { size: "sm" })} ${t("card.upTo")} ${count(e.maxGuests, "guests")}</span>` : html`<span>${t("card.pickup")}</span>`}
          <span class="exp-card__price"><span class="num">${formatMoney(e.price)}</span> <span class="muted">${unitKey ? t(unitKey) : ""}</span></span>
        </div>
      </div>
    </article>`;
}

/* ---- Loading & empty --------------------------------------------------- */

function skeletonCards(n = 3, { ratio = "4 / 5" } = {}) {
  return html`${Array.from({ length: n }, () => html`
    <div class="skeleton-card" aria-hidden="true" style="--ratio:${ratio}">
      <div class="skeleton skeleton--media"></div>
      <div class="skeleton skeleton--title"></div>
      <div class="skeleton skeleton--text" style="width:85%"></div>
      <div class="skeleton skeleton--text" style="width:50%"></div>
    </div>`)}`;
}

/**
 * @param {{ title: string, text?: string, action?: SafeHTML, icon?: string }} o
 */
function emptyState(o) {
  return html`
    <div class="empty-state contours" role="status">
      <span class="empty-state__mark">${icon(o.icon || "survey", { cls: "icon--lg" })}</span>
      <p class="empty-state__title">${o.title}</p>
      ${o.text ? html`<p class="empty-state__text">${o.text}</p>` : ""}
      ${o.action || ""}
    </div>`;
}

/** Error state with a retry button (data-retry). */
function errorState(message) {
  return emptyState({
    title: t("error.loadTitle"),
    text: message || t("error.loadText"),
    icon: "alert",
    action: html`<button type="button" class="btn btn--secondary btn--sm" data-retry>${icon("refresh", { size: "sm" })} ${t("error.retry")}</button>`,
  });
}


/* ---- Page band (inner-page hero, homepage language) ------------------- */
/**
 * @param {{ media: string, crumbs: {label:string, href?:string}[], kicker?: string,
 *           title: string, lead?: string, facts?: SafeHTML, actions?: SafeHTML, compact?: boolean }} o
 */
function pageBand(o) {
  return html`
    <section class="band ${o.compact ? "band--compact" : ""} ${o.tall ? "band--tall" : ""} ${o.cls || ""}" data-band aria-labelledby="band-title">
      <div class="band__media">${renderMedia(o.media, { fill: true, eager: true, label: false })}</div>
      <div class="band__veil"></div>
      <div class="container container--wide band__inner">
        <nav class="crumbs" aria-label="${L({ ar: "مسار التنقل", en: "Breadcrumb" })}" data-band-in>
          ${o.crumbs.map((c, i) => html`${i ? icon("chevron", { size: "sm" }) : ""}${c.href ? html`<a href="${c.href}">${c.label}</a>` : html`<span aria-current="page">${c.label}</span>`}`)}
        </nav>
        <h1 class="band__title" id="band-title"><span class="line-mask"><span>${o.title}</span></span></h1>
        ${o.lead ? html`<p class="band__lead" data-band-in style="--d:500">${o.lead}</p>` : ""}
        ${o.actions ? html`<div class="hero__actions cluster" data-band-in style="--d:650">${o.actions}</div>` : ""}
        <div class="band__foot" data-band-in style="--d:700">
          <div class="band__facts">${o.facts || ""}</div>
          <span class="band__label">${t("common.demoImage")}</span>
        </div>
      </div>
    </section>`;
}

/** Play the band's entrance once it is in the DOM. */
function playBand(root = document) {
  const band = root.querySelector("[data-band]");
  if (!band) return;
  requestAnimationFrame(() =>
    requestAnimationFrame(() => {
      band.classList.add("is-in");
      band.querySelectorAll(".line-mask").forEach((m) => m.classList.add("is-revealed"));
    })
  );
}

__bind({ destinationCard: () => destinationCard, emptyState: () => emptyState, errorState: () => errorState, experienceCard: () => experienceCard, pageBand: () => pageBand, playBand: () => playBand, priceLabel: () => priceLabel, raw: () => raw, skeletonCards: () => skeletonCards });
});

/* ---- js/components/charts.js ---- */
__def("js/components/charts.js", function (__bind) {
/* ==========================================================================
   Charts
   Small, hand-built, on-brand. Render first at zero, then call playCharts()
   (usually when scrolled into view) so values animate in. Update functions
   move existing bars rather than re-rendering, so changes read as changes.
   ========================================================================== */

const { html, raw, $$, animateNumber, prefersReducedMotion } = __req("js/core/dom.js");
const { formatNumber } = __req("js/core/format.js");
/* ---- Score ring -------------------------------------------------------- */
const R = 52;
const C = 2 * Math.PI * R;

/**
 * @param {number} value 0–100
 * @param {{ size?: number, label?: string, color?: string }} o
 */
function scoreRing(value, o = {}) {
  const ticks = Array.from({ length: 20 }, (_, i) => {
    const a = (i / 20) * Math.PI * 2;
    const r1 = R + 9;
    const r2 = R + (i % 5 === 0 ? 14 : 11);
    return `<line x1="${60 + Math.cos(a) * r1}" y1="${60 + Math.sin(a) * r1}" x2="${60 + Math.cos(a) * r2}" y2="${60 + Math.sin(a) * r2}"/>`;
  }).join("");
  return html`
    <div class="ring" data-ring="${value}" style="--ring-size:${o.size || 220}px;${o.color ? `--ring-color:${o.color}` : ""}">
      <svg viewBox="-8 -8 136 136" aria-hidden="true">
        <g class="ring__ticks">${raw(ticks)}</g>
        <circle class="ring__track" cx="60" cy="60" r="${R}" stroke-width="5"/>
        <circle class="ring__value" cx="60" cy="60" r="${R}" stroke-width="5"
          stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
      </svg>
      <div class="ring__center">
        <span class="ring__num"><span data-count="${value}">0</span><small>%</small></span>
        ${o.label ? html`<span class="ring__label">${o.label}</span>` : ""}
      </div>
    </div>`;
}

function setRing(el, value) {
  const ring = el.matches("[data-ring]") ? el : el.querySelector("[data-ring]");
  if (!ring) return;
  ring.dataset.ring = value;
  ring.querySelector(".ring__value").style.strokeDashoffset = C * (1 - Math.max(0, Math.min(100, value)) / 100);
  animateNumber(ring.querySelector("[data-count]"), value, { format: (n) => formatNumber(Math.round(n)) });
}

/* ---- Measured horizontal bars ---------------------------------------- */
/**
 * @param {{ label: string, value: number, display?: string, note?: string, color?: string }[]} items
 * value 0–100
 */
function hbars(items) {
  return html`
    <ul class="hbars" role="list">
      ${items.map(
        (it, i) => html`
          <li class="hbar" style="--i:${i}">
            <div class="hbar__head">
              <span class="hbar__label">${it.label}</span>
              <span class="hbar__value" data-count="${it.value}">0</span>
            </div>
            <div class="hbar__track" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${it.value}" aria-label="${it.label}">
              <span class="hbar__fill" data-v="${it.value / 100}" style="${it.color ? `--bar-color:${it.color}` : ""}"></span>
            </div>
            ${it.note ? html`<p class="hbar__note">${it.note}</p>` : ""}
          </li>`
      )}
    </ul>`;
}

/* ---- Columns (grouped) ------------------------------------------------- */
/**
 * @param {{ label: string, values: number[] }[]} groups
 * @param {{ max?: number, height?: number, variants?: string[] }} o
 * variants: per-series class suffix ("", "alt", "accent")
 */
function columns(groups, o = {}) {
  const max = o.max || Math.max(1, ...groups.flatMap((g) => g.values));
  return html`
    <div class="columns" data-columns data-max="${max}" style="--n:${groups.length};${o.height ? `--h:${o.height}px` : ""}">
      ${groups.map(
        (g) => html`
          <div class="columns__group">
            ${g.values.map(
              (v, si) => html`<span class="columns__bar ${o.variants?.[si] ? `columns__bar--${o.variants[si]}` : ""}" data-v="${v / max}" title="${g.titles?.[si] || ""}"></span>`
            )}
            <span class="columns__label">${g.label}</span>
          </div>`
      )}
    </div>`;
}

/** Move existing column bars to new values (same group/series layout). */
function updateColumns(el, groups, max) {
  const wrap = el.matches("[data-columns]") ? el : el.querySelector("[data-columns]");
  if (!wrap) return;
  const m = max || Math.max(1, ...groups.flatMap((g) => g.values));
  const bars = $$(".columns__bar", wrap);
  let k = 0;
  groups.forEach((g) =>
    g.values.forEach((v, si) => {
      const bar = bars[k++];
      if (!bar) return;
      bar.style.setProperty("--v", v / m);
      if (g.titles?.[si]) bar.title = g.titles[si];
    })
  );
}

/* ---- Sparkline / area ------------------------------------------------- */
function spark(values, { height = 64, area = true } = {}) {
  const w = 300;
  const max = Math.max(1, ...values);
  const min = Math.min(0, ...values);
  const step = values.length > 1 ? w / (values.length - 1) : w;
  const pts = values.map((v, i) => [i * step, height - ((v - min) / (max - min || 1)) * (height - 6) - 3]);
  const d = pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)}`).join(" ");
  const a = `${d} L${w} ${height} L0 ${height} Z`;
  return raw(`<svg class="spark" viewBox="0 0 ${w} ${height}" preserveAspectRatio="none" style="--spark-h:${height}px" aria-hidden="true">
    ${area ? `<path class="spark__area" d="${a}"/>` : ""}<path class="spark__line" d="${d}"/></svg>`);
}

/* ---- Play ---------------------------------------------------------------- */
/** Animate every chart inside root to its target values. */
function playCharts(root = document) {
  const run = () => {
    $$("[data-v]", root).forEach((el) => el.style.setProperty("--v", el.dataset.v));
    $$("[data-ring]", root).forEach((el) => setRing(el, Number(el.dataset.ring)));
    $$(".hbar__value[data-count]", root).forEach((el) =>
      animateNumber(el, Number(el.dataset.count), { format: (n) => formatNumber(Math.round(n)), duration: 900 })
    );
  };
  if (prefersReducedMotion()) run();
  else requestAnimationFrame(() => requestAnimationFrame(run));
}

const { SEED_FARMS, OWNER_TIMELINE, PIPELINE_STAGES } = __req("js/data/farms.js");
const { getDestinationById } = __req("js/data/destinations.js");
initShell({ page: "business", header: "overlay", bottomNav: true, footer: "full" });

const X = (ar, en) => L({ ar, en });
const draft = store.get("assessmentDraft");
const result = store.get("assessmentResult");
const hasDraft = draft && Object.keys(draft.answers || {}).length > 0;
const startLabel = () => (hasDraft ? X("أكمل تقييم مزرعتك", "Continue your assessment") : X("ابدأ تقييم مزرعتك", "Start your farm assessment"));

/* ---- Sections ---------------------------------------------------------- */

function band() {
  return pageBand({
    tall: true,
    media: "owners-hero",
    crumbs: [{ label: t("nav.home"), href: route("home") }, { label: X("للملاك", "For owners") }],
    title: X("لديك أرض؟ دعنا نعرف ماذا يمكن أن تصبح.", "Own land? Let's find out what it could become."),
    lead: X(
      "تقييم أولي في سبع خطوات قصيرة يقرأ مزرعتك كما يقرؤها فريق ريف: البنية، والوصول، والمباني، والتشغيل. تحصل على تقرير مفسّر وسيناريوهات تقديرية، قبل أي التزام.",
      "A seven-step initial assessment that reads your farm the way the Rif team does: infrastructure, access, buildings and operations. You get an explained report and estimated scenarios, before any commitment."
    ),
    actions: html`
      <a class="btn btn--light btn--lg" href="${route("assessment")}">${startLabel()}</a>
      <a class="btn btn--outline-light btn--lg" href="${result ? route("result") : route("result", { example: 1 })}">${result ? X("اعرض تقريرك", "View your report") : X("شاهد تقريرًا نموذجيًا", "See an example report")}</a>`,
    facts: html`<span>${X("قرابة ١٠ دقائق", "About 10 minutes")}</span><span>${X("بلا التزام، وبلا رسوم", "No commitment, no fee")}</span>`,
  });
}

function resumeNote() {
  if (!hasDraft && !result) return "";
  return html`
    <div class="container container--wide" style="padding-top:var(--space-7)">
      <div class="ob-resume" role="status">
        ${result
          ? html`<p>${X(`تقريرك عن ${result.answers.farmName} جاهز.`, `Your report on ${result.answers.farmName} is ready.`)} <span class="ref">${result.reference}</span> <span class="meta">${formatDate(result.submittedAt.slice(0, 10))}</span></p>
             <span class="cluster"><a class="btn btn--primary btn--sm" href="${route("owner")}">${X("مساحة مزرعتي", "My farm workspace")}</a><a class="btn btn--secondary btn--sm" href="${route("result")}">${X("اعرض التقرير", "View the report")}</a></span>`
          : html`<p>${X(`لديك تقييم محفوظ عند الخطوة ${formatNumber(draft.step)} من ٧.`, `You have a saved assessment at step ${draft.step} of 7.`)}</p>
             <a class="btn btn--primary btn--sm" href="${route("assessment")}">${X("أكمل من حيث توقفت", "Continue where you left off")}</a>`}
      </div>
    </div>`;
}

function journey() {
  const steps = [
    [X("أدخل معلومات الأرض", "Describe your land"), X("المساحة، والمباني، والمرافق، وما تقدمه اليوم.", "Area, buildings, facilities and what you offer today."), X("أنت، قرابة ١٠ دقائق", "You, about 10 minutes")],
    [X("قيّم الجاهزية", "Readiness assessed"), X("درجة من ١٠٠ على خمسة أبعاد، وكل نقطة مرتبطة بإجابة.", "A score out of 100 across five dimensions, every point tied to an answer."), X("فوري", "Instant")],
    [X("استكشف السيناريوهات", "Explore scenarios"), X("متحفظ وأساسي ومتفائل، بافتراضات تستطيع تعديلها.", "Conservative, base and optimistic, with assumptions you can edit."), X("في التقرير", "In the report")],
    [X("اعرف الإمكانات", "See the potential"), X("الفرص، والفجوات، وما يحتاجه التطوير قبل التشغيل.", "Opportunities, gaps, and what development needs before operation."), X("في التقرير", "In the report")],
    [X("اطلب دراسة ريف", "Request a Rif study"), X("مراجعة الفريق، ثم معاينة ميدانية ودراسة تفصيلية.", "Team review, then a site visit and a detailed study."), X("فريق ريف", "The Rif team")],
  ];
  return html`
    <section class="section" aria-labelledby="ob-journey-title">
      <div class="container container--wide">
        <div class="stack" style="--stack-gap:var(--space-4);margin-bottom:var(--space-8);max-inline-size:52ch">
          <p class="kicker">${X("كيف يعمل", "How it works")}</p>
          <h2 class="h1" id="ob-journey-title">${X("من سؤال واحد إلى قرار واضح.", "From one question to a clear decision.")}</h2>
        </div>
        <ol class="ob-journey" role="list">
          ${steps.map(
            ([h, p, who], i) => html`<li class="ob-step" data-reveal style="--i:${i}">
              <span class="ob-step__num">${String(i + 1).padStart(2, "0")}</span>
              <div><h3 class="ob-step__title">${h}</h3><p class="ob-step__text">${p}</p><span class="ob-step__who">${who}</span></div>
            </li>`
          )}
        </ol>
      </div>
    </section>`;
}

function whatYouGet() {
  const demoDims = { infrastructure: 82, accessibility: 88, accommodation: 71, operations: 68, experiences: 63 };
  const items = [
    ["target", X("درجة جاهزية مفسّرة", "An explained readiness score"), X("ليست رقمًا مجردًا: ترى من أين جاءت كل نقطة، وما الذي يرفعها.", "Not a bare number: see where each point came from, and what would raise it.")],
    ["leaf", X("نقاط القوة والفجوات والفرص", "Strengths, gaps and opportunities"), X("ما يميز أرضك، وما ينقصها، وما يمكن بناؤه عليها.", "What sets your land apart, what it lacks, and what could be built on it.")],
    ["chart", X("ثلاثة سيناريوهات تقديرية", "Three estimated scenarios"), X("الإيراد والتكلفة والاستثمار والعائد، مع افتراضات تستطيع تغييرها.", "Revenue, costs, investment and payback, with assumptions you can change.")],
    ["file", X("خطوات تالية واضحة", "Clear next steps"), X("ما الذي تفعله الآن، ومتى يدخل فريق ريف.", "What to do now, and when the Rif team steps in.")],
  ];
  return html`
    <section class="section section--sand" aria-labelledby="ob-get-title">
      <div class="container container--wide ob-get">
        <div class="stack" style="--stack-gap:var(--space-5)">
          <p class="kicker">${X("ماذا تحصل", "What you get")}</p>
          <h2 class="h1" id="ob-get-title">${X("تقرير ميداني أولي، لا لوحة أرقام.", "A preliminary field report, not a dashboard.")}</h2>
          <ul class="ob-get__list" role="list">${items.map(([ic, h, p]) => html`<li>${icon(ic)}<div><h3>${h}</h3><p>${p}</p></div></li>`)}</ul>
        </div>
        <figure class="report-preview" data-report aria-label="${X("مثال على تقرير التقييم الأولي", "Example initial assessment report")}">
          <div class="report-preview__head">
            <div><p class="meta">${X("تقرير تقييم أولي", "Initial assessment report")}</p><p class="h3">${X("مزرعة الريحان، بريدة", "Al Raihan Farm, Buraydah")}</p></div>
            <span class="demo-tag">${X("مثال توضيحي", "Example")}</span>
          </div>
          <div class="report-preview__body">
            ${scoreRing(78, { size: 168, label: X("الجاهزية", "Readiness") })}
            ${hbars(DIMENSIONS.slice(0, 4).map((d) => ({ label: L(d.label), value: demoDims[d.id] })))}
          </div>
          <a class="btn btn--secondary btn--sm" href="${route("result", { example: 1 })}" style="justify-self:start">${X("افتح التقرير النموذجي كاملًا", "Open the full example report")}</a>
        </figure>
      </div>
    </section>`;
}

function whatWeRead() {
  const text = {
    infrastructure: X("كهرباء، ومياه، ودورات مياه، ومطبخ، ومواقف، وحالة المباني. أصعب ما يُستكمل وأغلاه.", "Power, water, restrooms, kitchen, parking and building condition. The hardest and costliest to complete."),
    accessibility: X("المسافة عن المدينة، وموقع المركز، والمواقف. الزائر الذي لا يصل لا يحجز.", "Distance from town, location and parking. A guest who can't get there doesn't book."),
    accommodation: X("الغرف والمباني القابلة للتأهيل. تحدد إن كانت الوجهة نهارية أم للإقامة.", "Rooms and buildings that can be converted. They decide day visits or stays."),
    operations: X("العاملون، والصيانة، والزوار والحجوزات الحالية. ما يمكن البناء عليه.", "Staff, maintenance, current visitors and bookings. What can be built on."),
    experiences: X("طبيعة الأصل، والمساحات الخارجية، والخدمات القائمة. أسهل ما تبنيه ريف.", "The asset's character, outdoor spaces and existing services. The easiest for Rif to build."),
  };
  return html`
    <section class="section" style="background:var(--rif-earth);color:var(--color-on-dark)" aria-labelledby="ob-read-title">
      <div class="container container--wide ob-read">
        <div class="stack" style="--stack-gap:var(--space-5)">
          <p class="kicker" style="color:var(--color-on-dark-muted)">${X("ما الذي نقرؤه", "What we read")}</p>
          <h2 class="h1" id="ob-read-title">${X("خمسة أبعاد، بأوزان معلنة.", "Five dimensions, with published weights.")}</h2>
          <p class="lead" style="color:var(--color-on-dark-muted)">${X(
            "الأساسيات التي يصعب تغييرها تزن أكثر. التجارب تزن أقل لأن بناءها هو عملنا.",
            "The fundamentals that are hard to change weigh most. Experiences weigh least, because building them is our job."
          )}</p>
        </div>
        <div class="ob-dims">
          ${DIMENSIONS.map(
            (d) => html`<div class="ob-dim" data-reveal>
              <h3>${L(d.label)}</h3><span class="ob-dim__weight">${formatNumber(d.weight * 100)}%</span>
              <p>${text[d.id]}</p>
              <span class="ob-dim__bar" aria-hidden="true"><span style="--w:${d.weight}"></span></span>
            </div>`
          )}
        </div>
      </div>
    </section>`;
}

function cases() {
  const picks = ["farm-sidr", "farm-tin", "farm-wasm"].map((id) => SEED_FARMS.find((f) => f.id === id));
  const stageIndex = (stage) => OWNER_TIMELINE.findIndex((s) => s.stages.includes(stage));
  return html`
    <section class="section" aria-labelledby="ob-cases-title">
      <div class="container container--wide">
        <div class="stack" style="--stack-gap:var(--space-4);margin-bottom:var(--space-7);max-inline-size:56ch">
          <p class="kicker">${X("من أرض إلى وجهة", "From land to destination")}</p>
          <h2 class="h1" id="ob-cases-title">${X("بدأت كلها بالتقييم نفسه.", "They all started with this assessment.")}</h2>
          <p class="meta">${X("وجهات توضيحية في النموذج.", "Illustrative destinations in the prototype.")}</p>
        </div>
        <div class="ob-cases">
          ${picks.map((f) => {
            const d = getDestinationById(f.destinationId);
            const idx = stageIndex(f.stage);
            const stage = PIPELINE_STAGES.find((s) => s.id === f.stage);
            return html`<article class="ob-case" data-reveal>
              ${renderMedia(d.media.card)}
              <div class="ob-case__stage"><span>${L(d.town)}</span><span>${L(stage.label)}</span></div>
              <div class="ob-case__track" role="img" aria-label="${X("مرحلة المشروع", "Project stage")}: ${L(stage.label)}">${OWNER_TIMELINE.map((s, i) => html`<span class="${i <= idx ? "is-done" : ""}"></span>`)}</div>
              <h3 class="h3"><a href="${route("destination", { id: d.id })}">${L(d.name)}</a></h3>
              <p class="muted small">${L(f.note)}</p>
            </article>`;
          })}
        </div>
      </div>
    </section>`;
}

function prepare() {
  const prep = [
    ["map", X("المساحة الإجمالية والقابلة للاستخدام، ولو تقريبية", "Total and usable area, even roughly")],
    ["home", X("عدد المباني والغرف وحالتها", "Number of buildings and rooms, and their condition")],
    ["bolt", X("المرافق المتوفرة: كهرباء، مياه، مواقف", "Facilities: power, water, parking")],
    ["coin", X("التكاليف السنوية الحالية", "Current yearly costs")],
    ["image", X("صور للمباني والمساحات (صورة واحدة على الأقل)", "Photos of buildings and spaces (at least one)")],
  ];
  const faq = [
    [X("هل التقييم ملزم؟", "Is the assessment binding?"), X("لا. هو قراءة أولية تساعدك على القرار، ولا يترتب عليه أي التزام منك أو من ريف.", "No. It's an initial read to help you decide, with no commitment from you or Rif.")],
    [X("هل الأرقام دقيقة؟", "Are the numbers accurate?"), X("الأرقام تقديرية ومحاكاة، تعتمد على إجاباتك وعلى افتراضات تراها وتعدّلها. الدراسة التفصيلية بعد المعاينة هي ما يُعتمد عليه.", "They're simulated estimates based on your answers and assumptions you can see and edit. The detailed study after a site visit is what to rely on.")],
    [X("أين تُحفظ بياناتي؟", "Where is my data kept?"), X("في هذا النموذج التجريبي تُحفظ في متصفحك فقط، ولا تُرسل إلى أي خادم.", "In this prototype it stays in your browser only and is never sent to a server.")],
    [X("ماذا يحدث بعد الإرسال؟", "What happens after I submit?"), X("ترى تقريرك فورًا، وتظهر مزرعتك فرصةً جديدة لدى فريق ريف. وإذا طلبت دراسة، يتواصل معك الفريق في الوقت الذي تختاره.", "You see your report straight away and your farm appears as a new opportunity for the Rif team. If you request a study, the team contacts you at the time you choose.")],
  ];
  return html`
    <section class="section section--paper" aria-labelledby="ob-prep-title">
      <div class="container container--wide ob-prep">
        <div class="stack" style="--stack-gap:var(--space-5)">
          <p class="kicker">${X("قبل أن تبدأ", "Before you start")}</p>
          <h2 class="h2" id="ob-prep-title">${X(`${formatNumber(WIZARD_STEPS.length)} خطوات، وهذا ما يفيدك تجهيزه.`, `${WIZARD_STEPS.length} steps, and what helps to have ready.`)}</h2>
          <ul class="ob-prep__list" role="list">${prep.map(([ic, txt]) => html`<li>${icon(ic)}<span>${txt}</span></li>`)}</ul>
          <p class="meta">${X("يُحفظ تقدمك تلقائيًا، وتستطيع العودة لاحقًا.", "Your progress saves automatically; you can come back later.")}</p>
        </div>
        <div class="accordion" data-faq>
          ${faq.map(
            ([q, a], i) => html`<div class="accordion__item">
              <button type="button" class="accordion__trigger" aria-expanded="false" aria-controls="faq-${i}">${q} ${icon("plus")}</button>
              <div class="accordion__panel" id="faq-${i}"><div><p class="accordion__content muted">${a}</p></div></div>
            </div>`
          )}
        </div>
      </div>
    </section>`;
}

function closing() {
  return html`
    <section class="closing" aria-labelledby="ob-close-title">
      <div class="closing__media">${renderMedia("story-potential", { fill: true, label: false })}</div>
      <div class="closing__veil"></div>
      <div class="container container--wide closing__inner">
        <h2 class="closing__title" id="ob-close-title">${X("قد تكون وجهتك القادمة أقرب مما تتخيل.", "Your next destination may be closer than you think.")}</h2>
        <a class="btn btn--light btn--lg" href="${route("assessment")}">${startLabel()}</a>
      </div>
    </section>`;
}

/* ---- Boot ---------------------------------------------------------------- */
mount($("#main"), html`${band()}${resumeNote()}${journey()}${whatYouGet()}${whatWeRead()}${cases()}${prepare()}${closing()}`);
playBand();
observeReveals();
onceVisible($("[data-report]"), () => playCharts($("[data-report]")), 0.3);

on($("#main"), "click", "[data-faq] .accordion__trigger", (e, b) => {
  const item = b.closest(".accordion__item");
  const open = !item.classList.contains("is-open");
  item.classList.toggle("is-open", open);
  b.setAttribute("aria-expanded", String(open));
});

__bind({  });
});

__req("js/pages/business.js");
  </script>
</body>
</html>
