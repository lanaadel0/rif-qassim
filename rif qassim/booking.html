/* ==== css/motion.css ==== */
/* ==========================================================================
   RIF QASSIM — Motion
   Motion only reveals the story, confirms an action, or shows changed data.
   ========================================================================== */

/* Cross-document page transitions (progressive enhancement) */
@view-transition {
  navigation: auto;
}

::view-transition-old(root),
::view-transition-new(root) {
  animation-duration: 360ms;
  animation-timing-function: var(--ease-out);
}

/* ---- Scroll reveal ---------------------------------------------------- */
/* Hidden state only applies once JS has confirmed it can reveal things,
   so content is never lost if scripts fail. */
.js [data-reveal] {
  opacity: 0;
  transform: translateY(24px);
  transition:
    opacity var(--dur-4) var(--ease-out),
    transform var(--dur-4) var(--ease-soft);
  transition-delay: calc(var(--i, 0) * 80ms);
}

.js [data-reveal="fade"] {
  transform: none;
}

.js [data-reveal="line"] {
  opacity: 1;
  transform: scaleX(0);
  transform-origin: var(--origin, right);
}

[dir="ltr"] [data-reveal="line"] { --origin: left; }

.js [data-reveal="mask"] {
  opacity: 1;
  transform: none;
  clip-path: inset(100% 0 0 0);
  transition: clip-path var(--dur-5) var(--ease-soft);
  transition-delay: calc(var(--i, 0) * 80ms);
}

.js [data-reveal].is-revealed {
  opacity: 1;
  transform: none;
}

.js [data-reveal="mask"].is-revealed {
  clip-path: inset(0 0 0 0);
}

/* Split headline lines rising from a mask */
.line-mask {
  display: block;
  overflow: hidden;
  padding-bottom: 0.08em;
}

.line-mask > span {
  display: block;
}

.js .line-mask > span {
  transform: translateY(105%);
  transition: transform var(--dur-5) var(--ease-soft);
  transition-delay: calc(var(--i, 0) * 110ms + 120ms);
}

.js .is-revealed .line-mask > span,
.js .line-mask.is-revealed > span {
  transform: none;
}

/* ---- Keyframes --------------------------------------------------------- */
@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes shimmer {
  to { transform: translateX(100%); }
}

@keyframes toast-in {
  from { opacity: 0; transform: translateY(16px) scale(0.98); }
  to { opacity: 1; transform: none; }
}

@keyframes toast-out {
  to { opacity: 0; transform: translateY(8px); }
}

@keyframes rise-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes field-error-in {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: none; }
}

@keyframes line-flash {
  0% { background-color: rgba(168, 104, 58, 0.16); }
  100% { background-color: transparent; }
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(168, 104, 58, 0.45); }
  70% { box-shadow: 0 0 0 10px rgba(168, 104, 58, 0); }
  100% { box-shadow: 0 0 0 0 rgba(168, 104, 58, 0); }
}

@keyframes draw {
  from { stroke-dashoffset: var(--len, 1000); }
  to { stroke-dashoffset: 0; }
}

@keyframes slow-drift {
  from { transform: scale(1.08) translate3d(0, 0, 0); }
  to { transform: scale(1.02) translate3d(0, -1.5%, 0); }
}

.anim-rise {
  animation: rise-in var(--dur-4) var(--ease-soft) both;
  animation-delay: calc(var(--i, 0) * 70ms);
}

.anim-fade {
  animation: fade-in var(--dur-4) var(--ease-out) both;
}

/* Numbers that change value (price totals, scores) */
.is-ticking {
  color: var(--rif-date);
  transition: color var(--dur-4) var(--ease-out);
}

/* ---- Reduced motion ---------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    transition-delay: 0ms !important;
    scroll-behavior: auto !important;
  }

  .js [data-reveal],
  .js [data-reveal="mask"],
  .js .line-mask > span {
    opacity: 1 !important;
    transform: none !important;
    clip-path: none !important;
  }

  @view-transition {
    navigation: none;
  }
}

/* ==== css/responsive.css ==== */
/* ==========================================================================
   RIF QASSIM — Responsive
   Breakpoints: 360 · 390 · 430 (phones), 768 (tablet), 1024 (laptop),
   1440 (desktop), 1920 (wide). Base styles are for phones.
   ========================================================================== */

/* ---- Small phones (≤ 389px): tighten without breaking ----------------- */
@media (max-width: 389px) {
  .btn {
    padding-inline: 1.15em;
  }

  .btn--lg {
    padding-inline: 1.4em;
  }

  .segmented__btn {
    padding-inline: 0.8em;
  }

  .stepper__btn {
    inline-size: 46px;
  }

  .tabs {
    gap: var(--space-4);
  }
}

/* ---- Phones: table becomes stacked rows ------------------------------ */
@media (max-width: 767px) {
  .table--stack thead {
    display: none;
  }

  .table--stack,
  .table--stack tbody,
  .table--stack tr,
  .table--stack td {
    display: block;
    inline-size: 100%;
  }

  .table--stack tr {
    padding: var(--space-4);
    border-bottom: 1px solid var(--color-line);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-2) var(--space-4);
  }

  .table--stack td {
    padding: 0;
    border: 0;
  }

  .table--stack td[data-label]::before {
    content: attr(data-label);
    display: block;
    font-size: var(--fs-micro);
    color: var(--color-text-faint);
  }

  .table--stack td.cell--primary {
    grid-column: 1 / -1;
    font-weight: var(--fw-medium);
  }

  .table--stack td.cell--primary::before {
    display: none;
  }

  /* Swipe rails for cards on phones */
  .rail-mobile {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 82%;
    grid-template-columns: none;
    gap: var(--space-4);
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-padding-inline: var(--gutter);
    padding-inline: var(--gutter);
    margin-inline: calc(var(--gutter) * -1);
    padding-bottom: var(--space-3);
    scrollbar-width: none;
    overscroll-behavior-x: contain;
  }

  .rail-mobile::-webkit-scrollbar {
    display: none;
  }

  .rail-mobile > * {
    scroll-snap-align: start;
  }

  .hide-mobile {
    display: none !important;
  }

  .demo-fab__text {
    display: none;
  }

  .demo-fab {
    padding-inline: 0.75em;
  }
}

/* ---- Tablet (≥ 768px) ------------------------------------------------- */
@media (min-width: 768px) {
  .grid--2 { --cols: 2; }
  .grid--3 { --cols: 2; }
  .grid--4 { --cols: 2; }

  .footer__grid {
    grid-template-columns: 1.3fr 1fr;
  }

  .footer__links {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  /* Modal becomes a centred dialog */
  .modal {
    inset: 50% auto auto 50%;
    inline-size: min(640px, calc(100vw - var(--space-8)));
    max-block-size: min(86vh, 860px);
    border-radius: var(--radius-md);
    transform: translate(-50%, -46%) scale(0.98);
    opacity: 0;
    transition: transform var(--dur-3) var(--ease-soft), opacity var(--dur-3) var(--ease-out);
  }

  .modal.is-open {
    transform: translate(-50%, -50%);
    opacity: 1;
  }

  .modal--wide {
    inline-size: min(960px, calc(100vw - var(--space-8)));
  }

  /* Drawer slides from the inline-end edge */
  .drawer {
    inset-block: 0;
    inset-inline-start: auto;
    inset-inline-end: 0;
    inline-size: min(520px, 92vw);
    transform: translateX(-100%);
    box-shadow: var(--shadow-float);
  }

  [dir="ltr"] .drawer {
    transform: translateX(100%);
  }

  .drawer.is-open,
  [dir="ltr"] .drawer.is-open {
    transform: none;
  }

  .drawer--wide {
    inline-size: min(720px, 92vw);
  }

  .toast-region {
    inset-inline: auto;
    inset-inline-start: 50%;
    transform: translateX(50%);
    inline-size: 460px;
  }

  [dir="ltr"] .toast-region {
    transform: translateX(-50%);
  }

  .hide-tablet-up {
    display: none !important;
  }
}

/* ---- Laptop (≥ 1024px): desktop navigation ---------------------------- */
@media (min-width: 1024px) {
  .grid--3 { --cols: 3; }
  .grid--4 { --cols: 4; }

  .site-nav {
    display: block;
  }

/* ---- Hover-capable devices: hospitality card reveal ------------------- */
@media (hover: hover) and (pointer: fine) {

/* ==========================================================================
   Store
   One place for application state. Slices marked `persist` are saved to
   localStorage so drafts survive reloads and the visitor / owner / admin
   pages share the same demo data — this is what closes the end-to-end loop
   (a booking made as a visitor shows up in admin).

   Later, persisted slices map 1:1 onto backend tables / API resources.
   ========================================================================== */

const PREFIX = "rif:v1:";

/** Slice definitions: default value + whether it is persisted. */
const SLICES = {
  lang: { persist: true, initial: () => "ar" },

  /* Visitor */
  bookingDraft: {
    persist: true,
    initial: () => ({
      packageId: null,
      destinationId: null,
      date: null, // ISO yyyy-mm-dd
      guests: 2,
      addOns: [], // add-on ids
      step: 1,
      contact: { name: "", phone: "", email: "" },
    }),
  },
  userBookings: { persist: true, initial: () => [] }, // bookings created in the demo
  interests: { persist: true, initial: () => [] }, // "notify me" requests for upcoming destinations

  /* Farm owner */
  assessmentDraft: { persist: true, initial: () => ({ step: 1, answers: {}, uploads: {} }) },
  assessmentResult: { persist: true, initial: () => null },
  assumptions: { persist: true, initial: () => null }, // null → defaults from data
  scenario: { persist: true, initial: () => "base" },
  studyRequests: { persist: true, initial: () => [] },
  submittedFarms: { persist: true, initial: () => [] }, // owner submissions → admin pipeline
  ownerMessages: { persist: true, initial: () => [] },

  /* Internal RIF */
  farmStages: { persist: true, initial: () => ({}) }, // farmId → stage override
  bookingStatuses: { persist: true, initial: () => ({}) }, // bookingId → status override
  studyStatuses: { persist: true, initial: () => ({}) }, // seed study request id → status override
  contentOverrides: { persist: true, initial: () => ({ destinations: {}, experiences: {}, packages: {} }) }, // admin demo edits

  /* UI only */
  ui: { persist: false, initial: () => ({ menuOpen: false }) },
};

const state = {};
const listeners = new Map(); // slice → Set<fn>

const memoryStorage = new Map();
const storage = (() => {
  try {
    const k = "__rif_test__";
    window.localStorage.setItem(k, "1");
    window.localStorage.removeItem(k);
    return window.localStorage;
  } catch {
    // Private mode / non-browser: fall back to memory for this session
    return {
      getItem: (k) => (memoryStorage.has(k) ? memoryStorage.get(k) : null),
      setItem: (k, v) => memoryStorage.set(k, String(v)),
      removeItem: (k) => memoryStorage.delete(k),
    };
  }
})();

function load(name) {
  const def = SLICES[name];
  if (!def) throw new Error(`Unknown store slice: ${name}`);
  if (def.persist) {
    try {
      const rawValue = storage.getItem(PREFIX + name);
      if (rawValue !== null) return JSON.parse(rawValue);
    } catch {
      /* corrupted value: fall through to the initial value */
    }
  }
  return def.initial();
}

function save(name) {
  if (!SLICES[name].persist) return;
  try {
    storage.setItem(PREFIX + name, JSON.stringify(state[name]));
  } catch {
    /* quota exceeded: keep in memory */
  }
}

function emit(name) {
  listeners.get(name)?.forEach((fn) => {
    try {
      fn(state[name]);
    } catch (err) {
      console.error(err);
    }
  });
}

const isPlainObject = (v) => v !== null && typeof v === "object" && !Array.isArray(v);

const store = {
  /** Read a slice (loaded lazily). */
  get(name) {
    if (!(name in state)) state[name] = load(name);
    return state[name];
  },

  /**
   * Update a slice. Objects are shallow-merged; arrays and primitives are
   * replaced. Pass a function to compute the next value from the current one.

    state[name] = value;
    save(name);
    emit(name);
    return value;
  },

  /** Restore a slice to its initial value. */
  reset(name) {
    state[name] = SLICES[name].initial();
    if (SLICES[name].persist) storage.removeItem(PREFIX + name);
    emit(name);
    return state[name];
  },

  subscribe(name, fn) {
    if (!listeners.has(name)) listeners.set(name, new Set());
    listeners.get(name).add(fn);
    return () => listeners.get(name).delete(fn);
  },

  /** Wipe every persisted demo value except the language preference. */
  resetDemo() {
    Object.keys(SLICES).forEach((name) => {
      if (name !== "lang") this.reset(name);
    });
  },
};

/* Keep tabs in sync: a booking made in one tab appears in an open admin tab */
if (typeof window !== "undefined") {
  window.addEventListener("storage", (e) => {
    if (!e.key || !e.key.startsWith(PREFIX)) return;
    const name = e.key.slice(PREFIX.length);
    if (!SLICES[name]) return;
    state[name] = load(name);
    emit(name);
  });
}

  destinations: "destinations.html",
  destination: "destination.html",
  experiences: "experiences.html",
  booking: "booking.html",
  business: "business.html",
  assessment: "assessment.html",

  owner: "owner.html",
  admin: "admin.html",
  about: "index.html#about",
  contact: "index.html#contact",
  styleguide: "index.html",

 */
function icon(name, { size, label, cls = "" } = {}) {

/* ---- js/components/overlay.js ---- */
__def("js/components/overlay.js", function (__bind) {
/* ==========================================================================
   Overlays: modal (sheet on phones, dialog on tablet+) and drawer
   (full-screen on phones, side panel on tablet+). Focus is trapped while
   open and returned to the trigger on close. Escape and backdrop close.
   ========================================================================== */

const { fragment, html, trapFocus, raw } = __req("js/core/dom.js");
const { t } = __req("js/core/i18n.js");
const { icon } = __req("js/components/icons.js");
let openCount = 0;

/**
 * @param {{
 *   kind?: "modal"|"drawer", title: string, body: string|SafeHTML,
 *   foot?: string|SafeHTML, wide?: boolean, onOpen?: (panel) => void,
 *   onClose?: () => void, labelledBy?: string
 * }} opts
 * @returns {{ el: HTMLElement, close: () => void }}
 */
function openPanel(opts) {
  const kind = opts.kind || "modal";
  const titleId = `panel-title-${Date.now()}`;
  const trigger = document.activeElement;

  const overlay = fragment(html`<div class="overlay" data-overlay></div>`);
  const panel = fragment(html`
    <div class="${kind} ${opts.wide ? `${kind}--wide` : ""}" role="dialog" aria-modal="true" aria-labelledby="${titleId}">
      <div class="panel__head">
        <h2 class="panel__title" id="${titleId}">${opts.title}</h2>
        <button class="panel__close" type="button" data-close aria-label="${t("common.close")}">${icon("close")}</button>
      </div>
      <div class="panel__body">${raw(String(opts.body ?? ""))}</div>
      ${opts.foot ? html`<div class="panel__foot">${raw(String(opts.foot))}</div>` : ""}
    </div>
  `);

  document.body.append(overlay, panel);
  openCount++;
  document.body.classList.add("no-scroll");

  const releaseTrap = trapFocus(panel);

  requestAnimationFrame(() => {
    overlay.classList.add("is-open");
    panel.classList.add("is-open");
    // Focus an explicit [autofocus] field if the content asks for one,
    // otherwise the close button (avoids a focus ring jumping onto content)
    const auto = panel.querySelector(".panel__body [autofocus]");
    (auto || panel.querySelector("[data-close]")).focus({ preventScroll: true });
  });

  let closed = false;
  const close = () => {
    if (closed) return;
    closed = true;
    overlay.classList.remove("is-open");
    panel.classList.remove("is-open");
    releaseTrap();
    document.removeEventListener("keydown", onKey);
    openCount = Math.max(0, openCount - 1);
    if (!openCount) document.body.classList.remove("no-scroll");
    const done = () => {
      overlay.remove();
      panel.remove();
    };
    panel.addEventListener("transitionend", done, { once: true });
    setTimeout(done, 600); // fallback when transitions are disabled
    trigger?.focus?.({ preventScroll: true });
    opts.onClose?.();
  };

  const onKey = (e) => {
    if (e.key === "Escape") close();
  };
  document.addEventListener("keydown", onKey);
  overlay.addEventListener("click", close);
  panel.addEventListener("click", (e) => {
    if (e.target.closest("[data-close]")) close();
  });

  opts.onOpen?.(panel, close);
  return { el: panel, close };
}

const openModal = (opts) => openPanel({ ...opts, kind: "modal" });
const openDrawer = (opts) => openPanel({ ...opts, kind: "drawer" });

/**
 * A simple confirm dialog that resolves true/false.
 */
function confirmDialog({ title, text, confirmLabel, cancelLabel, danger = false }) {
  return new Promise((resolve) => {
    let answered = false;
    const { el, close } = openModal({
      title,
      body: html`<p class="muted">${text}</p>`,
      foot: html`<div class="cluster" style="justify-content:flex-end">
        <button type="button" class="btn btn--secondary" data-answer="no">${cancelLabel || t("common.cancel")}</button>
        <button type="button" class="btn btn--primary" data-answer="yes" ${danger ? 'style="--btn-bg:var(--status-cancelled);--btn-border:var(--status-cancelled)"' : ""}>${confirmLabel}</button>
      </div>`,
      onClose: () => {
        if (!answered) resolve(false);
      },
    });
    el.addEventListener("click", (e) => {
      const b = e.target.closest("[data-answer]");
      if (!b) return;
      answered = true;
      resolve(b.dataset.answer === "yes");
      close();
    });
  });
}

__bind({ confirmDialog: () => confirmDialog, openDrawer: () => openDrawer, openModal: () => openModal, openPanel: () => openPanel });
});

__def("js/components/toast.js", function (__bind) {
/* ==========================================================================
   Toasts — short confirmations of an action ("حُفظت المسودة").
   Announced to screen readers through a polite live region.
   ========================================================================== */

const { fragment, html } = __req("js/core/dom.js");
const { icon } = __req("js/components/icons.js");
function region() {
  let el = document.querySelector(".toast-region");
  if (!el) {
    el = document.createElement("div");
    el.className = "toast-region";
    el.setAttribute("role", "status");
    el.setAttribute("aria-live", "polite");
    document.body.append(el);
  }
  return el;
}

/**
 * @param {string} message
 * @param {{ type?: "success"|"error"|"info", duration?: number,
 *           action?: { label: string, onClick: () => void } }} opts
 */
function toast(message, { type = "success", duration = 3200, action } = {}) {
  const iconName = type === "error" ? "alert" : type === "info" ? "info" : "check";
  const el = fragment(html`
    <div class="toast toast--${type}">
      <span class="toast__icon">${icon(iconName)}</span>
      <span class="toast__msg">${message}</span>
      ${action ? html`<button type="button" class="toast__action">${action.label}</button>` : ""}
    </div>
  `);
  if (action) {
    el.querySelector(".toast__action").addEventListener("click", () => {
      action.onClick();
      dismiss();
    });
  }
  region().append(el);

  let timer = setTimeout(dismiss, duration);
  el.addEventListener("mouseenter", () => clearTimeout(timer));
  el.addEventListener("mouseleave", () => (timer = setTimeout(dismiss, 1600)));

  function dismiss() {
    clearTimeout(timer);
    el.classList.add("is-leaving");
    setTimeout(() => el.remove(), 260);
  }
  return dismiss;
}

__bind({ toast: () => toast });
});

const { html, raw, fragment, $, $$, trapFocus, observeReveals, esc } = __req("js/core/dom.js");

const LOGO_CACHE_KEY = `rif:logo:v2:${BRAND.logo.file || "none"}:${BRAND.logo.fileOnDark || "none"}`;
let logoState = null; // { main: url|null, light: url|null }

function probe(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img.naturalWidth > 0 ? url : null);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

async function firstLoadable(list) {
  for (const path of list) {
    const ok = await probe(asset(path));
    if (ok) return ok;
  }
  return null;
}

async function resolveLogo() {
  if (logoState) return logoState;
  try {
    const cached = JSON.parse(sessionStorage.getItem(LOGO_CACHE_KEY) || "null");
    if (cached) return (logoState = cached);
  } catch {
    /* ignore */
  }
  const main = BRAND.logo.file ? await firstLoadable([BRAND.logo.file]) : null;
  const light = main && BRAND.logo.fileOnDark ? await firstLoadable([BRAND.logo.fileOnDark]) : null;
  logoState = { main, light };
  if (BRAND.logo.file && !main) console.warn(`Rif logo not found at ${BRAND.logo.file} — showing the wordmark.`);
  try {
    sessionStorage.setItem(LOGO_CACHE_KEY, JSON.stringify(logoState));
  } catch {
    /* ignore */
  }
  return logoState;
}

/** Typographic fallback shown until the logo file exists. */
function wordmark() {
  return html`<span class="brand__wordmark" aria-hidden="true">

/** Replace wordmarks with the real logo once it's known to load. */
function applyLogo(state) {
  if (!state?.main) return;
  $$("[data-brand]").forEach((a) => {
    const onDark = a.closest(".on-dark") !== null;
    const useLight = onDark && state.light;
    const src = useLight ? state.light : state.main;
    let img = $("img.brand__logo", a);
    if (!img) {
      a.innerHTML = "";
      img = document.createElement("img");
      img.className = "brand__logo";
      img.alt = L(BRAND.logo.alt);
      img.decoding = "async";
      a.append(img);
    }
    img.src = src;
    img.dataset.onDark = !useLight && BRAND.logo.onDark === "invert" ? "invert" : "none";
  });
}

/* ==========================================================================
   Behaviour
   ========================================================================== */

function wireMenu() {
  const menu = $("[data-menu]");
  if (!menu) return;
  let release = null;
  let lastTrigger = null;

  const open = (trigger) => {
    lastTrigger = trigger;
    menu.hidden = false;
    requestAnimationFrame(() => menu.classList.add("is-open"));
    document.body.classList.add("no-scroll");
    $$("[data-menu-open]").forEach((b) => b.setAttribute("aria-expanded", "true"));
    release = trapFocus(menu);
    setTimeout(() => $("[data-menu-close]", menu).focus(), 60);
  };
  const close = () => {
    menu.classList.remove("is-open");
    document.body.classList.remove("no-scroll");
    $$("[data-menu-open]").forEach((b) => b.setAttribute("aria-expanded", "false"));
    release?.();
    setTimeout(() => (menu.hidden = true), 700);
    lastTrigger?.focus?.();
  };

  $$("[data-menu-open]").forEach((b) => b.addEventListener("click", () => open(b)));
  $("[data-menu-close]", menu).addEventListener("click", close);
  menu.addEventListener("keydown", (e) => e.key === "Escape" && close());
  menu.addEventListener("click", (e) => {
    if (e.target.closest("a")) close();
  });
}

function wireLanguage() {
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-lang]");
    if (b) setLang(b.dataset.lang);
  });
}

function wireScroll(header, variant) {
  if (!header) return;
  let lastY = window.scrollY;
  let ticking = false;
  const cta = $("[data-header-cta]", header);

  const update = () => {
    const y = window.scrollY;
    const scrolled = y > 40;
    header.classList.toggle("is-scrolled", scrolled);
    if (variant === "overlay") {
      header.classList.toggle("on-dark", !scrolled);
      if (cta) {
        cta.classList.toggle("btn--outline-light", !scrolled);
        cta.classList.toggle("btn--primary", scrolled);
      }
      applyLogo(logoState);
    }
    const goingDown = y > lastY;
    const menuOpen = !$("[data-menu]")?.hidden;
    const hide = goingDown && y > 480 && !menuOpen;
    header.classList.toggle("is-hidden", hide);
    document.body.classList.toggle("header-hidden", hide);
    lastY = y;
    ticking = false;
  };
  window.addEventListener(
    "scroll",
    () => {
      if (!ticking) {
        requestAnimationFrame(update);
        ticking = true;
      }
    },
    { passive: true }
  );
  // When keyboard focus lands in the header, make sure it's visible
  header.addEventListener("focusin", () => {
    header.classList.remove("is-hidden");
    document.body.classList.remove("header-hidden");
  });
  update();
}

        ${icon("chevron")}

/* Links to pages that later build parts deliver: explain instead of 404 */
function wirePendingLinks() {

    const a = e.target.closest("a[href]");
    if (!a || e.defaultPrevented) return;
    const part = pendingPart(a.href);

  });

/* ==========================================================================
   Init
   ========================================================================== */

function initShell(opts = {}) {
  const { page = "", header = "solid", bottomNav = true, footer = "full", demo = true } = opts;

function stars(rand, n, color, maxY = 520) {
  let s = "";
  for (let i = 0; i < n; i++) {
    s += `<circle cx="${f(rand() * 1600)}" cy="${f(rand() * maxY)}" r="${f(0.6 + rand() * 1.6)}" fill="${color}" opacity="${f(0.35 + rand() * 0.6)}"/>`;
  }
  return s;
}

function sky(id, c, sun = true, sunPos = [0.68, 0.55], sunR = 90) {
  return (
    `<defs><linearGradient id="${id}-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.sky[0]}"/><stop offset="1" stop-color="${c.sky[1]}"/></linearGradient>` +
    `<radialGradient id="${id}-glow"><stop offset="0" stop-color="${c.sun}" stop-opacity=".9"/><stop offset="1" stop-color="${c.sun}" stop-opacity="0"/></radialGradient></defs>` +
    `<rect width="1600" height="1000" fill="url(#${id}-sky)"/>` +
    (sun ? `<circle cx="${1600 * sunPos[0]}" cy="${1000 * sunPos[1]}" r="${sunR * 3.2}" fill="url(#${id}-glow)"/><circle cx="${1600 * sunPos[0]}" cy="${1000 * sunPos[1]}" r="${sunR}" fill="${c.sun}" opacity=".92"/>` : "")
  );
}

/* ---- Scenes ----------------------------------------------------------- */
const SCENES = {
  dusk(id, c, r) {
    let s = sky(id, c, true, [0.3 + r() * 0.4, 0.62], 70);
    s += band(640, 14, c.far, r, 2);
    s += band(700, 10, c.mid, r, 3);
    for (let i = 0; i < 9; i++) {
      const x = 80 + i * 180 + (r() - 0.5) * 120;
      s += palm(x, 760 + r() * 30, 300 + r() * 220, c.ink, r, (r() - 0.5) * 0.25);
    }
    s += band(780, 8, c.ground, r, 2);
    return s;
  },

  grove(id, c, r) {
    let s = sky(id, c, c.light > 0, [0.5, 0.42], 60);
    s += band(560, 6, c.far, r, 2);
    // receding rows towards a central vanishing point
    const vx = 800 + (r() - 0.5) * 200;
    const vy = 560;
    for (let row = 6; row >= 0; row--) {
      const depth = row / 6; // 1 far → 0 near
      const scale = 1 - depth * 0.82;
      const y = vy + (1000 - vy) * Math.pow(1 - depth, 1.6) * 0.9 + 20;
      const h = 620 * scale;
      [-1, 1].forEach((side) => {
        const x = vx + side * (90 + 900 * Math.pow(1 - depth, 1.5));
        s += palm(x, y, h, row > 3 ? c.mid : c.ink, r, side * -0.06);
      });
    }
    s += `<path d="M${vx - 40} ${vy + 10} L${vx + 40} ${vy + 10} L${vx + 420} 1000 L${vx - 420} 1000 Z" fill="${c.ground2}" opacity=".55"/>`;
    return s;
  },

  field(id, c, r) {
    let s = sky(id, c, true, [0.22 + r() * 0.5, 0.36], 55);
    s += band(470, 8, c.far, r, 2);
    for (let i = 0; i < 7; i++) s += palm(100 + i * 230 + r() * 80, 485, 70 + r() * 60, c.mid, r, 0);
    s += `<rect y="480" width="1600" height="520" fill="${c.ground}"/>`;
    const vx = 800 + (r() - 0.5) * 300;
    for (let i = -14; i <= 14; i++) {
      s += `<path d="M${f(vx + i * 14)} 480 L${f(vx + i * 150)} 1000" stroke="${i % 2 ? c.ground2 : c.ink}" stroke-opacity="${i % 2 ? 0.7 : 0.35}" stroke-width="${i % 2 ? 9 : 3}"/>`;
    }
    return s;
  },

  dunes(id, c, r) {
    let s = sky(id, c, true, [0.25 + r() * 0.5, 0.5], 80);
    if (c.light === 2) s += stars(r, 160, c.sun);
    s += band(560, 40, c.far, r, 1.5);
    s += band(640, 55, c.mid, r, 1.2);
    for (let i = 0; i < 4; i++) s += shrub(150 + r() * 1300, 700 + r() * 60, 40 + r() * 40, c.ink, r);
    s += band(760, 45, c.ground, r, 1);
    s += band(880, 30, c.ground2, r, 1.4);
    return s;
  },

  mudbrick(id, c, r) {
    let s = sky(id, c, c.light > 0, [0.78, 0.4], 60);
    const wall = c.light === 0 ? "#C9A98A" : c.light === 1 ? "#8A5F43" : "#3B2E25";
    const shade = c.light === 0 ? "#B38F70" : c.light === 1 ? "#6B4733" : "#2C221B";
    const dark = c.light === 2 ? "#E8B478" : c.ink;
    s += `<rect y="760" width="1600" height="240" fill="${c.ground}"/>`;
    // two volumes
    const vols = [
      [180 + r() * 60, 380, 700, 400],
      [860, 470, 560, 310],
    ];
    vols.forEach(([x, y, w, h], vi) => {
      s += `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="${vi ? shade : wall}"/>`;
      // Najdi triangular crenellation
      const n = Math.floor(w / 46);
      for (let i = 0; i < n; i++) {
        const tx = x + i * (w / n);
        s += `<path d="M${f(tx + 6)} ${f(y)} L${f(tx + w / n / 2)} ${f(y - 30)} L${f(tx + w / n - 6)} ${f(y)} Z" fill="${vi ? shade : wall}"/>`;
      }
      // small triangular vents
      for (let i = 0; i < n - 1; i += 2) {
        const tx = x + 30 + i * (w / n);
        s += `<path d="M${f(tx)} ${f(y + 50)} l12 -18 l12 18 Z" fill="${dark}" opacity=".55"/>`;
      }
      // windows
      const wins = vi ? 3 : 4;
      for (let i = 0; i < wins; i++) {
        const wx = x + 70 + i * ((w - 140) / (wins - 1)) - 20;
        s += `<rect x="${f(wx)}" y="${f(y + 120)}" width="40" height="64" fill="${dark}" opacity="${c.light === 2 ? 0.9 : 0.6}"/>`;
      }
      if (!vi) s += `<rect x="${f(x + w / 2 - 55)}" y="${f(y + h - 190)}" width="110" height="190" fill="${dark}" opacity=".75"/>`;
    });
    // texture: horizontal mud courses
    for (let i = 0; i < 18; i++) s += `<path d="M180 ${400 + i * 21} H1420" stroke="${c.ink}" stroke-opacity=".05" stroke-width="2"/>`;
    s += palm(1480, 800, 520, c.ink, r, -0.08);
    s += palm(90, 800, 430, c.ink, r, 0.06);
    return s;
  },

  courtyard(id, c, r) {
    const wall = c.light === 2 ? "#3A2D24" : c.light === 1 ? "#7A5440" : "#D3B99A";
    const deep = c.light === 2 ? "#1E1813" : c.light === 1 ? "#4C3324" : "#A9876A";
    const glow = c.accent;
    let s = `<rect width="1600" height="1000" fill="${wall}"/>`;
    // arch opening showing the sky
    s += `<defs><clipPath id="${id}-arch"><path d="M500 1000 V420 Q500 180 800 160 Q1100 180 1100 420 V1000 Z"/></clipPath></defs>`;
    s += `<g clip-path="url(#${id}-arch)">${sky(id, c, true, [0.5, 0.5], 60)}${band(700, 10, c.mid, r, 2)}${palm(700, 760, 380, c.ink, r, 0.05)}${palm(930, 780, 300, c.ink, r, -0.05)}</g>`;
    s += `<path d="M470 1000 V420 Q470 150 800 128 Q1130 150 1130 420 V1000" fill="none" stroke="${deep}" stroke-width="30"/>`;
    // floor
    s += `<rect y="860" width="1600" height="140" fill="${deep}"/>`;
    for (let i = 0; i < 9; i++) s += `<path d="M${i * 200} 860 L${i * 200 - 140} 1000" stroke="${wall}" stroke-opacity=".25"/>`;
    // lanterns
    [260, 1340].forEach((x) => {
      s += `<circle cx="${x}" cy="520" r="140" fill="${glow}" opacity="${c.light >= 1 ? 0.18 : 0.08}"/>`;
      s += `<path d="M${x} 400 V450" stroke="${deep}" stroke-width="3"/><rect x="${x - 22}" y="450" width="44" height="70" rx="6" fill="${glow}" opacity=".9"/>`;
    });
    // majlis cushions
    s += `<rect x="0" y="800" width="400" height="60" fill="${deep}" opacity=".7"/><rect x="1200" y="800" width="400" height="60" fill="${deep}" opacity=".7"/>`;
    return s;
  },

  table(id, c, r) {
    const cloth = c.light === 2 ? "#2D241D" : c.light === 1 ? "#6A4936" : "#D9C6A8";
    const mat = c.light === 2 ? "#5B4636" : c.light === 1 ? "#A8774F" : "#C2A27A";
    let s = `<rect width="1600" height="1000" fill="${cloth}"/>`;
    // woven sufra
    s += `<circle cx="800" cy="500" r="430" fill="${mat}"/>`;
    for (let i = 1; i < 9; i++) s += `<circle cx="800" cy="500" r="${430 - i * 48}" fill="none" stroke="${c.ink}" stroke-opacity=".12" stroke-width="10"/>`;
    // plates with dates / kleija
    const items = [
      [800, 500, 150, "dates"],
      [520, 360, 95, "kleija"],
      [1080, 380, 90, "kleija"],
      [560, 690, 85, "cup"],
      [1050, 680, 100, "dates"],
    ];
    items.forEach(([x, y, rad, kind]) => {
      s += `<circle cx="${x}" cy="${y}" r="${rad}" fill="#F3EBDD"/><circle cx="${x}" cy="${y}" r="${rad * 0.82}" fill="none" stroke="${c.ink}" stroke-opacity=".12"/>`;
      if (kind === "dates") {
        for (let i = 0; i < 14; i++) {
          const a = r() * Math.PI * 2;
          const d = r() * rad * 0.6;
          s += `<ellipse cx="${f(x + Math.cos(a) * d)}" cy="${f(y + Math.sin(a) * d)}" rx="${f(rad * 0.13)}" ry="${f(rad * 0.08)}" transform="rotate(${f(r() * 180)} ${f(x + Math.cos(a) * d)} ${f(y + Math.sin(a) * d)})" fill="#7A4524"/>`;
        }
      } else if (kind === "kleija") {
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2;
          const cx = x + Math.cos(a) * rad * 0.42;
          const cy = y + Math.sin(a) * rad * 0.42;
          s += `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(rad * 0.26)}" fill="#C08A55"/><circle cx="${f(cx)}" cy="${f(cy)}" r="${f(rad * 0.14)}" fill="none" stroke="#8E5A32" stroke-width="3" stroke-dasharray="4 5"/>`;
        }
      } else {
        s += `<circle cx="${x}" cy="${y}" r="${rad * 0.45}" fill="#E7C98F"/><circle cx="${x}" cy="${y}" r="${rad * 0.32}" fill="#B98A45"/>`;
      }
    });
    s += `<rect width="1600" height="1000" fill="${c.ink}" opacity="${c.light === 2 ? 0.25 : 0.04}"/>`;
    return s;
  },

  craft(id, c, r) {
    const a = c.light >= 1 ? "#B0835A" : "#D6BC92";
    const b = c.light >= 1 ? "#8A6240" : "#B79868";
    const g = c.light >= 1 ? "#6E6A4D" : "#8F9273";
    let s = `<rect width="1600" height="1000" fill="${b}"/>`;
    const w = 70;
    // diagonal weave of palm strips
    s += `<g transform="rotate(-30 800 500)">`;
    for (let i = -14; i < 30; i++) {
      for (let j = -14; j < 30; j++) {
        const x = i * w;
        const y = j * w;
        const over = (i + j) % 2 === 0;
        const col = (i * 7 + j * 3) % 11 === 0 ? g : over ? a : b;
        s += `<rect x="${x + 3}" y="${y + 3}" width="${w - 6}" height="${w - 6}" rx="3" fill="${col}"/>`;
        s += over
          ? `<path d="M${x + 8} ${y + w / 2} H${x + w - 8}" stroke="${c.ink}" stroke-opacity=".1" stroke-width="2"/>`
          : `<path d="M${x + w / 2} ${y + 8} V${y + w - 8}" stroke="${c.ink}" stroke-opacity=".1" stroke-width="2"/>`;
      }
    }
    s += `</g>`;
    // soft vignette
    s += `<defs><radialGradient id="${id}-v"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></radialGradient></defs><rect width="1600" height="1000" fill="url(#${id}-v)"/>`;
    return s;
  },

  night(id, c, r) {
    let s = sky(id, c, false);
    s += stars(r, 220, "#F2E6D0", 640);
    s += `<circle cx="${1250 - r() * 300}" cy="180" r="38" fill="${c.sun}" opacity=".9"/>`;
    s += band(700, 10, c.far, r, 2);
    for (let i = 0; i < 6; i++) s += palm(140 + i * 270 + r() * 60, 780, 360 + r() * 200, c.ink, r, (r() - 0.5) * 0.2);
    s += band(770, 6, c.ground, r, 2);
    // string of warm lights
    let d = "M0 640";
    for (let i = 1; i <= 8; i++) d += ` Q${i * 200 - 100} ${700} ${i * 200} 640`;
    s += `<path d="${d}" fill="none" stroke="${c.ground2}" stroke-width="2"/>`;
    for (let i = 0; i < 40; i++) {
      const x = i * 40 + 20;
      const seg = (x % 200) / 200;
      const y = 640 + Math.sin(seg * Math.PI) * 30;
      s += `<circle cx="${x}" cy="${f(y + 6)}" r="16" fill="${c.accent}" opacity=".18"/><circle cx="${x}" cy="${f(y + 6)}" r="4" fill="${c.accent}"/>`;
    }
    // fire glow
    s += `<ellipse cx="800" cy="900" rx="260" ry="70" fill="${c.accent}" opacity=".22"/><ellipse cx="800" cy="900" rx="90" ry="22" fill="${c.accent}" opacity=".7"/>`;
    return s;
  },

  channel(id, c, r) {
    let s = sky(id, c, true, [0.5, 0.42], 50);
    s += band(520, 6, c.far, r, 2);
    s += `<rect y="520" width="1600" height="480" fill="${c.ground}"/>`;
    // water channel in perspective
    s += `<path d="M770 520 L830 520 L1060 1000 L540 1000 Z" fill="${c.ground2}"/>`;
    s += `<path d="M782 520 L818 520 L990 1000 L610 1000 Z" fill="${c.sky[1]}" opacity=".85"/>`;
    for (let i = 0; i < 12; i++) s += `<path d="M${f(700 + r() * 200)} ${f(560 + i * 36)} h${f(30 + r() * 60)}" stroke="${c.sky[0]}" stroke-width="3" opacity=".6"/>`;
    for (let row = 5; row >= 0; row--) {
      const depth = row / 5;
      const y = 520 + 480 * Math.pow(1 - depth, 1.5);
      const h = 640 * (1 - depth * 0.8);
      s += palm(800 - 140 - 640 * Math.pow(1 - depth, 1.4), y, h, row > 3 ? c.mid : c.ink, r, 0.04);
      s += palm(800 + 140 + 640 * Math.pow(1 - depth, 1.4), y, h, row > 3 ? c.mid : c.ink, r, -0.04);
    }
    return s;
  },

  harvest(id, c, r) {
    const wood = c.light >= 1 ? "#6B4733" : "#B38B62";
    const woodD = c.light >= 1 ? "#4A3122" : "#8F6A45";
    let s = `<rect width="1600" height="1000" fill="${c.light >= 1 ? "#3E2B1F" : "#D8C7A8"}"/>`;
    const crates = [
      [140, 160, 620, 380],
      [840, 120, 620, 380],
      [480, 560, 640, 380],
    ];
    crates.forEach(([x, y, w, h]) => {
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${woodD}"/>`;
      s += `<rect x="${x + 22}" y="${y + 22}" width="${w - 44}" height="${h - 44}" fill="#5A2E17"/>`;
      for (let i = 0; i < 120; i++) {
        const cx = x + 40 + r() * (w - 80);
        const cy = y + 40 + r() * (h - 80);
        const tone = r() > 0.5 ? "#8A4B26" : r() > 0.5 ? "#A8683A" : "#6E361A";
        s += `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="22" ry="14" transform="rotate(${f(r() * 180)} ${f(cx)} ${f(cy)})" fill="${tone}"/>`;
        if (r() > 0.7) s += `<ellipse cx="${f(cx - 6)}" cy="${f(cy - 4)}" rx="6" ry="3" fill="#E9C89B" opacity=".45"/>`;
      }
      s += `<rect x="${x}" y="${y}" width="${w}" height="22" fill="${wood}"/><rect x="${x}" y="${y + h - 22}" width="${w}" height="22" fill="${wood}"/>`;
    });
    return s;
  },
};

/** SVG markup for a demo scene. */
function sceneSVG({ scene = "grove", tone = "day", seed = 1 } = {}) {
  const id = `sc${++sceneCounter}`;
  const c = TONES[tone] || TONES.day;
  const r = rng(seed * 97 + scene.length);
  const body = (SCENES[scene] || SCENES.grove)(id, c, r);
  return `<svg class="media__scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">${body}</svg>`;
}

/**
 * Render an image slot.
 * @param {string} key  media registry key
 * @param {{ ratio?: string, cls?: string, eager?: boolean, label?: boolean,
 *           fill?: boolean, alt?: string, children?: SafeHTML }} opts
 * `children` is extra markup placed inside the figure (veils, overlays).
 */
function renderMedia(key, opts = {}) {
  const entry = getMedia(key);
  const { ratio, cls = "", eager = false, label = true, fill = false } = opts;
  const alt = opts.alt ?? L(entry.alt);
  const style = [ratio ? `--ratio:${ratio}` : "", entry.focal ? `--focal:${entry.focal}` : ""].filter(Boolean).join(";");
  const classes = ["media", fill ? "media--fill" : "", cls].filter(Boolean).join(" ");

  if (entry.src) {
    const src = /^(https?:)?\/\//.test(entry.src) ? entry.src : asset(entry.src);
    return raw(
      `<figure class="${classes}" style="${style}" data-media="${esc(key)}">` +
        `<img src="${esc(src)}" alt="${esc(alt)}" ${eager ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async" ` +
        `onload="this.classList.add('is-loaded')" onerror="this.remove()">` +
        String(opts.children ?? "") +
        `</figure>`
    );
  }

  return raw(
    `<figure class="${classes}" style="${style}" data-media="${esc(key)}" role="img" aria-label="${esc(alt)}">` +
      sceneSVG(entry) +
      (label ? `<figcaption class="media__label">${esc(t("common.demoImage"))}</figcaption>` : "") +
      String(opts.children ?? "") +
      `</figure>`
  );
}

__bind({ renderMedia: () => renderMedia, sceneSVG: () => sceneSVG });

/* ---- js/components/cards.js ---- */
__def("js/components/cards.js", function (__bind) {
/* ==========================================================================
   Cards
   Destination cards read like hospitality, not marketplace listings: the
   photograph leads, details are few, and the price sits quietly.
   ========================================================================== */

const { html, raw } = __req("js/core/dom.js");
const { L, t } = __req("js/core/i18n.js");
const { formatMoney, formatDuration, count } = __req("js/core/format.js");
const { route } = __req("js/core/paths.js");
const { DESTINATION_TYPES } = __req("js/data/destinations.js");
const { EXPERIENCE_CATEGORIES } = __req("js/data/experiences.js");
const { renderMedia } = __req("js/components/media.js");
const { icon } = __req("js/components/icons.js");
const STATUS_LABEL = { open: "avail.open", limited: "avail.limited", season: "avail.season", soon: "avail.soon" };

function priceLabel(amount, unit) {
  const unitKey = { person: "common.perPerson", night: "common.perNight", booking: "common.perBooking" }[unit];
  return { amount: formatMoney(amount), unit: unitKey ? t(unitKey) : "" };
}

/**
 * @param {object} d  destination
 * @param {{ eager?: boolean, ratio?: string, i?: number }} o
 */
function destinationCard(d, o = {}) {
  const href = route("destination", { id: d.id });
  const price = priceLabel(d.priceFrom, d.priceUnit);
  const overlay = html`
    <span class="dest-card__veil"></span>
    <div class="dest-card__over">
      <div class="cluster" style="--cluster-gap:var(--space-2)">
        ${d.tags.slice(0, 3).map((tag) => html`<span class="tag tag--on-dark">${L(tag)}</span>`)}
      </div>
      <div class="dest-card__reveal"><div>
        <p class="dest-card__desc">${L(d.short)}</p>
        <span class="dest-card__cta">${d.status === "soon" ? t("common.details") : t("card.explore")} ${icon("arrow", { size: "sm" })}</span>
      </div></div>
    </div>`;

  return html`
    <article class="dest-card" style="--i:${o.i ?? 0}">
      ${renderMedia(d.media.card, { ratio: o.ratio, cls: "dest-card__media media--label-top", eager: o.eager, children: overlay })}
      <div class="dest-card__body">
        <div class="dest-card__head">
          <h3 class="dest-card__name"><a class="dest-card__link" href="${href}">${L(d.name)}</a></h3>
          ${d.status === "soon"
            ? ""
            : html`<span class="dest-card__price">${t("common.from")} <strong class="num">${price.amount}</strong> ${price.unit}</span>`}
        </div>
        <div class="dest-card__line">
          <span>${L(d.town)}</span>
          <span>${L(DESTINATION_TYPES[d.type])}</span>
          <span class="availability availability--${d.status === "soon" ? "season" : d.status}">${t(STATUS_LABEL[d.status])}</span>
        </div>
      </div>
    </article>`;
}

/**
 * Experience card. The title books (or opens the destination for products);
 * the destination line links back to the place the experience belongs to,
 * so every card stays connected to a destination's story.
 * @param {object} e  experience listing (from api.getExperiences)
 */
function experienceCard(e, o = {}) {
  const cat = EXPERIENCE_CATEGORIES.find((c) => c.id === e.category);
  const bookable = e.priceUnit !== "item";
  const href = bookable ? route("booking", { package: e.id }) : route("destination", { id: e.destinationId, exp: e.id });
  const unitKey = { person: "common.perPerson", night: "common.perNight", booking: "common.perBooking", item: "card.perItem" }[e.priceUnit];
  return html`
    <article class="exp-card" style="--i:${o.i ?? 0}" data-exp-card="${e.id}">
      ${renderMedia(e.media, { cls: "exp-card__media" })}
      <div class="exp-card__body">
        <span class="exp-card__cat">${L(cat?.label)}${e.destinationName && o.showDestination !== false
          ? html` <a class="exp-card__dest" href="${route("destination", { id: e.destinationId })}">${t("card.at")} ${L(e.destinationName)}</a>`
          : ""}</span>
        <h3 class="exp-card__title"><a href="${href}">${L(e.title)}</a></h3>
        <p class="exp-card__desc">${L(e.desc)}</p>
        <div class="exp-card__facts">
          ${e.durationHours > 0 ? html`<span>${icon("clock", { size: "sm" })} ${formatDuration(e.durationHours)}</span>` : ""}
          ${bookable ? html`<span>${icon("users", { size: "sm" })} ${t("card.upTo")} ${count(e.maxGuests, "guests")}</span>` : html`<span>${t("card.pickup")}</span>`}
          <span class="exp-card__price"><span class="num">${formatMoney(e.price)}</span> <span class="muted">${unitKey ? t(unitKey) : ""}</span></span>
        </div>
      </div>
    </article>`;
}

/* ---- Loading & empty --------------------------------------------------- */

function skeletonCards(n = 3, { ratio = "4 / 5" } = {}) {
  return html`${Array.from({ length: n }, () => html`
    <div class="skeleton-card" aria-hidden="true" style="--ratio:${ratio}">
      <div class="skeleton skeleton--media"></div>
      <div class="skeleton skeleton--title"></div>
      <div class="skeleton skeleton--text" style="width:85%"></div>
      <div class="skeleton skeleton--text" style="width:50%"></div>
    </div>`)}`;
}

/**
 * @param {{ title: string, text?: string, action?: SafeHTML, icon?: string }} o
 */
function emptyState(o) {
  return html`
    <div class="empty-state contours" role="status">
      <span class="empty-state__mark">${icon(o.icon || "survey", { cls: "icon--lg" })}</span>
      <p class="empty-state__title">${o.title}</p>
      ${o.text ? html`<p class="empty-state__text">${o.text}</p>` : ""}
      ${o.action || ""}
    </div>`;
}

/** Error state with a retry button (data-retry). */
function errorState(message) {
  return emptyState({
    title: t("error.loadTitle"),
    text: message || t("error.loadText"),
    icon: "alert",
    action: html`<button type="button" class="btn btn--secondary btn--sm" data-retry>${icon("refresh", { size: "sm" })} ${t("error.retry")}</button>`,
  });
}


/* ---- Page band (inner-page hero, homepage language) ------------------- */
/**
 * @param {{ media: string, crumbs: {label:string, href?:string}[], kicker?: string,
 *           title: string, lead?: string, facts?: SafeHTML, actions?: SafeHTML, compact?: boolean }} o
 */
function pageBand(o) {
  return html`
    <section class="band ${o.compact ? "band--compact" : ""} ${o.tall ? "band--tall" : ""} ${o.cls || ""}" data-band aria-labelledby="band-title">
      <div class="band__media">${renderMedia(o.media, { fill: true, eager: true, label: false })}</div>
      <div class="band__veil"></div>
      <div class="container container--wide band__inner">
        <nav class="crumbs" aria-label="${L({ ar: "مسار التنقل", en: "Breadcrumb" })}" data-band-in>
          ${o.crumbs.map((c, i) => html`${i ? icon("chevron", { size: "sm" }) : ""}${c.href ? html`<a href="${c.href}">${c.label}</a>` : html`<span aria-current="page">${c.label}</span>`}`)}
        </nav>
        <h1 class="band__title" id="band-title"><span class="line-mask"><span>${o.title}</span></span></h1>
        ${o.lead ? html`<p class="band__lead" data-band-in style="--d:500">${o.lead}</p>` : ""}
        ${o.actions ? html`<div class="hero__actions cluster" data-band-in style="--d:650">${o.actions}</div>` : ""}
        <div class="band__foot" data-band-in style="--d:700">
          <div class="band__facts">${o.facts || ""}</div>
          <span class="band__label">${t("common.demoImage")}</span>
        </div>
      </div>
    </section>`;
}

/** Play the band's entrance once it is in the DOM. */
function playBand(root = document) {
  const band = root.querySelector("[data-band]");
  if (!band) return;
  requestAnimationFrame(() =>
    requestAnimationFrame(() => {
      band.classList.add("is-in");
      band.querySelectorAll(".line-mask").forEach((m) => m.classList.add("is-revealed"));
    })
  );
}

__bind({ destinationCard: () => destinationCard, emptyState: () => emptyState, errorState: () => errorState, experienceCard: () => experienceCard, pageBand: () => pageBand, playBand: () => playBand, priceLabel: () => priceLabel, raw: () => raw, skeletonCards: () => skeletonCards });
});

/* ---- js/services/availability.js ---- */
__def("js/services/availability.js", function (__bind) {
/* ==========================================================================
   Availability (DEMO)
   Rules come from the data (weekdays, seasons, event dates, booking window).
   On top of that, a deterministic hash marks some dates "limited" or "full"
   so the calendar feels realistic — it is the same every visit and is NOT
   real availability. The UI labels it as demo.
   ========================================================================== */

const { parseISODate, toISODate } = __req("js/core/format.js");
/** The prototype's "today". Uses the real clock so dates stay sensible. */
function today() {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

const addDays = (date, n) => new Date(date.getFullYear(), date.getMonth(), date.getDate() + n);

function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0) / 4294967295;
}

/** "MM-DD" season check that supports wrapping across the new year. */
function inSeason(date, season) {
  if (!season) return true;
  const md = `${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
  const { from, to } = season;
  return from <= to ? md >= from && md <= to : md >= from || md <= to;
}

/**
 * Status of one date for a package.
 * returns: "available" | "limited" | "full" | "closed" | "past" | "outside"
 */
function packageDateStatus(pkg, dateInput, ref = today()) {
  const date = typeof dateInput === "string" ? parseISODate(dateInput) : dateInput;
  if (!pkg || !date) return "closed";
  const { days, season, dates, leadDays = 1, windowDays = 120 } = pkg.availability;
  if (date < addDays(ref, leadDays)) return "past";
  if (date > addDays(ref, windowDays)) return "outside";
  if (dates) {
    if (!dates.includes(toISODate(date))) return "closed";
  } else {
    if (days && !days.includes(date.getDay())) return "closed";
    if (season && !inSeason(date, season)) return "closed";
  }
  const h = hash(`${pkg.id}:${toISODate(date)}`);
  if (h < 0.08) return "full";
  if (h < 0.28) return "limited";
  return "available";
}

const isBookable = (status) => status === "available" || status === "limited";

/** Build a month grid for the calendar: weeks starting on Sunday. */
function monthGrid(year, month, statusFn) {
  const first = new Date(year, month, 1);
  const startOffset = first.getDay(); // Sunday = 0
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month, d);
    cells.push({ date, iso: toISODate(date), day: d, status: statusFn(date) });
  }
  while (cells.length % 7 !== 0) cells.push(null);
  return cells;
}

/** First bookable date for a package (used to suggest a date). */
function firstAvailableDate(pkg, ref = today()) {
  for (let i = 0; i <= (pkg.availability.windowDays || 120); i++) {
    const d = addDays(ref, i);
    if (isBookable(packageDateStatus(pkg, d, ref))) return toISODate(d);
  }
  return null;
}

/** Is an experience offered on a given date? (filters on the experiences page) */
function experienceAvailableOn(exp, dateInput) {
  const date = typeof dateInput === "string" ? parseISODate(dateInput) : dateInput;
  if (!date) return true;
  const { days, season, dates } = exp.availability || {};
  if (dates) return dates.includes(toISODate(date));
  if (season && !inSeason(date, season)) return false;
  if (days && !days.includes(date.getDay())) return false;
  return true;
}

/** Is an experience offered at all in the next N days? */
function experienceUpcoming(exp, horizonDays = 120, ref = today()) {
  for (let i = 0; i <= horizonDays; i++) {
    if (experienceAvailableOn(exp, addDays(ref, i))) return true;
  }
  return false;
}

__bind({ experienceAvailableOn: () => experienceAvailableOn, experienceUpcoming: () => experienceUpcoming, firstAvailableDate: () => firstAvailableDate, inSeason: () => inSeason, isBookable: () => isBookable, monthGrid: () => monthGrid, packageDateStatus: () => packageDateStatus, today: () => today });
});

/* ---- js/components/calendar.js ---- */
__def("js/components/calendar.js", function (__bind) {
/* ==========================================================================
   Calendar — month view with demo availability.
   Weeks start on Sunday. In RTL the grid flows right-to-left naturally,
   and the previous/next buttons follow reading direction.

   const cal = createCalendar(el, {
     statusFn: (date) => "available" | "limited" | "full" | "closed" | "past" | "outside",
     value: "2026-10-16", onSelect: (iso) => {}
   })
   ========================================================================== */

const { html, mount, on } = __req("js/core/dom.js");
const { t, L } = __req("js/core/i18n.js");
const { formatMonth, formatDate, parseISODate, weekdayNames } = __req("js/core/format.js");
const { monthGrid, isBookable, today } = __req("js/services/availability.js");
const { icon } = __req("js/components/icons.js");
const STATUS_TEXT = {
  available: { ar: "متاح", en: "Available" },
  limited: { ar: "أماكن محدودة", en: "Limited" },
  full: { ar: "مكتمل", en: "Full" },
  closed: { ar: "غير متاح في هذا اليوم", en: "Not offered this day" },
  past: { ar: "غير متاح", en: "Unavailable" },
  outside: { ar: "خارج فترة الحجز", en: "Outside booking window" },
};

function createCalendar(el, { statusFn, value = null, onSelect, minMonth, month: startMonth } = {}) {
  // Opens on the selected date, else on a suggested month, else today
  const start = value ? parseISODate(value) : startMonth ? parseISODate(startMonth) : today();
  let year = start.getFullYear();
  let month = start.getMonth();
  let selected = value;
  const floor = minMonth || today();

  const render = () => {
    const cells = monthGrid(year, month, statusFn);
    const canPrev = year > floor.getFullYear() || (year === floor.getFullYear() && month > floor.getMonth());
    mount(
      el,
      html`
      <div class="cal" data-cal>
        <div class="cal__head">
          <button type="button" class="cal__nav" data-cal-prev ${canPrev ? "" : "disabled"} aria-label="${t("cal.prev")}">${icon("chevron", { cls: "cal__prev" })}</button>
          <p class="cal__month" aria-live="polite">${formatMonth(new Date(year, month, 1))}</p>
          <button type="button" class="cal__nav" data-cal-next aria-label="${t("cal.next")}">${icon("chevron")}</button>
        </div>
        <div class="cal__grid" role="grid">
          ${weekdayNames("narrow").map((w) => html`<span class="cal__wd" role="columnheader">${w}</span>`)}
          ${cells.map((c) =>
            c
              ? html`<button type="button" role="gridcell" class="cal__day is-${c.status} ${c.iso === selected ? "is-selected" : ""}"
                  data-iso="${c.iso}" ${isBookable(c.status) ? "" : "disabled"}
                  aria-pressed="${c.iso === selected}"
                  aria-label="${formatDate(c.date)}، ${L(STATUS_TEXT[c.status])}"><span class="num">${c.day}</span></button>`
              : html`<span class="cal__day is-empty" aria-hidden="true"></span>`
          )}
        </div>
        <div class="cal__legend">
          <span><i class="is-available"></i>${L(STATUS_TEXT.available)}</span>
          <span><i class="is-limited"></i>${L(STATUS_TEXT.limited)}</span>
          <span><i class="is-full"></i>${L(STATUS_TEXT.full)}</span>
        </div>
      </div>`
    );
  };

  on(el, "click", "[data-cal-prev]", () => {
    month -= 1;
    if (month < 0) { month = 11; year -= 1; }
    render();
  });
  on(el, "click", "[data-cal-next]", () => {
    month += 1;
    if (month > 11) { month = 0; year += 1; }
    render();
  });
  on(el, "click", "[data-iso]", (e, b) => {
    selected = b.dataset.iso;
    render();
    el.querySelector(`[data-iso="${selected}"]`)?.focus();
    onSelect?.(selected);
  });

  render();
  return {
    get value() {
      return selected;
    },
    set(iso) {
      selected = iso;
      if (iso) {
        const d = parseISODate(iso);
        year = d.getFullYear();
        month = d.getMonth();
      }
      render();
    },
  };
}

__bind({ createCalendar: () => createCalendar });
});

/* ---- js/components/forms.js ---- */
__def("js/components/forms.js", function (__bind) {
/* ==========================================================================
   Forms
   Field markup helpers + declarative validation via data-rules:
     data-rules="required|number|min:1|max:500|email|phone|minChecked:1"
   Errors appear under the field, in the interface's voice, and say how to
   fix the problem.
   ========================================================================== */

const { html, raw, $, $$, on, esc, uid } = __req("js/core/dom.js");
const { t } = __req("js/core/i18n.js");
const { formatNumber } = __req("js/core/format.js");
const { icon } = __req("js/components/icons.js");
/* ==========================================================================
   Markup helpers
   ========================================================================== */

/**
 * Text / number / email / tel / date / select / textarea field.
 * @param {{ name, label, type?, value?, placeholder?, hint?, unit?, optional?,
 *           rules?, inputmode?, options?: {value,label}[], autocomplete?, min?, max?, step?, dir? }} o
 */
function field(o) {
  const id = `f-${o.name}-${uid(3)}`;
  const hintId = o.hint ? `${id}-hint` : "";
  const rules = o.rules || (o.optional ? "" : "required");
  const common = `id="${id}" name="${esc(o.name)}" data-rules="${esc(rules)}" ${hintId ? `aria-describedby="${hintId}"` : ""} ${o.autocomplete ? `autocomplete="${o.autocomplete}"` : ""}`;
  let control;

  if (o.type === "select") {
    control = `<select class="select" ${common}>
      <option value="">${esc(o.placeholder || "")}</option>
      ${(o.options || []).map((opt) => `<option value="${esc(opt.value)}" ${String(o.value ?? "") === String(opt.value) ? "selected" : ""}>${esc(opt.label)}</option>`).join("")}
    </select>`;
  } else if (o.type === "textarea") {
    control = `<textarea class="textarea" ${common} placeholder="${esc(o.placeholder || "")}" rows="${o.rows || 4}">${esc(o.value ?? "")}</textarea>`;
  } else {
    const type = o.type || "text";
    const attrs = [
      o.inputmode ? `inputmode="${o.inputmode}"` : "",
      o.min !== undefined ? `min="${o.min}"` : "",
      o.max !== undefined ? `max="${o.max}"` : "",
      o.step !== undefined ? `step="${o.step}"` : "",
      o.dir ? `dir="${o.dir}"` : "",
      type === "number" ? 'data-type="number"' : "",
    ].join(" ");
    control = `<input class="input" type="${type}" ${common} ${attrs} value="${esc(o.value ?? "")}" placeholder="${esc(o.placeholder || "")}">`;
    if (o.unit) control = `<div class="input-group">${control}<span class="input-group__unit">${esc(o.unit)}</span></div>`;
  }

  return raw(`
    <div class="field" data-field="${esc(o.name)}">
      <label class="field__label" for="${id}">${esc(o.label)}${o.optional ? `<span class="optional">${esc(t("common.optional"))}</span>` : ""}</label>
      ${control}
      ${o.hint ? `<p class="field__hint" id="${hintId}">${esc(o.hint)}</p>` : ""}
    </div>`);
}

/**
 * A group of choice cards (radio or checkbox).
 * @param {{ name, label, type?: "radio"|"checkbox", options: {value,title,desc?,price?,icon?}[],
 *           value?: string|string[], rules?, hint?, cols?: string }} o
 */
function choiceGroup(o) {
  const type = o.type || "radio";
  const selected = new Set(Array.isArray(o.value) ? o.value : o.value !== undefined && o.value !== null ? [o.value] : []);
  const rules = o.rules ?? (type === "checkbox" ? "minChecked:1" : "required");
  const legendId = `lg-${o.name}-${uid(3)}`;
  return raw(`
    <fieldset class="field" data-field="${esc(o.name)}" data-group="${esc(o.name)}" data-rules="${esc(rules)}" style="border:0;padding:0;margin:0">
      ${o.label ? `<legend class="field__label" id="${legendId}" style="padding:0;margin-bottom:var(--space-2)">${esc(o.label)}</legend>` : ""}
      ${o.hint ? `<p class="field__hint" style="margin-bottom:var(--space-3)">${esc(o.hint)}</p>` : ""}
      <div class="choice-grid" ${o.cols ? `style="grid-template-columns:${o.cols}"` : ""}>
        ${o.options
          .map(
            (opt) => `
          <label class="choice">
            <input type="${type}" name="${esc(o.name)}" value="${esc(opt.value)}" ${selected.has(opt.value) ? "checked" : ""}>
            <span class="choice__box">
              <span class="choice__mark">${icon("check")}</span>
              <span class="choice__text">
                <span class="choice__title">${esc(opt.title)}</span>
                ${opt.desc ? `<span class="choice__desc">${esc(opt.desc)}</span>` : ""}
              </span>
              ${opt.price ? `<span class="choice__price">${esc(opt.price)}</span>` : ""}
            </span>
          </label>`
          )
          .join("")}
      </div>
    </fieldset>`);
}

/**
 * Numeric stepper (guests, rooms, staff).
 * @param {{ name, label, value?, min?, max?, hint?, unitLabel?: (n) => string }} o
 */
function stepper(o) {
  const id = `st-${o.name}-${uid(3)}`;
  const min = o.min ?? 0;
  const max = o.max ?? 999;
  const value = o.value ?? min;
  return raw(`
    <div class="field" data-field="${esc(o.name)}">
      <label class="field__label" for="${id}">${esc(o.label)}</label>
      <div class="cluster" style="--cluster-gap:var(--space-4)">
        <div class="stepper" data-stepper data-min="${min}" data-max="${max}">
          <button type="button" class="stepper__btn" data-step="-1" aria-label="${esc(t("stepper.decrease"))}" ${value <= min ? "disabled" : ""}>${icon("minus")}</button>
          <input class="stepper__value num" id="${id}" name="${esc(o.name)}" type="number" inputmode="numeric" data-type="number"
            data-rules="required|number|min:${min}|max:${max}" min="${min}" max="${max}" value="${value}">
          <button type="button" class="stepper__btn" data-step="1" aria-label="${esc(t("stepper.increase"))}" ${value >= max ? "disabled" : ""}>${icon("plus")}</button>
        </div>
        ${o.unitLabel ? `<span class="muted small" data-stepper-label>${esc(o.unitLabel(value))}</span>` : ""}
      </div>
      ${o.hint ? `<p class="field__hint">${esc(o.hint)}</p>` : ""}
    </div>`);
}

/** Wire up every stepper inside root (delegated; safe to call once per page). */
function initSteppers(root = document, { unitLabel } = {}) {
  const sync = (wrap, input) => {
    const min = Number(wrap.dataset.min);
    const max = Number(wrap.dataset.max);
    const v = Number(input.value);
    wrap.querySelector('[data-step="-1"]').disabled = !(v > min);
    wrap.querySelector('[data-step="1"]').disabled = !(v < max);
    const label = wrap.parentElement.querySelector("[data-stepper-label]");
    if (label && unitLabel) label.textContent = unitLabel(v, input.name);
  };

  on(root, "click", "[data-stepper] [data-step]", (e, btn) => {
    const wrap = btn.closest("[data-stepper]");
    const input = wrap.querySelector("input");
    const min = Number(wrap.dataset.min);
    const max = Number(wrap.dataset.max);
    const next = Math.min(max, Math.max(min, (Number(input.value) || 0) + Number(btn.dataset.step)));
    input.value = next;
    sync(wrap, input);
    input.dispatchEvent(new Event("input", { bubbles: true }));
    input.dispatchEvent(new Event("change", { bubbles: true }));
  });

  on(root, "input", "[data-stepper] input", (e, input) => sync(input.closest("[data-stepper]"), input));
}

/* ==========================================================================
   Validation
   ========================================================================== */

const PHONE_RE = /^05\d{8}$/;
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

/** Normalise Arabic-Indic digits and spaces in phone/number input. */
function normaliseDigits(value) {
  return String(value ?? "")
    .replace(/[\u0660-\u0669]/g, (d) => String(d.charCodeAt(0) - 0x0660))
    .replace(/[\u06F0-\u06F9]/g, (d) => String(d.charCodeAt(0) - 0x06f0));
}

function checkRules(value, rules, { checkedCount } = {}) {
  const list = (rules || "").split("|").filter(Boolean);
  const v = normaliseDigits(value).trim();
  for (const rule of list) {
    const [name, arg] = rule.split(":");
    switch (name) {
      case "required":
        if (checkedCount !== undefined ? checkedCount === 0 : v === "") return checkedCount !== undefined ? t("error.choose") : t("error.required");
        break;
      case "minChecked":
        if ((checkedCount || 0) < Number(arg)) return t("error.choose");
        break;
      case "number":
        if (v !== "" && !Number.isFinite(Number(v))) return t("error.number");
        break;
      case "min":
        if (v !== "" && Number(v) < Number(arg)) return t("error.min", { min: formatNumber(Number(arg)) });
        break;
      case "max":
        if (v !== "" && Number(v) > Number(arg)) return t("error.max", { max: formatNumber(Number(arg)) });
        break;
      case "email":
        if (v !== "" && !EMAIL_RE.test(v)) return t("error.email");
        break;
      case "phone":
        if (v !== "" && !PHONE_RE.test(v.replace(/[\s-]/g, ""))) return t("error.phone");
        break;
      default:
        break;
    }
  }
  return null;
}

function showError(fieldEl, message) {
  if (!fieldEl) return;
  fieldEl.classList.add("is-invalid");
  fieldEl.classList.remove("is-valid");
  let err = fieldEl.querySelector(":scope > .field__error");
  if (!err) {
    err = document.createElement("p");
    err.className = "field__error";
    err.id = `err-${uid(4)}`;
    fieldEl.append(err);
  }
  err.innerHTML = `${icon("alert", { size: "sm" })}<span>${esc(message)}</span>`;
  $$("input, select, textarea", fieldEl).forEach((c) => {
    c.setAttribute("aria-invalid", "true");
    const ids = new Set((c.getAttribute("aria-describedby") || "").split(" ").filter(Boolean));
    ids.add(err.id);
    c.setAttribute("aria-describedby", [...ids].join(" "));
  });
}

function clearError(fieldEl) {
  if (!fieldEl) return;
  fieldEl.classList.remove("is-invalid");
  const err = fieldEl.querySelector(":scope > .field__error");
  if (err) {
    $$("input, select, textarea", fieldEl).forEach((c) => {
      c.removeAttribute("aria-invalid");
      const ids = (c.getAttribute("aria-describedby") || "").split(" ").filter((x) => x && x !== err.id);
      ids.length ? c.setAttribute("aria-describedby", ids.join(" ")) : c.removeAttribute("aria-describedby");
    });
    err.remove();
  }
}

/** Validate a single .field element. Returns the error message or null. */
function validateField(fieldEl, extra) {
  if (!fieldEl) return null;
  let message;
  if (fieldEl.dataset.group) {
    const checked = $$(`input[name="${fieldEl.dataset.group}"]:checked`, fieldEl).length;
    message = checkRules("", fieldEl.dataset.rules, { checkedCount: checked });
  } else {
    const control = $("input, select, textarea", fieldEl);
    if (!control) return null;
    message = checkRules(control.value, control.dataset.rules);
  }
  if (!message && extra) message = extra(fieldEl) || null;
  message ? showError(fieldEl, message) : clearError(fieldEl);
  return message;
}

/**
 * Validate every field in a container.
 * @param {HTMLElement} root
 * @param {Record<string, (fieldEl) => string|null>} custom  extra checks by field name
 */
function validateForm(root, custom = {}) {
  const fields = $$(".field[data-field]", root).filter((f) => f.offsetParent !== null || f.closest("[data-validate-hidden]"));
  let firstInvalid = null;
  fields.forEach((f) => {
    const msg = validateField(f, custom[f.dataset.field]);
    if (msg && !firstInvalid) firstInvalid = f;
  });
  if (firstInvalid) {
    firstInvalid.scrollIntoView({ behavior: "smooth", block: "center" });
    const control = $("input, select, textarea", firstInvalid);
    setTimeout(() => control?.focus({ preventScroll: true }), 300);
  }
  return { valid: !firstInvalid, firstInvalid };
}

/** Validate on blur; clear an error as soon as the value becomes valid. */
function bindLiveValidation(root, custom = {}) {
  root.addEventListener(
    "blur",
    (e) => {
      const f = e.target.closest?.(".field[data-field]");
      if (f && !f.dataset.group && e.target.value !== "") validateField(f, custom[f.dataset.field]);
    },
    true
  );
  const recheck = (e) => {
    const f = e.target.closest?.(".field[data-field]");
    if (f && f.classList.contains("is-invalid")) validateField(f, custom[f.dataset.field]);
  };
  root.addEventListener("input", recheck);
  root.addEventListener("change", recheck);
}

/* ==========================================================================
   Read / write values
   ========================================================================== */

function readForm(root) {
  const values = {};
  $$("input, select, textarea", root).forEach((c) => {
    if (!c.name || c.type === "file") return;
    if (c.type === "checkbox") {
      if (!Array.isArray(values[c.name])) values[c.name] = [];
      if (c.checked) values[c.name].push(c.value);
    } else if (c.type === "radio") {
      if (c.checked) values[c.name] = c.value;
      else if (!(c.name in values)) values[c.name] = "";
    } else if (c.dataset.type === "number") {
      const v = normaliseDigits(c.value).trim();
      values[c.name] = v === "" ? "" : Number(v);
    } else {
      values[c.name] = c.type === "tel" ? normaliseDigits(c.value).replace(/[\s-]/g, "") : c.value;
    }
  });
  return values;
}

function fillForm(root, values = {}) {
  Object.entries(values).forEach(([name, value]) => {
    $$(`[name="${CSS.escape(name)}"]`, root).forEach((c) => {
      if (c.type === "checkbox") c.checked = Array.isArray(value) && value.includes(c.value);
      else if (c.type === "radio") c.checked = String(value) === c.value;
      else if (value !== undefined && value !== null) c.value = value;
    });
  });
}

/* ==========================================================================
   Mock uploader
   Files never leave the device. Only names/sizes are saved (for drafts);
   image thumbnails exist for the current session only.
   ========================================================================== */

const fmtSize = (b) => (b > 1e6 ? `${(b / 1e6).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1e3))} KB`);

/**
 * @param {HTMLElement} el     container
 * @param {{ name, label, accept?, multiple?, initial?: {name,size,type}[],
 *           onChange?: (files) => void, hint? }} o
 */
function createUploader(el, o) {
  let files = [...(o.initial || [])].map((f) => ({ ...f, id: f.id || uid(5), done: true }));
  const inputId = `up-${o.name}-${uid(3)}`;

  el.innerHTML = String(html`
    <div class="uploader">
      <label class="uploader__drop" for="${inputId}">
        ${icon("upload")}
        <span>${o.label || t("upload.drop")}</span>
        <span class="meta">${o.hint || t("upload.hint")}</span>
        <input id="${inputId}" type="file" ${o.multiple !== false ? "multiple" : ""} accept="${o.accept || ""}">
      </label>
      <ul class="uploader__list" role="list"></ul>
    </div>
  `);

  const list = $(".uploader__list", el);
  const drop = $(".uploader__drop", el);
  const input = $("input", el);

  const emit = () => o.onChange?.(files.filter((f) => f.done).map(({ id, name, size, type }) => ({ id, name, size, type })));

  const render = () => {
    list.innerHTML = files
      .map(
        (f) => `
      <li class="upload-item ${f.done ? "is-done" : ""}" data-id="${f.id}">
        <span class="upload-item__thumb">${f.thumb ? `<img src="${f.thumb}" alt="">` : String(icon(f.type?.startsWith("image") ? "image" : "file"))}</span>
        <span style="min-width:0">
          <span class="upload-item__name" style="display:block">${esc(f.name)}</span>
          <span class="meta">${fmtSize(f.size)}${f.done ? `<span class="visually-hidden">${esc(t("upload.done"))}</span>` : ""}</span>
          <span class="upload-item__bar"><span style="--p:${f.progress ?? 1}"></span></span>
        </span>
        <button type="button" class="upload-item__remove" data-remove aria-label="${esc(t("common.remove"))} ${esc(f.name)}">${icon("close", { size: "sm" })}</button>
      </li>`
      )
      .join("");
  };

  const simulate = (f) => {
    f.progress = 0;
    const tick = () => {
      f.progress = Math.min(1, f.progress + 0.18 + Math.random() * 0.2);
      const bar = list.querySelector(`[data-id="${f.id}"] .upload-item__bar span`);
      if (bar) bar.style.setProperty("--p", f.progress);
      if (f.progress < 1) setTimeout(tick, 160);
      else {
        f.done = true;
        render();
        emit();
      }
    };
    setTimeout(tick, 120);
  };

  const add = (fileList) => {
    Array.from(fileList).forEach((file) => {
      const f = { id: uid(5), name: file.name, size: file.size, type: file.type, done: false };
      if (file.type.startsWith("image/")) f.thumb = URL.createObjectURL(file);
      files.push(f);
      render();
      simulate(f);
    });
  };

  input.addEventListener("change", () => {
    add(input.files);
    input.value = "";
  });
  ["dragenter", "dragover"].forEach((ev) =>
    drop.addEventListener(ev, (e) => {
      e.preventDefault();
      drop.classList.add("is-dragover");
    })
  );
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, () => drop.classList.remove("is-dragover")));
  drop.addEventListener("drop", (e) => {
    e.preventDefault();
    if (e.dataTransfer?.files) add(e.dataTransfer.files);
  });
  list.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-remove]");
    if (!btn) return;
    const id = btn.closest("[data-id]").dataset.id;

/* ---- js/services/pricing.js ---- */
__def("js/services/pricing.js", function (__bind) {
/* ==========================================================================
   Pricing engine
   Pure functions, no DOM, no language: used by checkout, the booking summary
   and the admin bookings table so every total in the product agrees.
   Labels are returned as { ar, en } objects; the UI localises them.
   ========================================================================== */

const { VAT_RATE } = __req("js/data/packages.js");
const round2 = (n) => Math.round(n * 100) / 100;

/**
 * @param {object} pkg     package from data/packages.js
 * @param {object} input   { guests: number, addOns: string[] }
 * @returns {{ lines, subtotal, vat, total, perPerson, guests, valid, errors }}
 */
function computePackagePrice(pkg, { guests = 1, addOns = [] } = {}) {
  const errors = [];
  if (!pkg) return { lines: [], subtotal: 0, vat: 0, total: 0, perPerson: 0, guests, valid: false, errors: ["package"] };

  const g = Math.floor(Number(guests));
  if (!Number.isFinite(g) || g < pkg.minGuests) errors.push("guests-min");
  if (g > pkg.maxGuests) errors.push("guests-max");
  const safeGuests = Math.min(pkg.maxGuests, Math.max(pkg.minGuests, Number.isFinite(g) ? g : pkg.minGuests));

  const lines = [];
  const { pricing } = pkg;

  if (pricing.model === "person") {
    lines.push({
      id: "base",
      kind: "base",
      label: pkg.title,
      qty: safeGuests,
      unit: "person",
      unitPrice: pricing.basePrice,
      amount: pricing.basePrice * safeGuests,
    });
  } else {
    lines.push({
      id: "base",
      kind: "base",
      label: pkg.title,
      qty: 1,
      unit: "booking",
      unitPrice: pricing.basePrice,
      amount: pricing.basePrice,
      note: { ar: `يشمل ${pricing.includedGuests} ضيوف`, en: `Includes ${pricing.includedGuests} guests` },
    });
    const extra = Math.max(0, safeGuests - pricing.includedGuests);
    if (extra > 0) {
      lines.push({
        id: "extra-guests",
        kind: "extra",
        label: { ar: "ضيوف إضافيون", en: "Extra guests" },
        qty: extra,
        unit: "person",
        unitPrice: pricing.extraGuestPrice,
        amount: pricing.extraGuestPrice * extra,
      });
    }
  }

  const selected = new Set(addOns);
  pkg.addOns
    .filter((a) => selected.has(a.id))
    .forEach((a) => {
      const qty = a.unit === "person" ? safeGuests : 1;
      lines.push({
        id: `addon-${a.id}`,
        kind: "addon",
        label: a.title,
        qty,
        unit: a.unit,
        unitPrice: a.price,
        amount: a.price * qty,
      });
    });

  const subtotal = lines.reduce((s, l) => s + l.amount, 0);
  const vat = round2(subtotal * VAT_RATE);
  const total = round2(subtotal + vat);

  return {
    lines,
    subtotal,
    vat,
    vatRate: VAT_RATE,
    total,
    perPerson: round2(total / safeGuests),
    guests: safeGuests,
    valid: errors.length === 0,
    errors,
  };
}

/** Simple per-unit experience price (for experience cards and quick quotes). */
function computeExperiencePrice(exp, guests = 1) {
  const qty = exp.priceUnit === "person" ? Math.max(1, guests) : 1;
  const subtotal = exp.price * qty;
  const vat = round2(subtotal * VAT_RATE);
  return { subtotal, vat, total: round2(subtotal + vat), qty };
}

__bind({ computeExperiencePrice: () => computeExperiencePrice, computePackagePrice: () => computePackagePrice });
});

__bind({ BUILDING_CONDITIONS: () => BUILDING_CONDITIONS, CITIES: () => CITIES, CURRENT_SERVICES: () => CURRENT_SERVICES, DIMENSIONS: () => DIMENSIONS, FACILITIES: () => FACILITIES, MAINTENANCE_LEVELS: () => MAINTENANCE_LEVELS, SAMPLE_ANSWERS: () => SAMPLE_ANSWERS, WIZARD_STEPS: () => WIZARD_STEPS });
