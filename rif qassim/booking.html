/* ==== css/variables.css ==== */
/* ==========================================================================
   RIF QASSIM — Design tokens
   Every colour, size, radius, shadow and timing in the product comes from here.
   ========================================================================== */

:root {
  /* ---- Brand palette -------------------------------------------------- */
  --rif-white: #FAF7F1;   /* page ground, warm off-white */
  --rif-paper: #F4EEE3;   /* raised paper, report pages */
  --rif-sand: #ECE3D2;    /* section grounds */
  --rif-stone: #CDBFA6;   /* hairlines, muted surfaces */
  --rif-stone-deep: #A8987C;
  --rif-sage: #98A287;    /* secondary accent, "in progress" */
  --rif-sage-soft: #DCE0D2;
  --rif-olive: #59603F;   /* primary action */
  --rif-olive-deep: #444A2F;
  --rif-earth: #5B3F2C;   /* deep sections, footer */
  --rif-earth-deep: #3F2B1E;
  --rif-ink: #23201C;     /* text */
  --rif-date: #A8683A;    /* single restrained accent: dates, sunset */
  --rif-date-soft: #EBD7C4;

  /* ---- Semantic roles -------------------------------------------------- */
  --color-bg: var(--rif-white);
  --color-surface: var(--rif-paper);
  --color-surface-2: var(--rif-sand);
  --color-text: var(--rif-ink);
  --color-text-muted: #6B6358;
  --color-text-faint: #8F8576;
  --color-line: rgba(35, 32, 28, 0.14);
  --color-line-strong: rgba(35, 32, 28, 0.32);
  --color-action: var(--rif-olive);
  --color-action-hover: var(--rif-olive-deep);
  --color-on-action: var(--rif-white);
  --color-accent: var(--rif-date);
  --color-focus: var(--rif-date);
  --color-overlay: rgba(35, 28, 22, 0.52);

  /* On dark (earth) grounds */
  --color-on-dark: #F4EEE3;
  --color-on-dark-muted: rgba(244, 238, 227, 0.68);
  --color-line-on-dark: rgba(244, 238, 227, 0.2);

  /* Status — desaturated, inside the family */
  --status-confirmed: #59603F;
  --status-confirmed-bg: #E2E4D6;
  --status-pending: #9A7432;
  --status-pending-bg: #F1E6CF;
  --status-cancelled: #94503C;
  --status-cancelled-bg: #F0DDD4;
  --status-completed: #5F574D;
  --status-completed-bg: #E6E0D6;
  --status-error: #9B3F2B;

  /* ---- Typography ------------------------------------------------------ */
  --font-ar: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-en: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-body: var(--font-ar);
  --font-display: var(--font-ar);

  /* Fluid scale (360px → 1440px) */
  --fs-display: clamp(2.75rem, 1.6rem + 5.2vw, 7.25rem);
  --fs-h1: clamp(2.125rem, 1.45rem + 3vw, 4.25rem);
  --fs-h2: clamp(1.75rem, 1.3rem + 2vw, 3.125rem);
  --fs-h3: clamp(1.3125rem, 1.15rem + 0.7vw, 1.75rem);
  --fs-h4: clamp(1.0625rem, 1rem + 0.3vw, 1.25rem);
  --fs-lead: clamp(1.0625rem, 0.98rem + 0.4vw, 1.3125rem);
  --fs-body: 1rem;
  --fs-small: 0.875rem;
  --fs-meta: 0.8125rem;
  --fs-micro: 0.75rem;

  --lh-tight: 1.15;
  --lh-snug: 1.35;
  --lh-body: 1.75;   /* Arabic needs generous leading */

  --fw-light: 300;
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;

  --measure: 62ch;

  /* ---- Spacing (8pt) --------------------------------------------------- */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-7: 3rem;
  --space-8: 4rem;
  --space-9: 6rem;
  --space-10: 8rem;
  --section-y: clamp(4.5rem, 3rem + 6vw, 9rem);
  --gutter: clamp(1.25rem, 0.8rem + 2vw, 2.5rem);

  /* ---- Radius — deliberately small ------------------------------------ */
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-pill: 999px;

  /* ---- Depth: one soft shadow, for floating things only --------------- */
  --shadow-float: 0 18px 48px -18px rgba(52, 38, 26, 0.32), 0 2px 6px rgba(52, 38, 26, 0.06);
  --shadow-lift: 0 10px 28px -16px rgba(52, 38, 26, 0.36);

  /* ---- Motion ---------------------------------------------------------- */
  --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-soft: cubic-bezier(0.32, 0.72, 0, 1);
  --dur-1: 140ms;
  --dur-2: 240ms;
  --dur-3: 420ms;
  --dur-4: 720ms;
  --dur-5: 1100ms;

  /* ---- Layout ---------------------------------------------------------- */
  --container: 1320px;
  --container-wide: 1600px;
  --container-narrow: 820px;
  --header-h: 76px;
  --bottom-nav-h: 64px;

  /* ---- Layers ---------------------------------------------------------- */
  --z-base: 1;
  --z-sticky: 20;
  --z-header: 40;
  --z-bottom-nav: 45;
  --z-overlay: 60;
  --z-drawer: 70;
  --z-toast: 90;

  color-scheme: light;
}

/* English: Latin family leads, Arabic stays as fallback */
:root[lang="en"] {
  --font-body: var(--font-en);
  --font-display: var(--font-en);
  --lh-body: 1.6;
}

@media (max-width: 767px) {
  :root {
    --header-h: 64px;
  }
}

/* ==== css/global.css ==== */
/* ==========================================================================
   RIF QASSIM — Global base
   Logical properties only (inline/block), so RTL is native, not mirrored.
   ========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-padding-top: calc(var(--header-h) + var(--space-4));
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  font-weight: var(--fw-regular);
  line-height: var(--lh-body);
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}

body.has-bottom-nav {
  padding-bottom: 0;
}

img,
svg,
video {
  display: block;
  max-width: 100%;
}

img {
  height: auto;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
  letter-spacing: inherit;
}

button {
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
}

a {
  color: inherit;
  text-decoration-thickness: 1px;
  text-underline-offset: 0.3em;
}

h1, h2, h3, h4, h5, h6, p, figure, blockquote, dl, dd, ul, ol {
  margin: 0;
}

ul[role="list"],
ol[role="list"] {
  list-style: none;
  padding: 0;
}

[hidden] {
  display: none !important;
}

::selection {
  background: var(--rif-date-soft);
  color: var(--rif-ink);
}

/* ---- Focus: always visible for keyboard users ------------------------- */
:focus {
  outline: none;
}

:focus-visible {
  outline: 2px solid var(--color-focus);
  outline-offset: 3px;
  border-radius: var(--radius-xs);
}

.skip-link {
  position: absolute;
  inset-inline-start: var(--space-4);
  top: -100px;
  z-index: var(--z-toast);
  padding: var(--space-3) var(--space-5);
  background: var(--rif-ink);
  color: var(--rif-white);
  border-radius: var(--radius-sm);
  text-decoration: none;
}

.skip-link:focus {
  top: var(--space-4);
}

.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ---- Typography ------------------------------------------------------- */
.display {
  font-family: var(--font-display);
  font-size: var(--fs-display);
  font-weight: var(--fw-light);
  line-height: 1.08;
  letter-spacing: -0.01em;
}

:root[lang="en"] .display {
  letter-spacing: -0.035em;
  line-height: 1;
}

.h1 {
  font-size: var(--fs-h1);
  font-weight: var(--fw-light);
  line-height: var(--lh-tight);
}

.h2 {
  font-size: var(--fs-h2);
  font-weight: var(--fw-light);
  line-height: 1.2;
}

.h3 {
  font-size: var(--fs-h3);
  font-weight: var(--fw-regular);
  line-height: var(--lh-snug);
}

.h4 {
  font-size: var(--fs-h4);
  font-weight: var(--fw-medium);
  line-height: var(--lh-snug);
}

:root[lang="en"] .h1,
:root[lang="en"] .h2 {
  letter-spacing: -0.02em;
}

.lead {
  font-size: var(--fs-lead);
  line-height: 1.75;
  color: var(--color-text-muted);
  max-width: var(--measure);
}

.prose {
  max-width: var(--measure);
}

.prose p + p {
  margin-top: var(--space-4);
}

.small {
  font-size: var(--fs-small);
}

.meta {
  font-size: var(--fs-meta);
  color: var(--color-text-muted);
  line-height: 1.5;
}

.muted {
  color: var(--color-text-muted);
}

/* Section kicker: a short line that names the section's place in the story.
   Sentence case, regular weight — never tracked-out capitals. */
.kicker {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-muted);
}

.kicker::before {
  content: "";
  inline-size: 28px;
  block-size: 1px;
  background: currentColor;
  opacity: 0.6;
}

/* Mono is reserved for references, coordinates and step counters */
.mono,
.ref {
  font-family: var(--font-mono);
  font-feature-settings: "tnum" 1;
  letter-spacing: 0;
}

.num {
  font-family: var(--font-en);
  font-feature-settings: "tnum" 1, "lnum" 1;
  unicode-bidi: isolate;
}

bdi,
.ltr {
  unicode-bidi: isolate;
}

.ltr {
  direction: ltr;
}

/* ---- Layout primitives ------------------------------------------------ */
.container {
  inline-size: 100%;
  max-inline-size: calc(var(--container) + var(--gutter) * 2);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.container--wide {
  max-inline-size: calc(var(--container-wide) + var(--gutter) * 2);
}

.container--narrow {
  max-inline-size: calc(var(--container-narrow) + var(--gutter) * 2);
}

.section {
  padding-block: var(--section-y);
  position: relative;
}

.section--tight {
  padding-block: calc(var(--section-y) * 0.6);
}

.section--sand {
  background: var(--color-surface-2);
}

.section--paper {
  background: var(--color-surface);
}

.section--earth {
  background: var(--rif-earth);
  color: var(--color-on-dark);
}

.section--earth .lead,
.section--earth .meta,
.section--earth .muted,
.section--earth .kicker {
  color: var(--color-on-dark-muted);
}

.stack > * + * {
  margin-top: var(--stack-gap, var(--space-4));
}

.cluster {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--cluster-gap, var(--space-3));
}

.split {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
}

.grid {
  display: grid;
  gap: var(--grid-gap, var(--space-6));
  grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr));
}

.rule {
  border: 0;
  block-size: 1px;
  background: var(--color-line);
  margin: 0;
}

.rule--strong {
  background: var(--color-line-strong);
}

/* The horizon: one recurring line that frames sections */
.horizon {
  position: relative;
}

.horizon::before {
  content: "";
  position: absolute;
  inset-inline: var(--gutter);
  top: 0;
  block-size: 1px;
  background: var(--color-line-strong);
}

/* ---- Contour lines (survey motif) ------------------------------------ */
/* The pattern is a mask, so its colour comes from `color` on the element. */
.contours {
  position: relative;
  isolation: isolate;
}

.contours::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-color: currentColor;
