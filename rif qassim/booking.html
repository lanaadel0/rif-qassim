/* ---- js/services/bookable.js ---- */
__def("js/services/bookable.js", function (__bind) {
/* ==========================================================================
   Bookable items
   One shape for everything a visitor can book: packages, and individual
   experiences / stays. The pricing engine, availability rules, booking page
   and admin view all work with this shape, so there is one booking engine.

   Products (priceUnit "item") are not booked by date; they are added to a
   visit, so they are not bookable on their own.
   ========================================================================== */

const { getPackageById } = __req("js/data/packages.js");
const { getExperienceById } = __req("js/data/experiences.js");
const { store } = __req("js/core/store.js");
const ALL_DAYS = [0, 1, 2, 3, 4, 5, 6];

function experienceAsBookable(e) {
  const perPerson = e.priceUnit === "person";
  return {
    id: e.id,
    kind: "experience",
    category: e.category,
    destinationId: e.destinationId,
    title: e.title,
    summary: e.desc,
    durationHours: e.durationHours,
    timeWindow: null,
    // A stay is priced per night for up to its capacity; experiences per person
    pricing: perPerson
      ? { model: "person", basePrice: e.price }
      : { model: "booking", basePrice: e.price, includedGuests: e.maxGuests, extraGuestPrice: 0 },
    minGuests: e.minGuests,
    maxGuests: e.maxGuests,
    availability: {
      days: e.availability?.days || ALL_DAYS,
      season: e.availability?.season || null,
      dates: e.availability?.dates || null,
      leadDays: 1,
      windowDays: 150,
    },
    includes: [],
    schedule: [],
    addOns: [],
    policy: {
      ar: "الإلغاء مجاني حتى ٢٤ ساعة قبل الموعد (سياسة توضيحية في النموذج).",
      en: "Free cancellation up to 24 hours before (illustrative policy in the prototype).",
    },
    media: e.media,
    tags: e.tags,
  };
}

/** Admin demo edits (store: contentOverrides) on top of the static data. */
function contentOverride(kind, id) {
  return store.get("contentOverrides")?.[kind]?.[id] || null;
}

/**
 * Resolve any bookable id (package or experience). Returns null if it isn't
 * bookable — including items the Rif team has paused, unless includeInactive
 * is set (used for pricing existing bookings, which must not change).
 */
function getBookable(id, { includeInactive = false } = {}) {
  if (!id) return null;
  const pkg = getPackageById(id);
  const exp = pkg ? null : getExperienceById(id);
  if (!pkg && (!exp || exp.priceUnit === "item")) return null;
  const kind = pkg ? "packages" : "experiences";
  const o = contentOverride(kind, id);
  if (o?.active === false && !includeInactive) return null;
  const item = pkg ? { ...pkg, kind: "package" } : experienceAsBookable(exp);
  if (o?.text) item.summary = o.text;
  if (o?.active === false) item.inactive = true;
  return item;
}

__bind({ contentOverride: () => contentOverride, getBookable: () => getBookable });
});

/* ---- js/services/scoring.js ---- */
__def("js/services/scoring.js", function (__bind) {
/* ==========================================================================
   Readiness scoring — SIMULATED FOR THE PROTOTYPE
   A transparent, rule-based score. Every point comes from a specific answer,
   and each dimension returns the "drivers" that explain it, so the result
   page can show why a farm scored what it did. This is an initial read, not a
   feasibility study.

   answers = {
     farmName, city, assetType, distanceKm,
     totalArea, usableArea,
     buildings, rooms, buildingCondition,
     facilities: string[],
     services: string[], currentPrice?, visitorsPerYear?, bookingsPerYear?,
     staff, maintenance, annualCosts,
     uploads: { photos: n, documents: n, pricing: n }
   }
   ========================================================================== */

const { BUILDING_CONDITIONS, CITIES, DIMENSIONS, FACILITIES, MAINTENANCE_LEVELS } = __req("js/data/assessment.js");
const clamp = (n, min = 0, max = 100) => Math.min(max, Math.max(min, n));
const num = (v) => (Number.isFinite(Number(v)) && v !== "" && v !== null ? Number(v) : 0);
const ratio = (v, full) => Math.min(1, Math.max(0, num(v) / full));

const ASSET_BONUS = { "palm-farm": 25, heritage: 25, "mixed-farm": 22, estate: 14, land: 12 };

/* Recommendations shown when a dimension is weak */
const RECOMMENDATIONS = {
  infrastructure: {
    ar: "استكمال الكهرباء والمياه ودورات المياه قبل أي تطوير سياحي.",
    en: "Complete power, water and restrooms before any tourism development.",
  },
  accessibility: {
    ar: "تحسين الطريق المؤدي ولوحات الإرشاد، وتجهيز مواقف واضحة.",
    en: "Improve the access road and signage, and set out clear parking.",
  },
  accommodation: {
    ar: "تأهيل المباني القائمة كغرف ضيافة، أو البدء بنموذج نهاري دون مبيت.",
    en: "Convert existing buildings into guest rooms, or start with a day-visit model.",
  },
  operations: {
    ar: "بناء فريق تشغيل صغير وجدول صيانة، أو ترك التشغيل لريف.",
    en: "Build a small operations team and a maintenance schedule, or let Rif operate.",
  },
  experiences: {
    ar: "تصميم تجارب من طبيعة المزرعة: قطف، ورش، طعام من المحصول.",
    en: "Design experiences from the farm itself: picking, workshops, food from the harvest.",
  },
};

const STRENGTH_COPY = {
  infrastructure: { ar: "المرافق الأساسية جاهزة أو قريبة من الجاهزية.", en: "Core utilities are ready or close to it." },
  accessibility: { ar: "الوصول سهل من المدن الرئيسية.", en: "Easy to reach from the main towns." },
  accommodation: { ar: "يوجد أساس جيد للإقامة يمكن البناء عليه.", en: "A good base for stays to build on." },
  operations: { ar: "إدارة قائمة يمكن تطويرها بدل البدء من الصفر.", en: "Existing management to build on rather than starting from zero." },
  experiences: { ar: "طبيعة المزرعة تصلح لتجارب متنوعة.", en: "The farm's character suits a range of experiences." },
};

/**
 * @returns {{
 *   score: number,
 *   dims: Record<string, number>,
 *   drivers: Record<string, {label:{ar,en}, points:number, max:number}[]>,
 *   strengths: {id, text}[], gaps: {id, text}[], missing: {id, label}[],
 *   confidence: "high"|"medium"|"low"
 * }}
 */
function computeReadiness(answers = {}) {
  const facilities = new Set(answers.facilities || []);
  const services = (answers.services || []).filter((s) => s !== "none");
  const condition = BUILDING_CONDITIONS.find((c) => c.id === answers.buildingCondition) || BUILDING_CONDITIONS[3];
  const city = CITIES.find((c) => c.id === answers.city) || CITIES[CITIES.length - 1];
  const maintenance = MAINTENANCE_LEVELS.find((m) => m.id === answers.maintenance) || MAINTENANCE_LEVELS[2];
  const usable = num(answers.usableArea);
  const rooms = num(answers.rooms);
  const buildings = num(answers.buildings);
  const distance = num(answers.distanceKm);

  const drivers = {};
  const add = (dim, label, points, max) => {
    (drivers[dim] ||= []).push({ label, points: Math.round(points), max });
    return points;
  };

  /* Infrastructure: utilities (82) + building condition (18) */
  let infra = 0;
  FACILITIES.filter((f) => f.infra > 0).forEach((f) => {
    infra += add("infrastructure", f.label, facilities.has(f.id) ? f.infra : 0, f.infra);
  });
  infra += add("infrastructure", { ar: "حالة المباني", en: "Building condition" }, condition.factor * 18, 18);

  /* Accessibility: distance (45) + town access (25) + parking (18) + restrooms (12) */
  let access = 0;
  const distPts = distance <= 10 ? 45 : distance <= 25 ? 38 : distance <= 50 ? 28 : distance <= 90 ? 18 : 8;
  access += add("accessibility", { ar: "المسافة عن المدينة", en: "Distance from town" }, answers.distanceKm === undefined || answers.distanceKm === "" ? 0 : distPts, 45);
  access += add("accessibility", { ar: "موقع المدينة أو المركز", en: "Town location" }, city.access * 25, 25);
  access += add("accessibility", { ar: "المواقف", en: "Parking" }, facilities.has("parking") ? 18 : 0, 18);
  access += add("accessibility", { ar: "دورات المياه للزوار", en: "Visitor restrooms" }, facilities.has("restrooms") ? 12 : 0, 12);

  /* Accommodation: rooms (45) + condition (25) + accommodation facility (15) + buildings (15) */
  let accom = 0;
  accom += add("accommodation", { ar: "عدد الغرف", en: "Number of rooms" }, ratio(rooms, 6) * 45, 45);
  accom += add("accommodation", { ar: "حالة المباني", en: "Building condition" }, buildings > 0 ? condition.factor * 25 : 0, 25);
  accom += add("accommodation", { ar: "مكان مهيأ للمبيت", en: "Space for overnight stays" }, facilities.has("accommodation") ? 15 : 0, 15);
  accom += add("accommodation", { ar: "عدد المباني", en: "Number of buildings" }, ratio(buildings, 3) * 15, 15);

  /* Operations: staff (25) + maintenance (26) + kitchen (12) + visitors (17) + bookings (10) + pricing (10) */
  let ops = 0;
  ops += add("operations", { ar: "العاملون", en: "Staff" }, ratio(answers.staff, 5) * 25, 25);
  ops += add("operations", { ar: "الصيانة", en: "Maintenance" }, maintenance.score, 26);
  ops += add("operations", { ar: "مطبخ قابل للضيافة", en: "Hospitality kitchen" }, facilities.has("kitchen") ? 12 : 0, 12);
  ops += add("operations", { ar: "زوار حاليون", en: "Current visitors" }, ratio(answers.visitorsPerYear, 3000) * 17, 17);
  ops += add("operations", { ar: "حجوزات حالية", en: "Current bookings" }, ratio(answers.bookingsPerYear, 150) * 10, 10);
  ops += add("operations", { ar: "تسعير قائم", en: "Existing pricing" }, num(answers.currentPrice) > 0 ? 10 : 0, 10);

  /* Experiences: asset character (25) + usable area (28) + outdoor (22) + current services (25) */
  let exp = 0;
  exp += add("experiences", { ar: "طبيعة الأصل", en: "Asset character" }, ASSET_BONUS[answers.assetType] ?? 12, 25);
  exp += add("experiences", { ar: "المساحة القابلة للاستخدام", en: "Usable area" }, ratio(usable, 8000) * 28, 28);
  exp += add("experiences", { ar: "مساحات خارجية", en: "Outdoor areas" }, facilities.has("outdoor") ? 22 : 0, 22);
  exp += add("experiences", { ar: "خدمات قائمة", en: "Existing services" }, Math.min(services.length * 10, 25), 25);

  const dims = {
    infrastructure: Math.round(clamp(infra)),
    accessibility: Math.round(clamp(access)),
    accommodation: Math.round(clamp(accom)),
    operations: Math.round(clamp(ops)),
    experiences: Math.round(clamp(exp)),
  };

  const score = Math.round(DIMENSIONS.reduce((s, d) => s + dims[d.id] * d.weight, 0));

  const ranked = DIMENSIONS.map((d) => ({ id: d.id, value: dims[d.id] })).sort((a, b) => b.value - a.value);
  const strengths = ranked.filter((d) => d.value >= 72).slice(0, 3).map((d) => ({ id: d.id, value: d.value, text: STRENGTH_COPY[d.id] }));
  const gaps = ranked
    .filter((d) => d.value < 70)
    .reverse()
    .slice(0, 3)
    .map((d) => ({ id: d.id, value: d.value, text: RECOMMENDATIONS[d.id] }));

  /* Optional information that would sharpen the estimate */
  const missing = [];
  const uploads = answers.uploads || {};
  if (!num(answers.currentPrice)) missing.push({ id: "currentPrice", label: { ar: "الأسعار الحالية", en: "Current pricing" } });
  if (!num(answers.visitorsPerYear)) missing.push({ id: "visitorsPerYear", label: { ar: "عدد الزوار الحاليين", en: "Current visitor numbers" } });
  if (!num(uploads.documents)) missing.push({ id: "documents", label: { ar: "صك الملكية أو المستندات", en: "Title deed or documents" } });
  if (num(uploads.photos) < 5) missing.push({ id: "photos", label: { ar: "صور إضافية للمباني والمساحات (٥ على الأقل)", en: "More photos of buildings and spaces (at least 5)" } });

  const confidence = missing.length <= 1 ? "high" : missing.length <= 2 ? "medium" : "low";

  return { score, dims, drivers, strengths, gaps, missing, confidence };
}

/** A short verdict for the score band (used as the report's headline). */
function scoreBand(score) {
  if (score >= 80) return { id: "strong", label: { ar: "جاهزية عالية", en: "High readiness" }, text: { ar: "المزرعة قريبة من أن تصبح وجهة، وتحتاج تطويرًا محدودًا.", en: "The farm is close to being a destination and needs limited development." } };
  if (score >= 65) return { id: "promising", label: { ar: "فرصة واعدة", en: "Promising opportunity" }, text: { ar: "أساس جيد مع فجوات واضحة يمكن معالجتها في مرحلة التطوير.", en: "A good base with clear gaps that development can close." } };
  if (score >= 45) return { id: "developing", label: { ar: "تحتاج تطويرًا", en: "Needs development" }, text: { ar: "الفرصة قائمة، لكنها تحتاج استثمارًا أوليًا أكبر.", en: "The opportunity exists but needs a larger first investment." } };
  return { id: "early", label: { ar: "مرحلة مبكرة", en: "Early stage" }, text: { ar: "تحتاج المزرعة أساسيات قبل التفكير في التشغيل السياحي.", en: "The farm needs fundamentals before tourism operation." } };
}

__bind({ computeReadiness: () => computeReadiness, scoreBand: () => scoreBand });
});

/* ---- js/services/api.js ---- */
__def("js/services/api.js", function (__bind) {
/* ==========================================================================
   Mock API
   ---------------------------------------------------------------------------
   The UI never imports data files directly for reads/writes that would come
   from a server later — it calls these async functions. To connect a real
   backend (REST, Supabase, Firebase), replace the bodies here; the pages and
   components stay the same.

   A short simulated latency makes loading states real.
   Everything written is stored in this browser only (see core/store.js).
   ========================================================================== */

const { store } = __req("js/core/store.js");
const { uid } = __req("js/core/dom.js");
const { DESTINATIONS, getDestinationById } = __req("js/data/destinations.js");
const { EXPERIENCES, getExperienceById } = __req("js/data/experiences.js");
const { PACKAGES, getPackageById } = __req("js/data/packages.js");
const { SEED_BOOKINGS } = __req("js/data/bookings.js");
const { SEED_FARMS, OWNERS, PIPELINE_STAGES, SEED_STUDY_REQUESTS, getOwnerById } = __req("js/data/farms.js");
const { CITIES, SAMPLE_ANSWERS } = __req("js/data/assessment.js");
const { computePackagePrice } = __req("js/services/pricing.js");
const { getBookable, contentOverride } = __req("js/services/bookable.js");
const { computeReadiness } = __req("js/services/scoring.js");
const { experienceAvailableOn, experienceUpcoming, isBookable, packageDateStatus, today } = __req("js/services/availability.js");
const { toISODate } = __req("js/core/format.js");
const latency = (min = 220, max = 520) =>
  typeof window === "undefined" ? Promise.resolve() : new Promise((r) => setTimeout(r, min + Math.random() * (max - min)));

const clone = (v) => JSON.parse(JSON.stringify(v));
const norm = (s) => String(s || "").toLowerCase().replace(/[\u064B-\u0652]/g, "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").trim();
const textOf = (v) => (v && typeof v === "object" ? `${v.ar || ""} ${v.en || ""}` : String(v || ""));

/* ==========================================================================
   Destinations
   ========================================================================== */

/**
 * @param {{ type?: string, status?: string, q?: string }} filters
 */
/** Add ?simulate=error to a page URL to see its error state (prototype only). */
const simulateError = () =>
  typeof window !== "undefined" && new URLSearchParams(window.location.search).get("simulate") === "error";

/* Admin demo edits applied on read, so public pages and admin agree */
function applyDestination(d) {
  const o = contentOverride("destinations", d.id);
  if (!o) return d;
  return { ...d, status: o.status || d.status, short: o.text || d.short };
}
const isActive = (kind, id) => contentOverride(kind, id)?.active !== false;

async function getDestinations(filters = {}) {
  await latency();
  if (simulateError()) throw new Error("simulated");
  const q = norm(filters.q);
  const order = { open: 0, limited: 1, season: 2, soon: 3 };
  return clone(
    DESTINATIONS.map(applyDestination).filter((d) => !filters.type || filters.type === "all" || d.type === filters.type)
      .filter((d) => !filters.status || filters.status === "all" || d.status === filters.status)
      .filter((d) => !q || norm(`${textOf(d.name)} ${textOf(d.town)} ${textOf(d.short)} ${d.tags.map(textOf).join(" ")}`).includes(q))
      .sort((a, b) => order[a.status] - order[b.status])
  );
}

async function getDestination(id) {
  await latency(160, 360);
  if (simulateError()) throw new Error("simulated");
  const base = getDestinationById(id);
  if (!base) return null;
  const destination = applyDestination(base);
  return clone({
    destination,
    packages: destination.packages.filter((p) => isActive("packages", p)).map((p) => getBookable(p)).filter(Boolean),
    experiences: destination.experiences
      .filter((e) => isActive("experiences", e))
      .map(getExperienceById)
      .filter(Boolean)
      .map((e) => ({ ...e, desc: contentOverride("experiences", e.id)?.text || e.desc })),
  });
}

/* ==========================================================================
   Experiences (packages are listed as the "package" category)
   ========================================================================== */

function packageAsListing(p) {
  return {
    id: p.id,
    category: "package",
    destinationId: p.destinationId,
    title: p.title,
    desc: p.summary,
    durationHours: p.durationHours,
    price: p.pricing.basePrice,
    priceUnit: p.pricing.model === "person" ? "person" : "booking",
    minGuests: p.minGuests,
    maxGuests: p.maxGuests,
    tags: [{ ar: "باقة", en: "Package" }],
    media: p.media,
    isPackage: true,
    _pkg: p,
  };
}

/**
 * @param {{ category?: string, date?: string, guests?: number,
 *           duration?: "short"|"half"|"full"|"stay", priceMax?: number,
 *           destinationId?: string, q?: string }} f
 */
async function getExperiences(f = {}) {
  await latency();
  if (simulateError()) throw new Error("simulated");
  const all = [
    ...EXPERIENCES.filter((e) => isActive("experiences", e.id)).map((e) => ({ ...e, desc: contentOverride("experiences", e.id)?.text || e.desc })),
    ...PACKAGES.filter((p) => isActive("packages", p.id)).map((p) => packageAsListing({ ...p, summary: contentOverride("packages", p.id)?.text || p.summary })),
  ];
  const q = norm(f.q);
  const guests = Number(f.guests) || 0;

  const matchDuration = (h) => {
    switch (f.duration) {
      case "short": return h > 0 && h <= 2;
      case "half": return h > 2 && h <= 5;
      case "full": return h > 5 && h < 24;
      case "stay": return h >= 24;
      default: return true;
    }
  };

  const items = all
    .filter((e) => !f.category || f.category === "all" || e.category === f.category)
    .filter((e) => !f.destinationId || e.destinationId === f.destinationId)
    .filter((e) => !guests || e.priceUnit === "item" || (guests >= e.minGuests && guests <= e.maxGuests))
    .filter((e) => matchDuration(e.durationHours))
    .filter((e) => !f.priceMax || e.price <= Number(f.priceMax))
    .filter((e) => {
      if (!f.date) return true;
      if (e.isPackage) return isBookable(packageDateStatus(e._pkg, f.date));
      return experienceAvailableOn(e, f.date);
    })
    .filter((e) => !q || norm(`${textOf(e.title)} ${textOf(e.desc)} ${(e.tags || []).map(textOf).join(" ")}`).includes(q))
    .map((e) => {
      const { _pkg, ...rest } = e;
      const destination = getDestinationById(e.destinationId);
      return {
        ...rest,
        destinationName: destination?.name,
        upcoming: e.isPackage ? true : experienceUpcoming(e),
      };
    });

  return clone(items);
}

/** Count per category for the current non-category filters (for chip counts). */
async function getExperienceCounts(f = {}) {
  const items = await getExperiences({ ...f, category: "all" });
  return items.reduce((acc, e) => ((acc[e.category] = (acc[e.category] || 0) + 1), acc), { all: items.length });
}

/* ==========================================================================
   Packages & booking
   ========================================================================== */

/** Anything bookable (package or experience), with its destination. */
async function getBookableItem(id) {
  await latency(200, 420);
  if (simulateError()) throw new Error("simulated");
  const item = getBookable(id);
  if (!item) return null;
  return clone({ item, destination: getDestinationById(item.destinationId) });
}

/** Look up a booking created in this browser (for the confirmation page). */
async function getUserBooking(ref) {
  await latency(120, 240);
  const b = store.get("userBookings").find((x) => x.id === ref);
  return b ? clone(enrichBooking(b, store.get("bookingStatuses"))) : null;
}

/** "Notify me when it opens" for destinations in development (demo). */
async function registerInterest({ destinationId, name, phone }) {
  await latency(400, 700);
  const entry = { id: `INT-${uid(5)}`, destinationId, name, phone, createdAt: new Date().toISOString() };
  store.set("interests", (list) => [entry, ...list]);
  return clone(entry);
}

const getFeaturedPackage = () => clone(PACKAGES.find((p) => p.featured) || PACKAGES[0]);

/**
 * Create a DEMO booking. Nothing is charged; the record lives in this
 * browser and appears in the admin bookings view.
 */
async function createBooking(draft) {
  await latency(700, 1200);
  const pkg = getBookable(draft.packageId);
  if (!pkg) throw new Error("package-not-found");
  if (!draft.date || !isBookable(packageDateStatus(pkg, draft.date))) throw new Error("date-unavailable");
  const price = computePackagePrice(pkg, { guests: draft.guests, addOns: draft.addOns });
  if (!price.valid) throw new Error("invalid-guests");

  const now = new Date();
  const ref = `RIF-${String(now.getFullYear()).slice(2)}${String(now.getMonth() + 1).padStart(2, "0")}-${uid(4)}`;
  const booking = {
    id: ref,
    customer: draft.contact?.name?.trim() || (store.get("lang") === "en" ? "Demo guest" : "ضيف تجريبي"),
    phone: draft.contact?.phone || "",
    email: draft.contact?.email || "",
    notes: draft.contact?.notes || "",
    kind: pkg.kind,
    city: "",
    packageId: pkg.id,
    destinationId: pkg.destinationId,
    date: draft.date,
    guests: price.guests,
    addOns: [...(draft.addOns || [])],
    amount: price.total,
    status: "confirmed",
    createdAt: toISODate(now),
    createdAtTime: now.toISOString(),
    channel: "web",
    isDemo: true,
    isUserCreated: true,
  };
  store.set("userBookings", (list) => [booking, ...list]);
  return clone(booking);
}

function enrichBooking(b, statusOverrides) {

  const months = {};
  live.forEach((b) => {

    months[key] = (months[key] || 0) + 1;
  });

  const stageCounts = Object.fromEntries(PIPELINE_STAGES.map((s) => [s.id, 0]));

    pendingBookings: bookings.filter((b) => b.status === "pending").length,
    revenue,

    byPackage,
    months,
    stageCounts,

  });
}

/* ==========================================================================
   Booking engine (one for the whole product)
   Draft handling + quoting + submission. The booking page uses it; any
   future quick-book entry point must use it too, so drafts, prices and
   saved bookings always agree with the admin view.
   ========================================================================== */

const { store } = __req("js/core/store.js");
const { computePackagePrice } = __req("js/services/pricing.js");
const { packageDateStatus, isBookable, firstAvailableDate } = __req("js/services/availability.js");
const { createBooking } = __req("js/services/api.js");
const BOOKING_STEPS = [
  { id: "date", label: { ar: "التاريخ", en: "Date" } },
  { id: "guests", label: { ar: "الضيوف", en: "Guests" } },
  { id: "addons", label: { ar: "الإضافات", en: "Add-ons" } },
  { id: "review", label: { ar: "المراجعة", en: "Review" } },
  { id: "done", label: { ar: "التأكيد", en: "Confirmation" } },
];

const clampGuests = (item, n) => Math.min(item.maxGuests, Math.max(item.minGuests, Math.floor(Number(n) || item.minGuests)));

/**
 * Turn whatever is saved into a valid state for this item.
 * A saved draft for a different item is ignored (but contact details carry over).
 */
function loadDraft(item) {
  const d = store.get("bookingDraft");
  const same = d.packageId === item.id;
  const date = same && d.date && isBookable(packageDateStatus(item, d.date)) ? d.date : null;
  const valid = new Set(item.addOns.map((a) => a.id));
  return {
    date,
    guests: clampGuests(item, same ? d.guests : Math.max(item.minGuests, Math.min(2, item.maxGuests))),
    addOns: same ? (d.addOns || []).filter((id) => valid.has(id)) : [],
    step: same ? Math.min(4, Math.max(1, d.step || 1)) : 1,
    contact: { name: "", phone: "", email: "", notes: "", ...(d.contact || {}) },
  };
}

function saveDraft(item, state) {
  store.set("bookingDraft", {
    packageId: item.id,
    destinationId: item.destinationId,
    date: state.date,
    guests: state.guests,
    addOns: state.addOns,
    step: state.step,
    contact: state.contact,
  });
}

const quote = (item, state) => computePackagePrice(item, { guests: state.guests, addOns: state.addOns });

const suggestDate = (item) => firstAvailableDate(item);


/** Create the demo booking and clear the draft (contact details are kept). */
async function submitBooking(item, state) {
  const booking = await createBooking({
    packageId: item.id,
    date: state.date,
    guests: state.guests,
    addOns: state.addOns,
    contact: state.contact,
  });
  const contact = state.contact;
  store.reset("bookingDraft");
  store.set("bookingDraft", { contact: { ...contact, notes: "" } });
  return booking;
}

});

        <ol class="steps" role="list" data-steps>
          ${BOOKING_STEPS.map((st, i) => html`<li class="steps__item" data-step-item="${i + 1}"><span class="steps__num">${String(i + 1).padStart(2, "0")}</span><span class="steps__label">${L(st.label)}</span></li>`)}
        </ol>
      </div>
      <div class="bk-layout" data-layout>
        <div class="bk-main">
          <div data-step-root></div>
          <div class="bk-nav" data-nav>
            <button type="button" class="btn btn--ghost" data-back>${icon("arrow", { size: "sm", cls: "cal__prev" })} ${t("common.back")}</button>
            <button type="button" class="btn btn--primary btn--lg" data-next></button>
          </div>
        </div>
        <aside class="bk-aside" aria-label="${X("ملخص الحجز", "Booking summary")}" data-aside></aside>
      </div>
    </div>
    <div class="bk-bar" data-bar>
      <button type="button" class="btn btn--secondary btn--icon" data-back aria-label="${t("common.back")}">${icon("arrow", { cls: "cal__prev" })}</button>
      <button type="button" class="bk-bar__total" data-breakdown><strong data-bar-total></strong><span>${X("تفاصيل السعر", "Price details")}</span></button>
      <button type="button" class="btn btn--primary" data-next></button>
    </div>`;
}

/* ==========================================================================
   Steps
   ========================================================================== */

const head = (title, desc) => html`<div class="bk-step__head"><h2 class="bk-step__title" tabindex="-1" data-step-title>${title}</h2>${desc ? html`<p class="muted">${desc}</p>` : ""}</div>`;

function stepDate() {
  return html`<div class="bk-step">
    ${head(X("متى تأتي؟", "When are you coming?"), item.timeWindow ? X(`اليوم من ${L(item.timeWindow)}.`, `The day runs ${L(item.timeWindow)}.`) : X(`المدة ${formatDuration(item.durationHours)}.`, `Duration: ${formatDuration(item.durationHours)}.`))}
    <div class="field" data-field="date">
      <div class="bk-panel" data-cal-host></div>
    </div>
    <div class="bk-picked" data-picked></div>
    <p class="meta">${X("التوافر محاكى لأغراض النموذج ولا يمثل توافرًا حقيقيًا.", "Availability is simulated for the prototype and isn't real availability.")}</p>
  </div>`;
}

function stepGuests() {
  const p = item.pricing;
  const how =
    p.model === "person"
      ? X(`السعر ${formatMoney(p.basePrice)} للشخص.`, `${formatMoney(p.basePrice)} per person.`)
      : p.extraGuestPrice
        ? X(`السعر ${formatMoney(p.basePrice)} للحجز ويشمل ${formatNumber(p.includedGuests)} ضيوف، وكل ضيف إضافي ${formatMoney(p.extraGuestPrice)}.`, `${formatMoney(p.basePrice)} per booking including ${p.includedGuests} guests; each extra guest ${formatMoney(p.extraGuestPrice)}.`)
        : X(`السعر ${formatMoney(p.basePrice)} للحجز حتى ${count(item.maxGuests, "guests")}.`, `${formatMoney(p.basePrice)} per booking, up to ${count(item.maxGuests, "guests")}.`);
  return html`<div class="bk-step">
    ${head(X("كم شخصًا؟", "How many people?"), how)}
    <div class="bk-panel">
      ${stepper({ name: "guests", label: X("عدد الضيوف", "Guests"), value: s.guests, min: item.minGuests, max: item.maxGuests, unitLabel: (n) => count(n, "guests"), hint: X(`من ${formatNumber(item.minGuests)} إلى ${formatNumber(item.maxGuests)} ضيوف لهذا الحجز.`, `${item.minGuests} to ${item.maxGuests} guests for this booking.`) })}
    </div>
  </div>`;
}

function stepAddons() {
  return html`<div class="bk-step">
    ${head(X("أضف ما يكمل يومك.", "Add what completes your day."), X("كل الإضافات اختيارية، ويتغير السعر فورًا في الملخص.", "All add-ons are optional; the summary updates as you choose."))}
    ${item.addOns.length
      ? addOnsGroup(item, s.addOns)
      : html`<p class="note note--neutral">${icon("info")}<span>${X("لا توجد إضافات لهذا الحجز. انتقل إلى المراجعة.", "There are no add-ons for this booking. Continue to review.")}</span></p>`}
  </div>`;
}

function stepReview() {
  const addOnNames = s.addOns.map((id) => L(item.addOns.find((a) => a.id === id)?.title)).filter(Boolean);
  const edit = (n) => html`<button type="button" class="btn btn--link" data-goto="${n}" style="font-size:var(--fs-small)">${t("common.edit")}</button>`;
  return html`<div class="bk-step">
    ${head(X("راجع حجزك.", "Review your booking."))}
    <dl class="bk-review">
      <div><dt>${X("التاريخ", "Date")}</dt><dd>${formatDate(s.date)}</dd>${edit(1)}</div>
      <div><dt>${X("الضيوف", "Guests")}</dt><dd>${count(s.guests, "guests")}</dd>${edit(2)}</div>
      <div><dt>${X("الإضافات", "Add-ons")}</dt><dd>${addOnNames.length ? addOnNames.join("، ") : X("بدون إضافات", "None")}</dd>${item.addOns.length ? edit(3) : html`<span></span>`}</div>
    </dl>
    <form class="bk-form" data-contact novalidate>
      <h3 class="h4" style="grid-column:1/-1;margin-top:var(--space-4)">${X("بيانات التواصل", "Contact details")}</h3>
      ${contactFields(s.contact)}
      ${choiceGroup({ name: "agree", type: "checkbox", rules: "minChecked:1", cols: "1fr", value: s.contact.agree ? ["yes"] : [], options: [{ value: "yes", title: X("أفهم أن هذا حجز تجريبي في نموذج ما قبل الإطلاق، ولن تتم أي عملية دفع.", "I understand this is a demo booking in a pre-launch prototype, and no payment will be taken.") }] })}
    </form>
    <p class="meta">${L(item.policy)}</p>
  </div>`;
}

function confirmation(booking) {
  return html`
    <div class="bk-done contours" role="status" aria-live="polite">
      <span class="bk-done__mark">${icon("check")}</span>
      <div class="stack" style="--stack-gap:var(--space-3)">
        <h2 class="h1" tabindex="-1" data-step-title>${X("تم تأكيد تجربتك.", "Your experience is confirmed.")}</h2>
        <p class="muted">${X("احتفظ برقم الحجز. تجده أيضًا في حجوزات فريق ريف.", "Keep your reference. It also appears in the Rif team's bookings.")}</p>
      </div>
      <span class="bk-done__notice">${icon("info", { size: "sm" })} ${DEMO_NOTICE}</span>
      ${bookingDetails(booking, item, destination)}
      <div class="bk-done__actions">
        <a class="btn btn--primary" href="${route("destination", { id: item.destinationId })}">${X(`عودة إلى ${destination?.name.ar}`, `Back to ${destination?.name.en}`)}</a>
        <a class="btn btn--secondary" href="${route("experiences")}">${X("تصفّح تجارب أخرى", "Browse more experiences")}</a>
        <a class="btn btn--ghost" href="${route("booking", { package: item.id })}">${X("حجز جديد", "New booking")}</a>
      </div>
    </div>`;
}

const STEP_VIEWS = [null, stepDate, stepGuests, stepAddons, stepReview];

/* ==========================================================================
   Rendering
   ========================================================================== */

function renderProgress(step) {
  $("[data-counter]").innerHTML = String(html`<strong>${String(step).padStart(2, "0")}</strong> / 05`);
  $$("[data-step-item]").forEach((li) => {
    const n = Number(li.dataset.stepItem);
    li.classList.toggle("is-done", n < step || step === 5);
    li.classList.toggle("is-current", n === step && step !== 5);
    n === step ? li.setAttribute("aria-current", "step") : li.removeAttribute("aria-current");
  });
}

function renderSummary() {
  const q = quote(item, s);
  const addOnCount = s.addOns.length;
  mount(
    $("[data-aside]"),
    html`<div class="bk-summary">
      <div class="bk-summary__head">
        ${renderMedia(item.media, { label: false })}
        <div class="stack" style="--stack-gap:var(--space-1)">
          <p class="h4">${L(item.title)}</p>
          <p class="meta">${L(destination?.name)}، ${L(destination?.town)}</p>
        </div>
      </div>
      <dl class="bk-summary__facts">
        <div><dt>${X("التاريخ", "Date")}</dt><dd class="${s.date ? "" : "is-empty"}">${s.date ? formatDate(s.date, { weekday: "short", day: "numeric", month: "long" }) : X("لم يُختر بعد", "Not chosen yet")}</dd></div>
        <div><dt>${X("الضيوف", "Guests")}</dt><dd>${count(s.guests, "guests")}</dd></div>
        <div><dt>${X("الإضافات", "Add-ons")}</dt><dd class="${addOnCount ? "" : "is-empty"}">${addOnCount ? formatNumber(addOnCount) : X("لا شيء", "None")}</dd></div>
      </dl>
      ${priceBreakdown(q)}
      <p class="bk-demo">${icon("info", { size: "sm" })}<span>${X("حجز تجريبي: لا يتم أي دفع، والأسعار توضيحية.", "Demo booking: no payment is taken and prices are illustrative.")}</span></p>
    </div>`
  );
  $$("[data-bar-total]").forEach((el) => (el.textContent = formatMoney(q.total, { decimals: q.total % 1 ? 2 : 0 })));
}

function renderNav() {
  const label = s.step === 4 ? X("أكّد الحجز التجريبي", "Confirm demo booking") : t("common.next");
  $$("[data-next]").forEach((b) => (b.innerHTML = String(html`${label}${s.step < 4 ? html` ${icon("arrow", { size: "sm" })}` : ""}`)));
  $$("[data-back]").forEach((b) => {
    b.disabled = s.step === 1;
    b.style.visibility = s.step === 1 ? "hidden" : "";
  });
}

function renderPicked() {
  const el = $("[data-picked]");
  if (!el) return;
  mount(
    el,
    s.date
      ? html`<span>${formatDate(s.date)}</span><span class="meta">${packageDateStatus(item, s.date) === "limited" ? X("أماكن محدودة في هذا اليوم", "Limited places this day") : X("متاح للحجز التجريبي", "Open for demo booking")}</span>`
      : html`<span class="muted">${X("اختر يومًا من التقويم.", "Pick a day on the calendar.")}</span>`
  );
}

function renderStep({ focus = true } = {}) {
  const root = $("[data-step-root]");
  mount(root, STEP_VIEWS[s.step]());
  renderProgress(s.step);
  renderNav();
  renderSummary();

  if (s.step === 1) {
    createCalendar($("[data-cal-host]", root), {
      value: s.date,
      month: suggestDate(item),
      statusFn: (d) => packageDateStatus(item, d),
      onSelect: (iso) => {
        s.date = iso;
        clearError($('[data-field="date"]', root));
        persist();
        renderPicked();
        renderSummary();
      },
    });
    renderPicked();
  }
  if (s.step === 4) bindLiveValidation($("[data-contact]", root));

  if (focus) {
    $(".bk-progress")?.scrollIntoView({ behavior: "smooth", block: "start" });
    setTimeout(() => $("[data-step-title]", root)?.focus({ preventScroll: true }), 50);
  }
}

const persist = () => saveDraft(item, s);
const persistSoon = debounce(persist, 250);

/* ==========================================================================
   Validation & navigation
   ========================================================================== */

function validateStep() {
  const root = $("[data-step-root]");
  if (s.step === 1) {
    if (!s.date || !isBookable(packageDateStatus(item, s.date))) {
      showError($('[data-field="date"]', root), X("اختر تاريخًا متاحًا من التقويم.", "Choose an available date on the calendar."));
      $('[data-field="date"]', root).scrollIntoView({ behavior: "smooth", block: "center" });
      return false;
    }
  }
  if (s.step === 2) {
    const { valid } = validateForm(root);
    if (!valid) return false;
  }
  if (s.step === 4) {
    const form = $("[data-contact]", root);
    const { valid } = validateForm(form);
    if (!valid) {
      toast(t("error.fixBelow"), { type: "error" });
      return false;
    }
  }
  return true;
}

function goTo(step) {
  s.step = Math.min(4, Math.max(1, step));
  persist();
  renderStep();
}

async function next() {
  if (!validateStep()) return;
  if (s.step < 4) return goTo(s.step + 1);
  await submit();
}

async function submit() {
  const buttons = $$("[data-next]");
  buttons.forEach((b) => {
    b.classList.add("is-loading");
    b.disabled = true;
  });
  try {
    const booking = await submitBooking(item, s);
    const u = new URL(location.href);
    u.search = new URLSearchParams({ ref: booking.id }).toString();
    history.replaceState(null, "", u);
    showConfirmation(booking);
  } catch (err) {
    if (err.message === "date-unavailable") {
      s.date = null;
      goTo(1);
      setTimeout(() => showError($('[data-field="date"]'), X("لم يعد هذا التاريخ متاحًا. اختر تاريخًا آخر.", "That date is no longer available. Choose another.")), 120);
    } else {
      toast(X("تعذّر تأكيد الحجز. أعد المحاولة.", "Couldn't confirm the booking. Try again."), { type: "error" });
    }
  } finally {
    buttons.forEach((b) => {
      b.classList.remove("is-loading");
      b.disabled = false;
    });
  }
}

function showConfirmation(booking) {
  renderProgress(5);
  $("[data-layout]").classList.add("is-done");
  $("[data-aside]").remove();
  $("[data-nav]").remove();
  $("[data-bar]")?.remove();
  document.body.classList.remove("has-bk-bar");
  mount($("[data-step-root]"), confirmation(booking));
  $(".bk-progress")?.scrollIntoView({ behavior: "smooth", block: "start" });
  setTimeout(() => $("[data-step-title]")?.focus({ preventScroll: true }), 60);
  toast(X(`تم تأكيد الحجز ${booking.id}.`, `Booking ${booking.id} confirmed.`));
}

function wire() {
  on(main, "click", "[data-next]", next);
  on(main, "click", "[data-back]", () => goTo(s.step - 1));
  on(main, "click", "[data-goto]", (e, b) => goTo(Number(b.dataset.goto)));
  on(main, "click", "[data-breakdown]", () =>
    openModal({ title: X("تفاصيل السعر", "Price details"), body: html`<div class="stack" style="--stack-gap:var(--space-5)">${priceBreakdown(quote(item, s), { date: s.date })}<p class="bk-demo">${icon("info", { size: "sm" })}<span>${DEMO_NOTICE}</span></p></div>` })
  );

  initSteppers(main, { unitLabel: (n) => count(n, "guests") });

  main.addEventListener("input", (e) => {
    const root = $("[data-step-root]");
    if (e.target.name === "guests") {
      if (e.target.value === "") return;
      s.guests = clampGuests(item, e.target.value);
      persist();
      renderSummary();
    } else if (e.target.closest("[data-contact]")) {
      const v = readForm($("[data-contact]", root));
      s.contact = { name: v.name, phone: v.phone, email: v.email, notes: v.notes, agree: (v.agree || []).includes("yes") };
      persistSoon();
    }
  });
  main.addEventListener("change", (e) => {
    if (e.target.name === "addOns") {
      s.addOns = $$('input[name="addOns"]:checked', main).map((i) => i.value);
      persist();
      renderSummary();
    } else if (e.target.name === "agree") {
      main.dispatchEvent(new Event("input", { bubbles: true }));
      s.contact.agree = e.target.checked;
      persist();
    }
  });
  main.addEventListener("submit", (e) => {
    e.preventDefault();
    next();
  });
}

/* ==========================================================================
   Boot
   ========================================================================== */

function frameSkeleton() {
  return html`<section class="band band--compact" aria-busy="true"><div class="band__veil"></div>
    <div class="container container--wide band__inner">
      <div class="skeleton" style="height:1em;width:200px;opacity:.2"></div>
      <div class="skeleton" style="height:3.5rem;width:min(560px,80%);opacity:.2"></div>
      <div class="skeleton" style="height:1em;width:min(420px,70%);opacity:.2"></div>
    </div></section>
  <div class="container container--wide bk-page">
    <div class="bk-layout"><div class="stack"><div class="skeleton" style="height:2.2rem;width:50%"></div><div class="skeleton" style="height:360px"></div></div><div class="skeleton" style="height:420px"></div></div>
  </div>`;
}

function stateScreen(content) {
  // No band on these screens: switch the header to its solid form
  $("[data-header]")?.classList.add("is-scrolled");
  mount(main, html`<div class="container" style="padding-block:calc(var(--header-h) + var(--space-8)) var(--space-9)">${content}</div>`);
}

async function boot() {
  const ref = getParam("ref");
  mount(main, frameSkeleton());

  // Reopen a confirmation made in this browser
  if (ref) {
    const booking = await api.getUserBooking(ref);
    item = booking && getBookable(booking.packageId, { includeInactive: true });
    if (!booking || !item) {
      stateScreen(emptyState({
        title: X("لم نجد هذا الحجز في هذا المتصفح", "This booking isn't in this browser"),
        text: X("الحجوزات التجريبية تُحفظ في المتصفح الذي أُنشئت فيه فقط.", "Demo bookings are stored only in the browser they were made in."),
        icon: "calendar",
        action: html`<a class="btn btn--primary btn--sm" href="${route("experiences")}">${X("تصفّح التجارب", "Browse experiences")}</a>`,
      }));
      return;
    }
    destination = getDestinationById(item.destinationId);
    document.title = `${X("تم تأكيد الحجز", "Booking confirmed")} — ${t("brand.name")}`;
    mount(main, frame());
    playBand(main);
    showConfirmation(booking);
    return;
  }

  const id = getParam("package") || store.get("bookingDraft").packageId;
  if (!id) {
    stateScreen(emptyState({
      title: X("ماذا تريد أن تحجز؟", "What would you like to book?"),
      text: X("اختر باقة أو تجربة، وسنكمل الحجز من هنا.", "Choose a package or experience, and we'll continue from here."),
      icon: "calendar",
      action: html`<div class="cluster" style="justify-content:center"><a class="btn btn--primary btn--sm" href="${route("experiences")}">${X("تصفّح التجارب", "Browse experiences")}</a><a class="btn btn--secondary btn--sm" href="${route("destinations")}">${t("nav.destinations")}</a></div>`,
    }));
    return;
  }

  let data;
  try {
    data = await api.getBookableItem(id);
  } catch {
    stateScreen(errorState(X("تعذّر تحميل تفاصيل الحجز. تحقق من اتصالك ثم أعد المحاولة.", "Couldn't load the booking details. Check your connection and try again.")));
    on(main, "click", "[data-retry]", () => {
      const u = new URL(location.href);
      u.searchParams.delete("simulate");
      location.replace(u);
    });
    return;
  }
  if (!data) {
    stateScreen(emptyState({
      title: X("هذا العنصر غير متاح للحجز", "This can't be booked"),
      text: X("ربما تغيّر الرابط، أو أن المنتج يُستلم عند الزيارة ولا يُحجز بتاريخ.", "The link may have changed, or it's a product collected on a visit rather than booked by date."),
      icon: "calendar",
      action: html`<a class="btn btn--primary btn--sm" href="${route("experiences")}">${X("تصفّح التجارب", "Browse experiences")}</a>`,
    }));
    return;
  }

  item = data.item;
  destination = data.destination;
  document.title = `${L(item.title)} — ${X("الحجز", "Booking")} — ${t("brand.name")}`;
  s = loadDraft(item);
  persist();
  mount(main, frame());
  playBand(main);
  document.body.classList.add("has-bk-bar");
  wire();
  renderStep({ focus: false });
}

boot();
